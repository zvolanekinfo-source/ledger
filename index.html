<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — fakturační kniha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#182420;
    --ink-soft:#5C6B66;
    --paper:#EEF0EA;
    --surface:#FFFFFF;
    --line:#D7D9CF;
    --accent:#1F5C4D;
    --accent-soft:#DCE8E2;
    --amber:#B8802B;
    --amber-soft:#F3E6CD;
    --red:#AE4530;
    --red-soft:#F3DCD4;
    --inv-accent:#1F5C4D;
    --inv-accent-soft:#DCE8E2;
    --inv-accent-tint:rgba(31,92,77,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .num{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--ink);
    color:#EDEFEA;
    display:flex;
    flex-direction:column;
    padding:24px 0;
  }
  .brand{
    padding:0 22px 20px 22px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:16px;
  }
  .brand .display{font-size:22px;font-weight:600;letter-spacing:0.3px;color:#fff;}
  .brand .sub{font-size:11px;color:#9BAAA3;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px;}
  .navitem{
    display:flex;align-items:center;gap:10px;
    padding:11px 22px;
    font-size:14px;
    color:#C9D2CC;
    border-left:3px solid transparent;
    transition:background .15s;
  }
  .navitem:hover{background:rgba(255,255,255,0.05);}
  .navitem.active{
    background:rgba(255,255,255,0.07);
    color:#fff;
    border-left:3px solid var(--accent-soft);
  }
  .navitem .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7C8B84;width:18px;}
  .sidebar-foot{margin-top:auto;padding:16px 22px 0 22px;font-size:11px;color:#647069;border-top:1px solid rgba(255,255,255,0.1);}

  /* MAIN */
  .main{flex:1;padding:36px 44px;max-width:1180px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;}
  .pagehead h1{font-size:28px;margin:0 0 4px 0;font-weight:600;}
  .pagehead .desc{color:var(--ink-soft);font-size:14px;margin:0;}
  .btn{
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:3px;
    font-size:14px;
    font-weight:500;
  }
  .btn:hover{background:#0f1815;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{background:#fff;}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-soft);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.small{padding:6px 12px;font-size:12.5px;}

  /* CARDS */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;}
  .card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:8px;}
  .card .value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .card .value.amber{color:var(--amber);}
  .card .value.red{color:var(--red);}
  .card .value.accent{color:var(--accent);}

  /* TABLE */
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;
    color:var(--ink-soft);padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;
  }
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAF6;}
  .rowlink{cursor:pointer;}
  .empty{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty .display{font-size:18px;color:var(--ink);margin-bottom:6px;}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:0.2px;}
  .pill.paid{background:var(--accent-soft);color:var(--accent);}
  .pill.pending{background:var(--amber-soft);color:var(--amber);}
  .pill.overdue{background:var(--red-soft);color:var(--red);}

  /* FILTER BAR */
  .filter-bar{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:20px;}
  .filter-presets{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;}
  .chip:hover{background:var(--paper);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .filter-row .field{margin-bottom:0;}
  .filter-row .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
  .filter-row input,.filter-row select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:13.5px;background:#fff;color:var(--ink);}
  .filter-row input:focus,.filter-row select:focus{outline:none;border-color:var(--accent);}
  .filter-clear{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:12.5px;padding:0;margin-top:12px;}

  /* CHART */
  .chart-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:24px;}
  .chart-card .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .chart-card .chart-head .display{font-size:16px;font-weight:600;}
  .chart-card .chart-head .chart-total{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;color:var(--accent);}

  /* FORMS */
  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 28px;max-width:840px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:60px;}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:24px 0 12px 0;border-top:1px solid var(--line);padding-top:18px;}
  .section-title:first-child{border-top:none;padding-top:0;margin-top:0;}

  .items-table{width:100%;border-collapse:collapse;margin-bottom:10px;table-layout:fixed;}
  .items-table th{font-size:11px;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  .items-table td{padding:6px 8px;vertical-align:top;}
  .items-table input,.items-table select{padding:7px 8px;font-size:13.5px;width:100%;box-sizing:border-box;}
  .items-table .col-desc{width:30%;}
  .items-table .col-qty{width:10%;}
  .items-table .col-unit{width:9%;}
  .items-table .col-price{width:14%;}
  .items-table .col-vat{width:11%;}
  .items-table .col-total{width:17%;}
  .items-table .col-remove{width:32px;}
  .items-table-wrap{overflow-x:auto;}
  .totals-box{margin-left:auto;width:260px;font-size:14px;}
  .totals-box .trow{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-soft);}
  .totals-box .trow.grand{color:var(--ink);font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-family:'IBM Plex Mono',monospace;}
  .formfoot{display:flex;gap:10px;margin-top:22px;align-items:center;}
  .btn-link{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:14px;padding:10px 4px;}
  .btn-link:hover{color:var(--ink);}

  /* SEARCH */
  .search-row{margin-bottom:16px;}
  .search-input{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:#fff;}
  .search-input:focus{outline:none;border-color:var(--accent);}

  /* CLIENT COMBO */
  .combo-field{position:relative;}
  .client-detail-box{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px 4px 18px;margin:-4px 0 18px 0;}
  .combo-list{
    position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:4px;margin-top:4px;max-height:220px;overflow-y:auto;box-shadow:0 6px 18px rgba(24,36,32,0.1);
    z-index:20;display:none;
  }
  .combo-list.open{display:block;}
  .combo-item{padding:9px 12px;font-size:13.5px;cursor:pointer;}
  .combo-item:hover,.combo-item.hl{background:var(--accent-soft);}
  .combo-item .sub{font-size:11.5px;color:var(--ink-soft);}
  .combo-empty{padding:12px;font-size:13px;color:var(--ink-soft);}

  /* INVOICE IMPORT */
  .dropzone{
    border:2px dashed var(--line);border-radius:8px;padding:40px 24px;text-align:center;
    color:var(--ink-soft);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone .display{font-size:17px;color:var(--ink);margin-bottom:6px;}
  .import-status{margin-top:16px;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .import-error{background:var(--red-soft);color:var(--red);font-size:13.5px;padding:10px 14px;border-radius:4px;margin-top:14px;}
  .import-preview{margin-top:22px;border-top:1px solid var(--line);padding-top:20px;}
  .import-preview .row{display:flex;gap:24px;margin-bottom:14px;font-size:13.5px;}
  .import-preview .col{flex:1;}
  .import-preview .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:4px;}
  .import-preview .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-left:6px;}
  .iconbtn{background:transparent;border:none;color:var(--ink-soft);font-size:13px;padding:4px 6px;}
  .iconbtn:hover{color:var(--red);}
  .actions-cell{display:flex;gap:8px;}

  /* INVOICE PREVIEW */
  .preview-wrap{display:flex;gap:24px;align-items:flex-start;}
  .invoice-sheet{
    background:var(--surface);width:760px;padding:0;border:1px solid var(--line);
    position:relative;overflow:hidden;border-radius:8px;
    box-shadow:0 2px 18px rgba(24,36,32,0.06);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
  }
  .invoice-sheet .inv-body{padding:40px 48px 48px 48px;}

  /* header band */
  .invoice-sheet .inv-header{
    display:flex;justify-content:space-between;align-items:center;gap:20px;
    background:var(--inv-accent);color:#fff;padding:32px 48px;
  }
  .invoice-sheet .inv-header-left{display:flex;align-items:center;gap:16px;min-width:0;}
  .invoice-sheet .inv-logo{width:56px;height:56px;border-radius:10px;object-fit:cover;background:rgba(255,255,255,0.14);flex-shrink:0;}
  .invoice-sheet .inv-logo-placeholder{
    width:56px;height:56px;border-radius:10px;background:rgba(255,255,255,0.14);
    border:1px dashed rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;
    font-size:10px;color:rgba(255,255,255,0.75);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;text-align:center;
  }
  .invoice-sheet .inv-co-name{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#fff;line-height:1.25;}
  .invoice-sheet .inv-co-tagline{font-size:12.5px;color:rgba(255,255,255,0.78);margin-top:3px;}
  .invoice-sheet .inv-header-right{text-align:right;flex-shrink:0;}
  .invoice-sheet .inv-doctitle{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:#fff;letter-spacing:0.5px;}
  .invoice-sheet .inv-docnum{font-family:'IBM Plex Mono',monospace;color:rgba(255,255,255,0.85);font-size:13px;margin-top:4px;}

  /* meta strip under header */
  .invoice-sheet .inv-meta{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
    background:var(--inv-accent-soft);padding:16px 48px;
  }
  .invoice-sheet .inv-meta .k{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--inv-accent);opacity:0.8;margin-bottom:3px;font-weight:600;}
  .invoice-sheet .inv-meta .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:var(--ink);}

  /* parties */
  .invoice-sheet .parties{display:flex;justify-content:space-between;margin:28px 0 26px 0;gap:24px;}
  .invoice-sheet .party{flex:1;font-size:13.5px;line-height:1.55;background:var(--inv-accent-tint);border:1px solid var(--inv-accent-soft);border-radius:8px;padding:16px 18px;}
  .invoice-sheet .party .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--inv-accent);font-weight:700;margin-bottom:8px;}
  .invoice-sheet .party .nm{font-weight:700;font-size:15px;margin-bottom:3px;color:var(--ink);}

  .invoice-sheet table.lines{width:100%;border-collapse:collapse;margin-bottom:18px;border-radius:6px;overflow:hidden;}
  .invoice-sheet table.lines thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:#fff;
    background:var(--inv-accent);padding:10px 10px;font-weight:600;
  }
  .invoice-sheet table.lines th:first-child{border-top-left-radius:6px;}
  .invoice-sheet table.lines th:last-child{border-top-right-radius:6px;}
  .invoice-sheet table.lines td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .invoice-sheet table.lines tbody tr:nth-child(even){background:var(--inv-accent-tint);}
  .invoice-sheet table.lines td.num,.invoice-sheet table.lines th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}

  .invoice-sheet .bottom{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px;gap:24px;}
  .invoice-sheet .paybox{flex:1;font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .invoice-sheet .paybox .k{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--inv-accent);font-weight:700;margin-bottom:8px;}
  .invoice-sheet .paybox .prow{display:flex;justify-content:space-between;padding:3px 0;gap:10px;}
  .invoice-sheet .paybox .prow span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  .invoice-sheet .qrbox{text-align:center;font-size:11px;color:var(--ink-soft);flex-shrink:0;}
  .invoice-sheet .qrbox .qrimg{border:1px solid var(--line);padding:8px;background:#fff;display:inline-block;margin-bottom:6px;border-radius:6px;}
  .invoice-sheet .totals{width:250px;flex-shrink:0;}
  .invoice-sheet .totals .trow{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--ink-soft);}
  .invoice-sheet .totals .trow.grand{
    font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:700;color:#fff;
    background:var(--inv-accent);border-radius:6px;margin-top:8px;padding:12px 14px;
  }
  .invoice-sheet .note{margin-top:22px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;white-space:pre-wrap;}

  /* signature / stamp row */
  .invoice-sheet .signoff{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;gap:24px;}
  .invoice-sheet .signoff-terms{flex:1;font-size:11px;color:var(--ink-soft);line-height:1.5;white-space:pre-wrap;}
  .invoice-sheet .signbox{width:210px;flex-shrink:0;text-align:center;position:relative;min-height:92px;}
  .invoice-sheet .signbox .sig-stack{position:relative;height:60px;display:flex;align-items:flex-end;justify-content:center;}
  .invoice-sheet .signbox img.sig-img{max-height:56px;max-width:180px;object-fit:contain;position:relative;z-index:2;}
  .invoice-sheet .signbox img.co-stamp-img{
    max-height:82px;max-width:120px;object-fit:contain;position:absolute;left:50%;bottom:-6px;
    transform:translateX(-50%) rotate(-6deg);opacity:0.85;z-index:1;mix-blend-mode:multiply;
  }
  .invoice-sheet .signbox .sig-line{border-top:1px solid var(--ink);margin-top:6px;padding-top:6px;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}

  .invoice-sheet .paid-ribbon{
    position:absolute;top:250px;right:48px;z-index:5;
    border:3px solid var(--inv-accent);color:var(--inv-accent);background:rgba(255,255,255,0.9);
    font-family:'Fraunces',serif;font-weight:700;font-size:24px;
    padding:7px 16px;border-radius:6px;transform:rotate(-9deg);
    letter-spacing:2px;opacity:0.9;
  }
  .invoice-sheet .inv-footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);}

  .preview-side{width:220px;display:flex;flex-direction:column;gap:8px;}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;background:var(--surface);}
  .login-side{
    flex:1 1 46%;
    position:relative;
    overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:56px 56px;
    background:
      radial-gradient(560px 420px at 15% 12%, rgba(220,232,226,0.16), transparent 60%),
      radial-gradient(680px 520px at 88% 90%, rgba(184,128,43,0.14), transparent 55%),
      linear-gradient(155deg, #14201c 0%, var(--ink) 55%, #0f1815 100%);
    color:#EDEFEA;
  }
  .login-side::before{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.09) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(650px 500px at 20% 15%, #000 0%, transparent 70%);
    mask-image:radial-gradient(650px 500px at 20% 15%, #000 0%, transparent 70%);
    pointer-events:none;
  }
  .login-side .side-top{position:relative;z-index:1;}
  .login-side .side-mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:11px;
    background:rgba(220,232,226,0.12);border:1px solid rgba(220,232,226,0.22);
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:#fff;
    margin-bottom:22px;
  }
  .login-side .side-brand{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:#fff;margin-bottom:8px;}
  .login-side .side-sub{font-size:14.5px;color:#AEBBB4;max-width:320px;line-height:1.55;}
  .login-side .side-foot{position:relative;z-index:1;font-size:12px;color:#7C8B84;letter-spacing:0.3px;}
  .login-form-side{
    flex:1 1 54%;
    display:flex;align-items:center;justify-content:center;
    padding:40px;
  }
  .login-card{width:100%;max-width:380px;padding:0;}
  .login-card .brand-head{margin-bottom:26px;}
  .login-card .display{font-size:24px;margin-bottom:3px;font-weight:600;}
  .login-card .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:0;}
  .login-card .field{margin-bottom:14px;}
  .login-card .switch{font-size:13px;color:var(--ink-soft);margin-top:14px;text-align:center;}
  .login-card .switch a{color:var(--accent);cursor:pointer;text-decoration:underline;}
  .login-error{background:var(--red-soft);color:var(--red);font-size:13px;padding:9px 12px;border-radius:4px;margin-bottom:16px;}

function fmt(n){ return (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){ const d = new Date(dateStr); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function stripDiacritics(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function hexToRgba(hex, alpha){
  const h = (hex||'#1F5C4D').replace('#','');
  const full = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const r = parseInt(full.substring(0,2),16)||0, g = parseInt(full.substring(2,4),16)||0, b = parseInt(full.substring(4,6),16)||0;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ---------- SUPABASE STORAGE SHIM ----------
   Nahrazuje window.storage (dostupné jen v Claude artefaktech) vlastní
   implementací nad Supabase REST API, aby appka fungovala i po nahrání
   na GitHub Pages / kamkoliv jinam mimo Claude.
   Vyžaduje v Supabase tabulku "app_storage" (viz SQL v komentáři níže). */
const SUPABASE_URL = 'https://jucphmkmujjhxymvguhc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wk2kCIi0aM_wq-ZEAGF8OA_m9D4gGaG';
const SUPABASE_REST = SUPABASE_URL + '/rest/v1';

/*
  SQL pro Supabase (SQL Editor -> New query -> spustit jednou):

  create table if not exists app_storage (
    key text primary key,
    value text,
    updated_at timestamptz default now()
  );

  alter table app_storage enable row level security;

  create policy "public read/write app_storage"
  on app_storage for all
  using (true)
  with check (true);
*/

async function sbRequest(path, options = {}){
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    ...(options.headers || {})
  };
  const res = await fetch(SUPABASE_REST + path, { ...options, headers });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  return res;
}

window.storage = {
  async get(key){
    const rows = await (await sbRequest(`/app_storage?key=eq.${encodeURIComponent(key)}&select=value`)).json();
    if(!rows.length) return null;
    return { key, value: rows[0].value };
  },
  async set(key, value){
    await sbRequest('/app_storage?on_conflict=key', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
    });
    return { key, value };
  },
  async delete(key){
    await sbRequest(`/app_storage?key=eq.${encodeURIComponent(key)}`, { method: 'DELETE' });
    return { key, deleted: true };
  },
  async list(prefix){
    const filter = prefix ? `&key=like.${encodeURIComponent(prefix)}*` : '';
    const rows = await (await sbRequest(`/app_storage?select=key${filter}`)).json();
    return { keys: rows.map(r => r.key) };
  }
};

/* ---------- BACKUP / SNAPSHOTS ---------- */
async function loadBackupIndex(){
  try{ const r = await window.storage.get('backup-index', true); return r ? JSON.parse(r.value) : []; }catch(e){ return []; }
}
async function saveSnapshotBackup(){
  try{
    const date = todayISO();
    const payload = JSON.stringify({ savedAt: new Date().toISOString(), company: state.company, clients: state.clients, invoices: state.invoices });
    await window.storage.set('backup:'+date, payload, true);
    let dates = await loadBackupIndex();
    if(!dates.includes(date)) dates.push(date);
    dates.sort();
    while(dates.length > 10){
      const old = dates.shift();
      try{ await window.storage.delete('backup:'+old, true); }catch(e){/* ignore */}
    }
    await window.storage.set('backup-index', JSON.stringify(dates), true);
    state.backupDates = dates;
  }catch(e){ console.error('Snapshot backup failed', e); }
}

function exportBackupFile(){
  const payload = { exportedAt: new Date().toISOString(), company: state.company, clients: state.clients, invoices: state.invoices };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `faktury-zaloha-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- DERIVED ---------- */
function invoiceTotals(inv){
  let base=0, vat=0;
  (inv.items||[]).forEach(it=>{
    const b = (it.qty||0)*(it.price||0);
    base += b;
    vat += b*((it.vat||0)/100);
  });
  return { base, vat, total: base+vat };
}
function invoiceStatus(inv){
  if(inv.paid) return 'paid';
  if(inv.dueDate && inv.dueDate < todayISO()) return 'overdue';
  return 'pending';
}
function statusLabel(s){ return s==='paid'?'Zaplaceno':(s==='overdue'?'Po splatnosti':'Čeká na platbu'); }
function clientById(id){ return state.clients.find(c=>c.id===id); }

function applyDateRangeFromPreset(preset){
  const today = todayISO();
  if(preset==='month'){
    return { from: today.slice(0,7)+'-01', to: today };
  }
  if(preset==='12m'){
    const d = new Date(today); d.setMonth(d.getMonth()-11); d.setDate(1);
    return { from: d.toISOString().slice(0,10), to: today };
  }
  return { from:'', to:'' }; // 'all' or 'custom'
}

function applyInvoiceFilters(list, f){
  return list.filter(inv=>{
    if(f.from && (inv.issueDate||'') < f.from) return false;
    if(f.to && (inv.issueDate||'') > f.to) return false;
    if(f.clientId && inv.clientId !== f.clientId) return false;
    if(f.status){ if(invoiceStatus(inv) !== f.status) return false; }
    return true;
  });
}

const MONTH_SHORT = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];

function buildRevenueChart(list){
  const map = new Map();
  list.forEach(inv=>{
    const key = (inv.issueDate||'').slice(0,7);
    if(!key || key.length!==7) return;
    map.set(key, (map.get(key)||0) + invoiceTotals(inv).total);
  });
  const months = [...map.keys()].sort();
  if(!months.length){
    return '<div class="empty" style="padding:34px 20px;"><div class="display" style="font-size:15px;">Pro vybrané období nejsou žádná data</div><div>Zkus rozšířit rozsah dat nebo zrušit filtr.</div></div>';
  }
  const max = Math.max(...months.map(m=>map.get(m)), 1);
  const w = 780, h = 230, padL = 56, padR = 12, padT = 12, padB = 32;
  const chartW = w - padL - padR;
  const gap = 12;
  const barW = Math.max(6, chartW/months.length - gap);
  let grid = '';
  [0, 0.5, 1].forEach(frac=>{
    const y = h - padB - Math.round(frac*(h-padT-padB));
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="10" style="fill:var(--ink-soft);font-family:'IBM Plex Mono',monospace;">${fmt(frac*max)}</text>`;
  });
  let bars = '';
  months.forEach((m,i)=>{
    const val = map.get(m);
    const bh = Math.max(1, Math.round((val/max)*(h-padT-padB)));
    const x = padL + i*(barW+gap);
    const y = h - padB - bh;
    const [yy,mo] = m.split('-');
    const label = `${MONTH_SHORT[parseInt(mo,10)-1]} ${yy.slice(2)}`;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" style="fill:var(--accent);opacity:0.88;"><title>${label}: ${fmt(val)} Kč</title></rect>`;
    bars += `<text x="${x+barW/2}" y="${h-padB+16}" text-anchor="middle" font-size="10.5" style="fill:var(--ink-soft);font-family:Inter,sans-serif;">${label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:220px;display:block;">${grid}${bars}</svg>`;
}

function clientOptions(selectedId){

}

  return opts.map(([v,l])=>`<option value="${v}" ${selected===v?'selected':''}>${l}</option>`).join('');
}

function afterRenderAuth(){

async function onSubmitLogin(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const name = (fd.get('name')||'').trim();
  const password = fd.get('password');
  state.lastLoginName = name;
  const user = state.users.find(u=>u.name===name);
  if(!user || user.password!==password){
    state.authError = 'Nesedí jméno nebo heslo.';
    render();
    return;
  }
  state.authError='';
  state.currentUser = name;
  await loadAll();
  state.view='dashboard';
  render();
}

async function onSubmitRegister(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const name = (fd.get('name')||'').trim();
  const password = fd.get('password');
  const password2 = fd.get('password2');
  if(password !== password2){
    state.authError = 'Zadaná hesla se neshodují.';
    render();
    return;
  }
  if(state.users.find(u=>u.name.toLowerCase()===name.toLowerCase())){
    state.authError = 'Toto jméno už existuje, zvol jiné nebo se přihlas.';
    render();
    return;
  }
  state.users.push({name, password});
  await saveUsers();
  state.authError='';
  state.currentUser = name;
  await loadAll();
  state.view='dashboard';
  render();
}

  }
}

/* ---------- DASHBOARD ---------- */
function viewDashboard(){
  const f = state.dashboardFilter;
  const filtered = applyInvoiceFilters(state.invoices, f).map(i=>({...i, status: invoiceStatus(i), t: invoiceTotals(i)}));
  const revenue = filtered.reduce((s,i)=>s+i.t.total,0);
  const unpaidSum = filtered.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.t.total,0);
  const overdueCount = filtered.filter(i=>i.status==='overdue').length;
  const sorted = [...filtered].sort((a,b)=> (b.issueDate||'').localeCompare(a.issueDate||''));

  const presets = [['month','Tento měsíc'],['12m','Posledních 12 měsíců'],['all','Vše'],['custom','Vlastní']];

  return `
    <div class="pagehead">
      <div><h1>Přehled</h1><p class="desc">Stav fakturace za vybrané období.</p></div>
      <button class="btn no-print" data-action="new-invoice">+ Nová faktura</button>
    </div>

    <div class="filter-bar no-print">
      <div class="filter-presets">
        ${presets.map(([v,l])=>`<button type="button" class="chip ${f.preset===v?'active':''}" data-action="dash-preset" data-preset="${v}">${l}</button>`).join('')}
      </div>
      ${f.preset==='custom' ? `
      <div class="filter-row">
        <div class="field"><label>Od</label><input type="date" id="dash-from" value="${f.from||''}"></div>
        <div class="field"><label>Do</label><input type="date" id="dash-to" value="${f.to||''}"></div>
        <div class="field"><label>Klient</label><select id="dash-client">${clientOptions(f.clientId)}</select></div>
        <div class="field"><label>Stav</label><select id="dash-status">${statusOptions(f.status)}</select></div>
      </div>
      ` : ''}
    </div>

    <div class="cards">
      <div class="card"><div class="label">Faktur ve výběru</div><div class="value">${filtered.length}</div></div>
      <div class="card"><div class="label">Fakturováno celkem</div><div class="value accent num">${fmt(revenue)} Kč</div></div>
      <div class="card"><div class="label">Nezaplaceno</div><div class="value amber num">${fmt(unpaidSum)} Kč</div></div>
      <div class="card"><div class="label">Po splatnosti</div><div class="value red num">${overdueCount}</div></div>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <div class="display">Výnos podle měsíce</div>
        <div class="chart-total">${fmt(revenue)} Kč</div>
      </div>
      ${buildRevenueChart(filtered)}
    </div>

    <div class="section-title">Faktury ve výběru (${filtered.length})</div>
    ${sorted.length ? renderInvoiceTable(sorted) : emptyState('Žádné faktury pro tento filtr','Zkus zmenšit rozsah filtru nebo zvolit „Vše“.')}
  `;
}

function emptyState(title, sub){
  return `<div class="empty"><div class="display">${title}</div><div>${sub}</div></div>`;
}

function renderInvoiceTable(list, tbodyId){
  return `
  <table>
    <thead><tr>
      <th>Číslo</th><th>Klient</th><th>Vystaveno</th><th>Splatnost</th><th>Částka</th><th>Stav</th><th>Vytvořil</th><th></th>
    </tr></thead>
    <tbody ${tbodyId?`id="${tbodyId}"`:''}>
      ${list.map(inv=>{
        const c = clientById(inv.clientId);
        const t = invoiceTotals(inv);
        const s = invoiceStatus(inv);
        const searchKey = stripDiacritics(`${inv.number||''} ${c?c.name:''}`).toLowerCase();
        return `<tr class="rowlink" data-action="preview-invoice" data-id="${inv.id}" data-search="${escapeAttr(searchKey)}">
          <td class="num">${inv.number}</td>
          <td>${c ? escapeHtml(c.name) : '—'}</td>
          <td class="num">${inv.issueDate||''}</td>
          <td class="num">${inv.dueDate||''}</td>
          <td class="num">${fmt(t.total)} Kč</td>
          <td><span class="pill ${s}">${statusLabel(s)}</span></td>
          <td>${escapeHtml(inv.createdBy||'—')}</td>
          <td class="actions-cell no-print">
            <button class="iconbtn" data-action="edit-invoice" data-id="${inv.id}" title="Upravit">✎</button>
            <button class="iconbtn" data-action="delete-invoice" data-id="${inv.id}" title="Smazat">✕</button>
          </td>
        </tr>`;
      }).join('')}
      ${tbodyId?`<tr id="invoices-empty-row" style="display:none;"><td colspan="8" style="text-align:center;color:var(--ink-soft);padding:24px;">Žádná faktura neodpovídá hledání.</td></tr>`:''}
    </tbody>
  </table>`;
}

function blankInvoice(){
  const c = state.company;
  const num = `${c.prefix}${String(c.nextNumber).padStart(4,'0')}`;
  const preselected = state.preselectClientId && clientById(state.preselectClientId) ? state.preselectClientId : (state.clients[0]?state.clients[0].id:null);
  state.preselectClientId = null;
  return {
    id:null, number:num, clientId: preselected,
    issueDate: todayISO(), taxDate: todayISO(), dueDate: addDays(todayISO(), c.defaultDueDays||14),
    variableSymbol: num.replace(/\D/g,''), note: c.defaultNote||'', paid:false, paidDate:null,
    paymentMethod: c.defaultPaymentMethod || 'Bankovním převodem',
    includeStamp:true, includeSignature:true, includeQr:true
  };
}

function renderItemRows(){
  return state.formItems.map((it,idx)=>{
    const lineTotal = (it.qty||0)*(it.price||0)*(1+(it.vat||0)/100);
    return `<tr>
      <td class="col-desc"><input data-field="desc" data-index="${idx}" value="${escapeAttr(it.desc)}" placeholder="Popis položky"></td>
      <td class="col-qty"><input type="number" step="0.01" data-field="qty" data-index="${idx}" value="${it.qty}"></td>
      <td class="col-unit"><input data-field="unit" data-index="${idx}" value="${escapeAttr(it.unit||'ks')}"></td>
      <td class="col-price"><input type="number" step="0.01" data-field="price" data-index="${idx}" value="${it.price}"></td>
      <td class="col-vat"><select data-field="vat" data-index="${idx}">${VAT_RATES.map(r=>`<option value="${r}" ${r==it.vat?'selected':''}>${r}%</option>`).join('')}</select></td>
      <td class="col-total num" style="white-space:nowrap;padding-top:14px;">${fmt(lineTotal)} Kč</td>
      <td class="col-remove"><button type="button" class="iconbtn no-print" data-action="remove-item" data-index="${idx}">✕</button></td>
    </tr>`;
  }).join('');
}

function renderTotalsBox(){
  let base=0, vat=0;
  state.formItems.forEach(it=>{ const b=(it.qty||0)*(it.price||0); base+=b; vat+=b*((it.vat||0)/100); });
  return `
    <div class="trow"><span>Základ daně</span><span class="num">${fmt(base)} Kč</span></div>
    <div class="trow"><span>DPH</span><span class="num">${fmt(vat)} Kč</span></div>
    <div class="trow grand"><span>Celkem</span><span>${fmt(base+vat)} Kč</span></div>
  `;
}

}

function buildSpayd(co, inv, total){
  if(!co.iban) return null;
  const acc = co.iban.replace(/\s+/g,'');
  const msg = stripDiacritics(`FAKTURA ${inv.number}`).toUpperCase();
  const vs = (inv.variableSymbol||'').replace(/\D/g,'');
  let s = `SPD*1.0*ACC:${acc}*AM:${total.toFixed(2)}*CC:CZK*MSG:${msg}`;
  if(vs) s += `*X-VS:${vs}`;
  return s;
}

function filterClientRows(query){
  const q = stripDiacritics(query||'').toLowerCase().trim();
  const tbody = document.getElementById('clients-tbody');
  if(!tbody) return;
  let visibleCount = 0;
  tbody.querySelectorAll('tr[data-search]').forEach(row=>{
    const match = !q || row.getAttribute('data-search').includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  const emptyRow = document.getElementById('clients-empty-row');
  if(emptyRow) emptyRow.style.display = visibleCount===0 ? '' : 'none';
}

function setupImportDropzone(){
  const zone = document.getElementById('import-dropzone');
  const fileInput = document.getElementById('import-file-input');
  if(!zone || !fileInput) return;
  zone.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{ if(fileInput.files[0]) handleImportFile(fileInput.files[0]); });
  zone.addEventListener('dragover', (e)=>{ e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', ()=> zone.classList.remove('drag'));
  zone.addEventListener('drop', (e)=>{
    e.preventDefault(); zone.classList.remove('drag');
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]);
  });
}

async function handleImportFile(file){
  state.importBusy = true; state.importError=''; render();
  try{
    const isPdf = (file.type && file.type.includes('pdf')) || file.name.toLowerCase().endsWith('.pdf');
    if(!isPdf) throw new Error('Podporujeme jen PDF s textovou vrstvou (ne fotku/sken).');
    if(!window.pdfjsLib) throw new Error('Čtečka PDF se nenačetla — zkontroluj připojení a zkus to znovu.');

    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let fullText = '';
    const lines = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      // group text items into visual lines using their y-position, keep left-to-right order
      const buckets = new Map();
      content.items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        const key = Math.round(y/3)*3; // tolerance for items on same visual line
        if(!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(it);
      });
      const sortedKeys = [...buckets.keys()].sort((a,b)=>b-a); // top to bottom
      sortedKeys.forEach(k=>{
        const rowItems = buckets.get(k).sort((a,b)=>a.transform[4]-b.transform[4]);
        const lineText = rowItems.map(it=>it.str).join(' ').replace(/\s+/g,' ').trim();
        if(lineText) lines.push(lineText);
      });
      fullText += lines.join('\n') + '\n';
    }
    if(!fullText.trim()) throw new Error('V PDF nebyl nalezen žádný text — jde nejspíš o naskenovaný obrázek, ten se lokálně přečíst nedá.');

    const parsed = parseInvoiceText(fullText, lines);

    const cName = stripDiacritics(parsed.client.name||'').toLowerCase().trim();
    const cIco = (parsed.client.ico||'').replace(/\s+/g,'');
    let matched = null;
    if(cName || cIco){
      matched = state.clients.find(c=>{
        const sameIco = cIco && c.ico && c.ico.replace(/\s+/g,'')===cIco;
        const sameName = cName && stripDiacritics(c.name||'').toLowerCase().trim()===cName;
        return sameIco || sameName;
      }) || null;
    }

    state.importResult = {
      company: parsed.company,
      client: parsed.client,
      matchedClientId: matched ? matched.id : null,
      invoice: parsed.invoice
    };
    state.importBusy = false;
    render();
  }catch(err){
    console.error(err);
    state.importBusy = false;
    state.importError = err.message || 'PDF se nepodařilo přečíst. Zkus jiný soubor.';
    render();
  }
}

/* ---------- LOCAL PATTERN-BASED INVOICE PARSER (no AI, runs fully client-side) ---------- */
function parseInvoiceText(text, lines){
  const norm = text.replace(/\r/g,'');
  lines = (lines && lines.length ? lines : norm.split('\n')).map(l=>l.trim()).filter(l=>l.length);

  function findAll(re){ return [...norm.matchAll(re)].map(m=>m[1].trim()); }

  const icos = findAll(/I[ČC]O[:\s]*([0-9]{6,9})/gi);
  const dics = findAll(/DI[ČC][:\s]*([A-Z]{2}\s?[0-9]{8,10})/gi);
  const ibans = findAll(/\b([A-Z]{2}[0-9]{2}\s?(?:[A-Z0-9]{4}\s?){2,7}[A-Z0-9]{1,4})\b/g);
  const accounts = findAll(/\b(\d{2,10}\/\d{4})\b/g);

  // ---- invoice number: scan line by line so the match can never spill onto a
  // following heading like "Dodavatel" — and require the captured value to
  // actually contain a digit, otherwise it isn't an invoice number ----
  let number = '';
  const numberLineRe = /(?:Faktura(?:\s*[-–—]\s*da[nň]ov[ýy]\s+doklad)?|Da[nň]ov[ýy]\s+doklad|[ČC]íslo\s+faktury)\s*(?:[ČC]\.?|[ČC]íslo)?\s*[:\s]\s*([A-Z0-9][A-Z0-9\-\/]{2,19})/i;
  for(const line of lines){
    const m = numberLineRe.exec(line);
    if(m && /\d/.test(m[1])){ number = m[1].trim(); break; }
  }
  const variableSymbol = (()=>{ const m = /Variabiln[íi]\s+symbol[:\s]*([0-9]{3,15})/i.exec(norm); return m ? m[1].trim() : ''; })();

  const dateRe = /(\d{1,2}\.\s?\d{1,2}\.\s?\d{4}|\d{4}-\d{2}-\d{2})/;
  function findDateNear(label){
    const re = new RegExp(label + '[^0-9]{0,20}' + dateRe.source, 'i');
    const m = re.exec(norm);
    return m ? normalizeDate(m[1]) : '';
  }
  function normalizeDate(d){
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
    const m = /(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})/.exec(d);
    if(!m) return '';
    return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  const issueDate = findDateNear('Datum\\s+vystaven[íi]') || findDateNear('Vystaveno');
  const dueDate = findDateNear('Datum\\s+splatnosti') || findDateNear('Splatnost');
  const taxDate = findDateNear('Datum\\s+zdanite[lľ]n[ée]ho\\s+pln[ěe]n[íi]') || issueDate;

  // ---- supplier / customer blocks: walk the reconstructed lines instead of a
  // single text blob, so we can also pick up the address lines that sit
  // between the name and the IČO/DIČ, and never keep a stray leading ":" ----
  const boundaryRe = /^(Odb[ěe]ratel|Dodavatel|I[ČC]O|DI[ČC]|Faktura|Da[nň]ov[ýy]\s+doklad|Splatnost|Vystaveno|Variabiln[íi]|Bankovn[íi])\b/i;

  function blockAfterLabel(label){
    const labelLineRe = new RegExp('^'+label+'\\s*:?\\s*(.*)$','i');
    const idx = lines.findIndex(l=> labelLineRe.test(l));
    if(idx===-1) return { name:'', address:'' };
    const sameLine = labelLineRe.exec(lines[idx]);
    const collected = [];
    if(sameLine && sameLine[1] && sameLine[1].trim()) collected.push(sameLine[1].replace(/^:\s*/,'').trim());
    for(let i=idx+1; i<lines.length && collected.length<6; i++){
      const l = lines[i];
      if(boundaryRe.test(l)) break;
      collected.push(l);
    }
    const name = (collected[0]||'').trim();
    const address = collected.slice(1).join(', ').trim();
    return { name, address };
  }

  const supplier = blockAfterLabel('Dodavatel');
  const customer = blockAfterLabel('Odb[ěe]ratel');

  const company = {
    name: supplier.name || '', address: supplier.address || '',
    ico: icos[0] || '', dic: dics[0] || '',
    email: (()=>{ const m = /([\w.\-]+@[\w.\-]+\.\w+)/.exec(norm); return m ? m[1] : ''; })(),
    phone: '', account: accounts[0] || '', iban: (ibans[0]||'').replace(/\s+/g,'')
  };
  const client = {
    name: customer.name || '', address: customer.address || '',
    ico: icos[1] || icos[0] || '', dic: dics[1] || dics[0] || '',
    email: '', phone: ''
  };

  // ---- items: look for lines that look like a table row — description
  // followed by qty/unit/price/vat/total. Made more tolerant of spacing,
  // "Kč"/"CZK", and templates that omit the unit column ----
  // a row only counts as a line item if it actually ends in a currency amount —
  // this also keeps header/label lines (invoice number, dates, VS…) out of the table
  const itemLineRe = /^(.{2,80}?)\s+([\d]+(?:[.,]\d+)?)\s*(ks|hod|kg|g|m|den|dny|dní|m[ěe]s[íi]c|balen[íi]|l)?\.?\s*([\d\s]{1,12}(?:[.,]\d{1,2})?)\s*(?:K[čc]\.?|CZK)\s*(\d{1,2})?\s*%?\s*([\d\s]{1,12}(?:[.,]\d{1,2})?)\s*(?:K[čc]\.?|CZK)$/i;
  const nonItemLineRe = /^(Faktura|Da[nň]ov[ýy]\s+doklad|[ČC]íslo\s+faktury|Variabiln[íi]\s+symbol|Datum|I[ČC]O|DI[ČC]|Splatnost|Vystaveno|Bankovn[íi])\b/i;
  const items = [];
  lines.forEach(line=>{
    if(boundaryRe.test(line) || nonItemLineRe.test(line)) return;
    const m = itemLineRe.exec(line);
    if(m){
      const desc = m[1].trim();
      if(!desc || /^(Popis|Polo[žz]ka|Množstv[íi]|Cena|Jedn\.?|DPH|Celkem)$/i.test(desc)) return;
      items.push({
        desc,
        qty: parseFloat((m[2]||'1').replace(',','.')) || 1,
        unit: m[3] || 'ks',
        price: parseFloat((m[4]||'0').replace(/\s/g,'').replace(',','.')) || 0,
        vat: parseInt(m[5]||'21') || 21
      });
    }
  });

  return {
    company, client,
    invoice: {
      number: number || '', issueDate, dueDate, taxDate,
      variableSymbol: variableSymbol || '', note: '',
      items
    }
  };
}

async function confirmImport(){
  const r = state.importResult;
  if(!r) return;
  if(r.company){
    state.company = {
      ...state.company,
      name: state.company.name || r.company.name || '',
      address: state.company.address || r.company.address || '',
      ico: state.company.ico || r.company.ico || '',
      dic: state.company.dic || r.company.dic || '',
      email: state.company.email || r.company.email || '',
      phone: state.company.phone || r.company.phone || '',
      account: state.company.account || r.company.account || '',
      iban: state.company.iban || r.company.iban || ''
    };
    await saveCompany();
  }
  let clientId = r.matchedClientId;
  if(!clientId){
    const c = r.client||{};
    const newClient = {
      id: uid(), name: c.name || 'Neznámý klient', address: c.address||'',
      ico: c.ico||'', dic: c.dic||'', email: c.email||'', phone: c.phone||''
    };
    state.clients.push(newClient);
    await saveClients();
    clientId = newClient.id;
  }
  const inv = r.invoice || {};
  const items = (inv.items||[]).filter(it=> it && ((it.desc||'').trim()!=='' || (it.qty||0)!==0) );
  const newInvoice = {
    id: uid(),
    number: inv.number || `${state.company.prefix||''}${String(state.company.nextNumber||1).padStart(4,'0')}`,
    clientId,
    issueDate: inv.issueDate||'', dueDate: inv.dueDate||'', taxDate: inv.taxDate||inv.issueDate||'',
    variableSymbol: inv.variableSymbol||'', note: inv.note||'',
    items: items.length ? items : [{desc:'',qty:1,unit:'ks',price:0,vat:21}],
    paid:false, paidDate:null, createdBy: state.currentUser
  };
  state.invoices.push(newInvoice);
  await saveInvoices();
  state.importResult = null;
  state.editingInvoiceId = newInvoice.id;
  state.formItems = JSON.parse(JSON.stringify(newInvoice.items));
  state.view = 'invoice-form';
  render();
}

/* ---------- HELPERS ---------- */
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }

/* ---------- EVENTS ---------- */
function afterRender(){
  // QR code render
  const spaydHolder = document.querySelector('[data-spayd]');
  if(spaydHolder){
    const val = spaydHolder.getAttribute('data-spayd');
    const target = document.getElementById('qr-holder');
    if(val && target && window.QRCode){
      target.innerHTML='';
      new QRCode(target, { text: val, width:110, height:110, correctLevel: QRCode.CorrectLevel.M });
    }
  }

  const invoiceForm = document.getElementById('invoice-form');
  if(invoiceForm){
    invoiceForm.addEventListener('submit', onSubmitInvoice);
  }
  const clientForm = document.getElementById('client-form');
  if(clientForm){ clientForm.addEventListener('submit', onSubmitClient); }
  const clientSearchInput = document.getElementById('client-search-input');
  if(clientSearchInput){
    clientSearchInput.addEventListener('input', (e)=>{ state.clientSearch = e.target.value; filterClientRows(e.target.value); });
    if(state.clientSearch) filterClientRows(state.clientSearch);
  }
  setupClientCombo();
  setupImportDropzone();

  // dashboard filter controls
  ['dash-from','dash-to','dash-client','dash-status'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', ()=>{
      const from = document.getElementById('dash-from').value;
      const to = document.getElementById('dash-to').value;
      const clientId = document.getElementById('dash-client').value;
      const status = document.getElementById('dash-status').value;
      state.dashboardFilter = { preset:'custom', from, to, clientId, status };
      render();
    });
  });

  // invoice list filter controls
  ['inv-from','inv-to','inv-client','inv-status'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', ()=>{
      const from = document.getElementById('inv-from').value;
      const to = document.getElementById('inv-to').value;
      const clientId = document.getElementById('inv-client').value;
      const status = document.getElementById('inv-status').value;
      state.invoiceFilter = { ...state.invoiceFilter, from, to, clientId, status };
      render();
    });
  });
  const invSearchInput = document.getElementById('inv-search');
  if(invSearchInput){
    invSearchInput.addEventListener('input', (e)=>{
      state.invoiceFilter.search = e.target.value;
      filterInvoiceRows(e.target.value);
    });
    if(state.invoiceFilter.search) filterInvoiceRows(state.invoiceFilter.search);
  }
  const settingsForm = document.getElementById('settings-form');
  if(settingsForm){ settingsForm.addEventListener('submit', onSubmitSettings); }
  const restoreFileInput = document.getElementById('restore-file-input');
  if(restoreFileInput){
    restoreFileInput.addEventListener('change', ()=>{ if(restoreFileInput.files[0]) restoreFromUploadedFile(restoreFileInput.files[0]); });
  }
  const brandingFileInput = document.getElementById('branding-file-input');
  if(brandingFileInput){
    brandingFileInput.addEventListener('change', ()=>{
      const field = brandingFileInput.getAttribute('data-target-field');
      if(field && brandingFileInput.files[0]) handleBrandingUpload(field, brandingFileInput.files[0]);
    });
  }

  // item input sync
  const itemsBody = document.getElementById('items-body');
  if(itemsBody){
    itemsBody.addEventListener('input', (e)=>{
      const f = e.target.getAttribute('data-field');
      const idx = e.target.getAttribute('data-index');
      if(f==null||idx==null) return;
      let val = e.target.value;
      if(f==='qty'||f==='price'||f==='vat') val = parseFloat(val)||0;
      state.formItems[idx][f]=val;
      // live update row total + totals box without full rerender (keeps focus)
      const totalsBox = document.getElementById('totals-box');
      if(totalsBox) totalsBox.innerHTML = renderTotalsBox();
      const row = e.target.closest('tr');
      if(row){
        const it = state.formItems[idx];
        const lineTotal = (it.qty||0)*(it.price||0)*(1+(it.vat||0)/100);
        const cell = row.querySelector('.num');
        if(cell) cell.textContent = fmt(lineTotal)+' Kč';
      }
    });
  }
}

/* ---------- CLIENT COMBO BOX (searchable client picker in invoice form) ---------- */
function setupClientCombo(){
  const input = document.getElementById('client-combo-input');
  const hidden = document.getElementById('client-combo-value');
  const list = document.getElementById('client-combo-list');
  const detailBox = document.getElementById('client-detail-box');
  if(!input || !hidden || !list) return;

  function fillDetailBox(c){
    if(!detailBox) return;
    if(!c){ detailBox.style.display='none'; return; }
    detailBox.style.display='';
    const addr = document.getElementById('client-detail-address');
    const ico = document.getElementById('client-detail-ico');
    const dic = document.getElementById('client-detail-dic');
    const email = document.getElementById('client-detail-email');
    const phone = document.getElementById('client-detail-phone');
    if(addr) addr.value = c.address||'';
    if(ico) ico.value = c.ico||'';
    if(dic) dic.value = c.dic||'';
    if(email) email.value = c.email||'';
    if(phone) phone.value = c.phone||'';
  }

  function renderList(query){
    const q = stripDiacritics(query||'').toLowerCase().trim();
    const matches = state.clients.filter(c=>{
      if(!q) return true;
      return stripDiacritics(`${c.name} ${c.ico||''}`).toLowerCase().includes(q);
    }).slice(0,30);
    if(!matches.length){
      list.innerHTML = `<div class="combo-empty">Žádný klient neodpovídá. <span style="text-decoration:underline;cursor:pointer;" data-action="new-client">Přidat nového?</span></div>`;
    } else {
      list.innerHTML = matches.map(c=>`
        <div class="combo-item" data-id="${c.id}">
          <div>${escapeHtml(c.name)}</div>
          ${c.ico?`<div class="sub">IČO: ${escapeHtml(c.ico)}</div>`:''}
        </div>
      `).join('');
    }
    list.classList.add('open');
  }

  input.addEventListener('focus', ()=> renderList(input.value));
  input.addEventListener('input', ()=>{ hidden.value=''; fillDetailBox(null); renderList(input.value); });
  list.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.combo-item');
    if(!item) return;
    const c = clientById(item.getAttribute('data-id'));
    if(c){ input.value = c.name; hidden.value = c.id; fillDetailBox(c); }
    list.classList.remove('open');
  });
  document.addEventListener('click', (e)=>{
    if(e.target!==input && !list.contains(e.target)) list.classList.remove('open');
  });
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');

  if(action==='auth-switch'){ state.authView = el.getAttribute('data-view'); state.authError=''; render(); }
  else if(action==='logout'){ state.currentUser=null; state.authView='login'; state.view='dashboard'; render(); }
  else if(action==='nav'){ state.view = el.getAttribute('data-view'); state.editingInvoiceId=null; state.editingClientId=null; state.formItems=[]; render(); }
  else if(action==='new-invoice'){ state.view='invoice-form'; state.editingInvoiceId=null; state.formItems=[]; render(); }
  else if(action==='edit-invoice'){ state.view='invoice-form'; state.editingInvoiceId=id; state.formItems=[]; render(); }
  else if(action==='preview-invoice'){ state.view='invoice-preview'; state.previewId=id; render(); }
  else if(action==='delete-invoice'){ if(confirm('Smazat tuto fakturu?')){ state.invoices = state.invoices.filter(i=>i.id!==id); await saveInvoices(); render(); } }
  else if(action==='toggle-paid'){
    const inv = state.invoices.find(i=>i.id===id);
    if(inv){ inv.paid = !inv.paid; inv.paidDate = inv.paid ? todayISO() : null; await saveInvoices(); render(); }
  }
  else if(action==='print-invoice'){ window.print(); }
  else if(action==='remove-user'){
    const name = el.getAttribute('data-name');
    if(name===state.currentUser){ alert('Nemůžeš odebrat sám sebe, dokud jsi přihlášen.'); return; }
    if(confirm(`Odebrat přístup pro „${name}“?`)){ state.users = state.users.filter(u=>u.name!==name); await saveUsers(); render(); }
  }
  else if(action==='auth-switch-inline'){
    const name = (prompt('Jméno nového kolegy:')||'').trim();
    if(!name) return;
    if(state.users.find(u=>u.name.toLowerCase()===name.toLowerCase())){ alert('Toto jméno už existuje.'); return; }
    const password = prompt(`Heslo pro „${name}“:`)||'';
    if(!password){ alert('Heslo nesmí být prázdné.'); return; }
    state.users.push({name, password});
    await saveUsers();
    render();
  }
  else if(action==='new-client'){ state.view='client-form'; state.editingClientId=null; render(); }
  else if(action==='edit-client'){ state.view='client-form'; state.editingClientId=id; render(); }
  else if(action==='delete-client'){ if(confirm('Smazat tohoto klienta?')){ state.clients = state.clients.filter(c=>c.id!==id); await saveClients(); render(); } }
  else if(action==='client-to-invoice'){ state.preselectClientId=id; state.view='invoice-form'; state.editingInvoiceId=null; state.formItems=[]; render(); }
  else if(action==='add-item'){ state.formItems.push({desc:'',qty:1,unit:'ks',price:0,vat:21}); render(); }
  else if(action==='remove-item'){ const idx = parseInt(el.getAttribute('data-index')); state.formItems.splice(idx,1); if(!state.formItems.length) state.formItems.push({desc:'',qty:1,unit:'ks',price:0,vat:21}); render(); }
  else if(action==='goto-import'){ state.view='invoice-import'; state.importError=''; state.importResult=null; render(); }
  else if(action==='dash-preset'){
    const preset = el.getAttribute('data-preset');
    const range = applyDateRangeFromPreset(preset);
    state.dashboardFilter = { ...state.dashboardFilter, preset, from: range.from, to: range.to };
    render();
  }
  else if(action==='inv-clear-filters'){ state.invoiceFilter = { search:'', from:'', to:'', clientId:'', status:'' }; render(); }
  else if(action==='import-discard'){ state.importResult=null; state.importError=''; render(); }
  else if(action==='import-confirm'){ await confirmImport(); }
  else if(action==='export-backup'){ exportBackupFile(); }
  else if(action==='trigger-restore-file'){ const fi=document.getElementById('restore-file-input'); if(fi) fi.click(); }
  else if(action==='restore-snapshot'){ const date=el.getAttribute('data-date'); await restoreFromSnapshot(date); }
  else if(action==='upload-branding'){
    const field = el.getAttribute('data-field');
    const fi = document.getElementById('branding-file-input');
    if(fi){ fi.setAttribute('data-target-field', field); fi.value=''; fi.click(); }
  }
  else if(action==='remove-branding'){
    const field = el.getAttribute('data-field');
    if(confirm('Odebrat tento obrázek?')) await removeBrandingImage(field);
  }
});

async function onSubmitInvoice(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const id = fd.get('id');
  const clientId = fd.get('clientId');
  if(!clientId || !clientById(clientId)){
    alert('Vyber klienta ze seznamu (napiš jeho jméno a klikni na něj v nabídce).');
    return;
  }
  // Update the client's own record with any edits made inline on this invoice
  const clientIdx = state.clients.findIndex(c=>c.id===clientId);
  if(clientIdx > -1){
    state.clients[clientIdx] = {
      ...state.clients[clientIdx],
      address: fd.get('clientAddress') ?? state.clients[clientIdx].address,
      ico: fd.get('clientIco') ?? state.clients[clientIdx].ico,
      dic: fd.get('clientDic') ?? state.clients[clientIdx].dic,
      email: fd.get('clientEmail') ?? state.clients[clientIdx].email,
      phone: fd.get('clientPhone') ?? state.clients[clientIdx].phone
    };
    await saveClients();
  }
  const items = state.formItems.filter(it=> (it.desc||'').trim()!=='' || (it.qty||0)!==0 );
  const invoice = {
    id: id || uid(),
    number: fd.get('number'),
    clientId: clientId,
    issueDate: fd.get('issueDate'),
    dueDate: fd.get('dueDate'),
    taxDate: fd.get('taxDate'),
    variableSymbol: fd.get('variableSymbol'),
    paymentMethod: fd.get('paymentMethod') || 'Bankovním převodem',
    includeStamp: fd.get('includeStamp')==='1',
    includeSignature: fd.get('includeSignature')==='1',
    includeQr: fd.get('includeQr')==='1',
    note: fd.get('note'),
    items: items,
    paid: fd.get('paid')==='1',
    paidDate: fd.get('paidDate')||null,
    createdBy: id ? (state.invoices.find(i=>i.id===id)||{}).createdBy || state.currentUser : state.currentUser
  };
  if(id){
    const idx = state.invoices.findIndex(i=>i.id===id);
    state.invoices[idx] = invoice;
  } else {
    state.invoices.push(invoice);
    state.company.nextNumber = (state.company.nextNumber||1) + 1;
    await saveCompany();
  }
  await saveInvoices();
  state.formItems = [];
  state.previewId = invoice.id;
  state.view = 'invoice-preview';
  render();
}

async function onSubmitClient(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const id = fd.get('id');
  const client = { id: id || uid(), name: fd.get('name'), address: fd.get('address'), ico: fd.get('ico'), dic: fd.get('dic'), email: fd.get('email'), phone: fd.get('phone') };
  if(id){ const idx = state.clients.findIndex(c=>c.id===id); state.clients[idx]=client; }
  else{ state.clients.push(client); }
  await saveClients();
  state.view='clients';
  render();
}

  };

}

/* ---------- BRANDING (logo / podpis / razítko) ---------- */
function resizeImageFile(file, maxDim = 480, quality = 0.86){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Soubor se nepodařilo přečíst.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Obrázek se nepodařilo zpracovat.'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleBrandingUpload(field, file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Vyber prosím obrázek (PNG, JPG apod.).'); return; }
  try{
    const dataUrl = await resizeImageFile(file, field==='stamp' ? 400 : 480);
    state.company[field] = dataUrl;
    await saveCompany();
    render();
  }catch(err){
    console.error(err);
    alert('Nahrání se nepovedlo, zkus to prosím znovu.');
  }
}

async function removeBrandingImage(field){
  state.company[field] = '';
  await saveCompany();
  render();
}
