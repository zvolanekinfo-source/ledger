async function afterLogin(){
  await loadMyMemberships();
  if(!state.myMemberships.length){
    // Účet existuje v Supabase Auth, ale ještě nemá záznam v žádném týmu
    // (typicky když se přihlásí poprvé po potvrzení e-mailu) — doplníme ho.
    try{
      await insertTeamMember(session.user.id, session.user.email, session.user.email);
      await loadMyMemberships();
    }catch(err){ console.error('Nepovedlo se založit záznam v týmu:', err); }
  }
  state.currentUserId = session.user.id;
  state.currentUser = session.user.email;

  if(!state.myMemberships.length){
    // Účet zatím nemá založenou/zaplacenou firmu — pošleme na výběr plánu.
    state.tenantId = null;
    state.authView = 'select-plan';
    state.authError=''; state.authNotice='';
    render();
    return;
  }

  let preferred = null;
  try{ preferred = localStorage.getItem('ledgers_last_tenant_'+session.user.id); }catch(e){}
  const match = state.myMemberships.find(m=>m.tenantId===preferred);
  state.tenantId = match ? match.tenantId : state.myMemberships[0].tenantId;

  await loadTeam();
  const me = state.users.find(u=>u.id===session.user.id);
  state.currentUser = me ? me.name : session.user.email;

  await loadSubscriptionStatus();
  if(!state.subscription || state.subscription.status !== 'active'){
    state.view = 'billing-gate';
    render();
    return;
  }

  await loadAll();
  state.view = firstAccessibleView();
  state.authError=''; state.authNotice='';
  startEshopPolling();
  render();
}
async function loadSubscriptionStatus(){
  try{
    const res = await sbRequest(`/subscriptions?tenant_id=eq.${encodeURIComponent(state.tenantId)}&select=plan,billing_period,status,current_period_end`);
    const rows = await res.json();
    state.subscription = rows[0] || null;
  }catch(e){ console.error(e); state.subscription = null; }
}

async function onSubmitLogin(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  state.lastLoginEmail = email;
  const submitBtn = e.target.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    const s = await signIn(email, password);
    persistSession(s);
    await afterLogin();
  }catch(err){
    state.authError = 'Nesedí e-mail nebo heslo.';
    render();
  }
}

async function onSubmitRegister(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const displayName = (fd.get('displayName')||'').trim();
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  const password2 = fd.get('password2');
  if(password !== password2){
    state.authError = 'Zadaná hesla se neshodují.';
    render();
    return;
  }
  const submitBtn = e.target.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    const s = await signUp(email, password);
    if(!s){
      // Instance vyžaduje potvrzení e-mailem, než je session vydaná
      state.authError = '';
      state.authNotice = 'Účet je vytvořený. Zkontroluj e-mail a potvrď registraci, pak se přihlas a vyber si plán.';
      state.authView = 'login';
      state.lastLoginEmail = email;
      render();
      return;
    }
    persistSession(s);
    state.pendingDisplayName = displayName || email;
    await afterLogin(); // nový účet nemá firmu -> afterLogin pošle na výběr plánu
  }catch(err){
    state.authError = err.message || 'Registrace se nepovedla.';
    render();
  }
}

function viewInvoices(){
  const f = state.invoiceFilter;
  let filtered = applyInvoiceFilters(state.invoices, f);
  const sortKey = state.invoiceSort || 'date-desc';
  const sorted = [...filtered].sort((a,b)=>{
    let primary = 0;
    if(sortKey==='date-desc') primary = (b.issueDate||'').localeCompare(a.issueDate||'');
    else if(sortKey==='date-asc') primary = (a.issueDate||'').localeCompare(b.issueDate||'');
    else if(sortKey==='number-desc') primary = (b.number||'').localeCompare(a.number||'');
    else if(sortKey==='number-asc') primary = (a.number||'').localeCompare(b.number||'');
    else if(sortKey==='amount-desc') primary = invoiceTotals(b).total - invoiceTotals(a).total;
    else if(sortKey==='amount-asc') primary = invoiceTotals(a).total - invoiceTotals(b).total;
    else if(sortKey==='due-asc') primary = (a.dueDate||'').localeCompare(b.dueDate||'');
    else if(sortKey==='due-desc') primary = (b.dueDate||'').localeCompare(a.dueDate||'');
    if(primary!==0) return primary;
    // shoda v primárním klíči (např. stejné datum) — dorovnáme podle čísla faktury ve stejném směru,
    // ať je efekt řazení vidět vždy
    const desc = sortKey.endsWith('-desc');
    return desc ? (b.number||'').localeCompare(a.number||'') : (a.number||'').localeCompare(b.number||'');
  });
  const anyFilterActive = f.search || f.from || f.to || f.clientId || f.status || f.docType;
  return `
    <div class="pagehead">
      <div><h1>Faktury</h1><p class="desc">${filtered.length} z ${state.invoices.length} dokladů.</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="btn secondary" data-action="goto-bulk-import">⇧ Hromadný import (CSV/Excel)</button>
        <button class="btn secondary" data-action="new-proforma">+ Zálohová faktura</button>
        <button class="btn secondary" data-action="new-credit-note">+ Dobropis</button>
        <button class="btn" data-action="new-invoice">+ Nová faktura</button>
      </div>
    </div>
    <div class="filter-bar no-print">
      <div class="search-row" style="margin-bottom:14px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
        <input type="text" id="inv-search" class="search-input" placeholder="Hledat podle čísla faktury nebo odběratele…" value="${escapeAttr(f.search)}" style="flex:1;min-width:220px;">
        <div class="field" style="margin-bottom:0;min-width:200px;">
          <label>Řazení</label>
          <select id="inv-sort">
            <option value="date-desc" ${sortKey==='date-desc'?'selected':''}>Datum vystavení — od nejnovější</option>
            <option value="date-asc" ${sortKey==='date-asc'?'selected':''}>Datum vystavení — od nejstarší</option>
            <option value="number-desc" ${sortKey==='number-desc'?'selected':''}>Číslo faktury — sestupně</option>
            <option value="number-asc" ${sortKey==='number-asc'?'selected':''}>Číslo faktury — vzestupně</option>
            <option value="amount-desc" ${sortKey==='amount-desc'?'selected':''}>Částka — nejvyšší</option>
            <option value="amount-asc" ${sortKey==='amount-asc'?'selected':''}>Částka — nejnižší</option>
            <option value="due-asc" ${sortKey==='due-asc'?'selected':''}>Splatnost — nejbližší</option>
            <option value="due-desc" ${sortKey==='due-desc'?'selected':''}>Splatnost — nejvzdálenější</option>
          </select>
        </div>
      </div>
      <div class="filter-row">
        <div class="field"><label>Od</label><input type="date" id="inv-from" value="${f.from||''}"></div>
        <div class="field"><label>Do</label><input type="date" id="inv-to" value="${f.to||''}"></div>
        <div class="field"><label>Odběratel</label><select id="inv-client">${clientOptions(f.clientId)}</select></div>
        <div class="field"><label>Stav</label><select id="inv-status">${statusOptions(f.status)}</select></div>
        <div class="field"><label>Typ dokladu</label><select id="inv-doctype">
          <option value="">Všechny typy</option>
          <option value="invoice" ${f.docType==='invoice'?'selected':''}>Faktura</option>
          <option value="credit_note" ${f.docType==='credit_note'?'selected':''}>Dobropis</option>
          <option value="proforma" ${f.docType==='proforma'?'selected':''}>Zálohová faktura</option>
        </select></div>
      </div>
      ${anyFilterActive?`<button type="button" class="filter-clear" data-action="inv-clear-filters">Zrušit filtry</button>`:''}

      <button type="button" class="btn danger small" data-action="bulk-delete-invoices">Smazat vybrané</button>

    ${sorted.length ? renderInvoiceTable(sorted, 'invoices-tbody', true) : emptyState(state.invoices.length?'Žádné faktury pro tento filtr':'Žádné faktury', state.invoices.length?'Zkus upravit nebo zrušit filtr.':'Klikni na „Nová faktura“ a vystav první doklad.')}

      <div class="field-row">

      <div class="field-row">
        <div class="field"><label>Forma úhrady</label>
          <select name="paymentMethod">
            ${['Bankovním převodem','Hotově','Kartou'].map(m=>`<option value="${m}" ${(inv.paymentMethod||'Bankovním převodem')===m?'selected':''}>${m}</option>`).join('')}
          </select>

        <div class="field"><label>Měna</label>

      <div class="toggle-row"><input type="checkbox" name="includeSignature" id="chk-inc-sig" value="1" ${inv.includeSignature!==false?'checked':''}><label for="chk-inc-sig">Zobrazit elektronický podpis (pokud je nahraný)</label></div>

      <datalist id="vat-rate-options">${VAT_RATES.map(r=>`<option value="${r}">`).join('')}</datalist>
      <table class="items-table ${vatPayerNow?'':'no-vat'}">
        <thead><tr><th class="col-desc">Popis</th><th class="col-qty">Množství</th><th class="col-unit">Jedn.</th><th class="col-price">Cena/ks</th><th class="col-vat">DPH</th><th class="col-total num">Celkem</th><th class="col-remove"></th></tr></thead>
        <tbody id="items-body">${renderItemRows()}</tbody>
      </table>
      </div>
      <button type="button" class="btn secondary small no-print" data-action="add-item">+ Přidat položku</button>

      <div class="section-title">Souhrn</div>
      <div class="totals-box" id="totals-box">${renderTotalsBox(vatPayerNow)}</div>

      <div class="field"><textarea name="note">${inv.note||''}</textarea></div>

      <div class="formfoot">
        <button type="submit" class="btn">Uložit fakturu</button>
        <button type="button" class="btn-link" data-action="nav" data-view="invoices">Zrušit</button>
      </div>
      <input type="hidden" name="paid" value="${inv.paid?'1':''}">
      <input type="hidden" name="paidDate" value="${inv.paidDate||''}">
      <input type="hidden" name="id" value="${inv.id||''}">
    </form>
  `;
}

function renderItemRows(){
  return state.formItems.map((it,idx)=>{
    const lineTotal = (it.qty||0)*(it.price||0)*(1+(it.vat||0)/100);
    return `<tr>
      <td class="col-desc"><input data-field="desc" data-index="${idx}" value="${escapeAttr(it.desc)}" placeholder="Popis položky"></td>
      <td class="col-qty"><input type="number" step="0.01" data-field="qty" data-index="${idx}" value="${it.qty}"></td>
      <td class="col-unit"><input data-field="unit" data-index="${idx}" value="${escapeAttr(it.unit||'ks')}"></td>
      <td class="col-price"><input type="number" step="0.01" data-field="price" data-index="${idx}" value="${it.price}"></td>
      <td class="col-vat">
        <input type="number" step="0.1" min="0" max="100" list="vat-rate-options" data-field="vat" data-index="${idx}" value="${it.vat}">
      </td>
      <td class="col-total num" style="white-space:nowrap;padding-top:14px;">${fmt(lineTotal)} Kč</td>
      <td class="col-remove"><button type="button" class="iconbtn no-print" data-action="remove-item" data-index="${idx}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></td>
    </tr>`;
  }).join('');
}

function renderTotalsBox(vatPayerNow){
  let base=0, vat=0;
  state.formItems.forEach(it=>{ const b=(it.qty||0)*(it.price||0); base+=b; vat+=b*((it.vat||0)/100); });
  return `
    <div class="trow"><span>Základ daně</span><span class="num">${fmt(base)} Kč</span></div>
    ${vatPayerNow!==false?`<div class="trow"><span>DPH</span><span class="num">${fmt(vat)} Kč</span></div>`:''}
    <div class="trow grand"><span>Celkem</span><span>${fmt(base+vat)} Kč</span></div>
  `;
}

/* ---------- INVOICE PREVIEW ---------- */
function viewInvoicePreview(){
  const inv = state.invoices.find(i=>i.id===state.previewId);
  if(!inv) return emptyState('Faktura nenalezena','');
  const c = clientById(inv.clientId);
  const co = companyById(inv.companyId) || state.companies[0];
  const t = invoiceTotals(inv);
  const discountAmount = inv.discountType==='percent' ? t.total*(inv.discountValue||0)/100
    : inv.discountType==='amount' ? Math.min(inv.discountValue||0, t.total)
    : 0;
  const afterDiscount = t.total - discountAmount;
  const roundedTotal = inv.rounding==='whole' ? Math.round(afterDiscount) : afterDiscount;
  const roundingAmount = roundedTotal - afterDiscount;
  const cur = inv.currency || 'CZK';
  const status = invoiceStatus(inv);

  const showQr = co.showQr!==false && inv.includeQr!==false;
  const showStamp = co.showStamp!==false && inv.includeStamp!==false && !!co.stamp;
  const showSignature = co.showSignature!==false && inv.includeSignature!==false && !!co.signature;
  const showLogo = co.showLogo!==false && !!co.logo;
  const spayd = showQr ? buildSpayd(co, inv, roundedTotal) : null;
  const qrSvgMarkup = spayd ? buildQrSvgMarkup(spayd) : '';

  const accent = co.invoiceAccent || '#5B8DEF';
  const sheetStyle = `--inv-accent:${accent};--inv-accent-soft:${hexToRgba(accent,0.12)};--inv-accent-tint:${hexToRgba(accent,0.05)};`;

  return `
    <div class="pagehead no-print">
      <div><h1>${docTypeLabel(invoiceDocType(inv))} ${inv.number}</h1><p class="desc">Náhled dokladu</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="btn secondary" data-action="edit-invoice" data-id="${inv.id}">Upravit</button>
        ${invoiceDocType(inv)==='invoice' ? `<button class="btn secondary" data-action="new-credit-note-for-invoice" data-id="${inv.id}">Vytvořit dobropis</button>` : ''}
        <button class="btn secondary" data-action="toggle-paid" data-id="${inv.id}">${inv.paid?'Označit jako nezaplacenou':'Označit jako zaplacenou'}</button>
        <button class="btn secondary" data-action="print-invoice">Tisk</button>
        <button class="btn" data-action="download-invoice-pdf" data-id="${inv.id}">Stáhnout PDF</button>
      </div>
    </div>
    <div class="preview-wrap">
      <div class="invoice-sheet ${inv.colorMode==='bw'?'bw-mode':''}" id="invoice-sheet" style="${sheetStyle}">
        <div class="inv-body">
        <div class="inv-header">
          <div class="inv-header-left">
            ${showLogo ? `<img class="inv-logo" src="${co.logo}" alt="Logo" style="height:${Math.round(48*((co.logoScale||100)/100))}px;">` : `<div class="inv-logo-placeholder">LOGO</div>`}
            <div>
              <div class="inv-co-name">${escapeHtml(co.name||'Vaše firma')}</div>
              ${co.tagline?`<div class="inv-co-tagline">${escapeHtml(co.tagline)}</div>`:''}
            </div>
          </div>
          <div class="inv-header-right">
            ${co.vatPayer===false?'<div style="font-size:10.5px;font-weight:600;color:var(--ink-soft);margin-bottom:3px;">(neplátce DPH)</div>':''}
            <div class="inv-doctitle">${docTypeLabel(invoiceDocType(inv))} číslo:</div>
            <div class="inv-docnum">${escapeHtml(inv.number)}</div>
            ${inv.paid ? `<div class="paid-badge">Zaplaceno</div>` : ''}
          </div>
        </div>

          <div class="info-grid">
            <div class="info-card">
              <div class="k">Dodavatel</div>
              <div class="nm">${escapeHtml(co.name||'—')}</div>
              <div>${nl2br(formatAddress(co.address))}</div>
              ${co.ico?`<div>IČO: ${escapeHtml(co.ico)}</div>`:''}
              ${co.dic?`<div>DIČ: ${escapeHtml(co.dic)}</div>`:''}
              ${co.email?`<div>${escapeHtml(co.email)}</div>`:''}
              ${co.phone?`<div>${escapeHtml(co.phone)}</div>`:''}
              ${co.website?`<div>${escapeHtml(co.website)}</div>`:''}
              <div class="divider">
                ${co.account?`<div class="meta-row"><span>Číslo účtu</span><span>${escapeHtml(co.account)}</span></div>`:''}
                ${co.iban?`<div class="meta-row"><span>IBAN</span><span>${escapeHtml(co.iban)}</span></div>`:''}
                ${co.swift?`<div class="meta-row"><span>SWIFT/BIC</span><span>${escapeHtml(co.swift)}</span></div>`:''}
                <div class="meta-row"><span>Forma úhrady</span><span>${escapeHtml(inv.paymentMethod||'Bankovním převodem')}</span></div>
                <div class="meta-row"><span>Datum vystavení</span><span>${inv.issueDate||''}</span></div>
                <div class="meta-row"><span>Datum splatnosti</span><span>${inv.dueDate||''}</span></div>
                ${co.vatPayer!==false?`<div class="meta-row"><span>Zd. plnění</span><span>${inv.taxDate||''}</span></div>`:''}
                ${inv.variableSymbol?`<div class="meta-row"><span>Variabilní symbol</span><span>${escapeHtml(inv.variableSymbol)}</span></div>`:''}
                ${inv.constantSymbol?`<div class="meta-row"><span>Konstantní symbol</span><span>${escapeHtml(inv.constantSymbol)}</span></div>`:''}
                ${inv.orderNumber?`<div class="meta-row"><span>Číslo objednávky</span><span>${escapeHtml(inv.orderNumber)}</span></div>`:''}
                ${invoiceDocType(inv)==='credit_note' && inv.relatedInvoiceId ? (function(){ const ri=state.invoices.find(x=>x.id===inv.relatedInvoiceId); return ri?`<div class="meta-row"><span>K faktuře</span><span>${escapeHtml(ri.number)}</span></div>`:''; })() : ''}
                ${invoiceDocType(inv)==='credit_note' && inv.creditReason ? `<div class="meta-row"><span>Důvod</span><span>${escapeHtml(inv.creditReason)}</span></div>` : ''}
                ${!co.account && !co.iban ? `<div style="margin-top:6px;">Doplň platební údaje v nastavení.</div>` : ''}
              </div>
            </div>
            <div class="info-card">
              <div class="k">Odběratel</div>
              <div class="nm">${c?escapeHtml(c.name):'—'}</div>
              <div>${c?nl2br(formatAddress(c.address)):''}</div>
              ${c&&c.ico?`<div>IČO: ${escapeHtml(c.ico)}</div>`:''}
              ${c&&c.dic?`<div>DIČ: ${escapeHtml(c.dic)}</div>`:''}
              ${c&&c.contactPerson?`<div>K rukám: ${escapeHtml(c.contactPerson)}</div>`:''}
              ${c&&c.contactEmail?`<div>${escapeHtml(c.contactEmail)}</div>`:''}
              ${c&&c.contactPhone?`<div>${escapeHtml(c.contactPhone)}</div>`:''}
              ${c&&c.website?`<div>${escapeHtml(c.website)}</div>`:''}
              ${c&&formatAddress(c.deliveryAddress)?`<div style="margin-top:8px;"><span style="opacity:.7;">Dodací adresa:</span><br>${nl2br(formatAddress(c.deliveryAddress))}</div>`:''}
            </div>
          </div>

          ${invoiceDocType(inv)==='proforma' ? `<div style="background:var(--amber-soft);color:var(--amber);padding:8px 14px;border-radius:var(--radius);font-size:12.5px;font-weight:600;margin-bottom:14px;">Tento doklad není daňovým dokladem — slouží k úhradě zálohy.</div>` : ''}

          ${co.vatPayer===false ? `
          <table class="lines">
            <thead><tr><th>Popis</th><th class="num">Množství</th><th class="num">J. cena</th><th class="num">Sleva</th><th class="num">Cena</th><th class="num">Kč Celkem</th></tr></thead>
            <tbody>
              ${(inv.items||[]).map(it=>{
                const lineBase=(it.qty||0)*(it.price||0);
                return `<tr><td>${escapeHtml(it.desc)}</td><td class="num">${it.qty} ${escapeHtml(it.unit||'')}</td><td class="num">${money(fmt(it.price))}</td><td class="num">0%</td><td class="num">${money(fmt(lineBase))}</td><td class="num">${money(fmt(lineBase))}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
          ` : `
          <table class="lines">
            <thead><tr><th>Popis</th><th class="num">Množství</th><th class="num">Cena/j</th><th class="num">DPH</th><th class="num">Celkem</th></tr></thead>
            <tbody>
              ${(inv.items||[]).map(it=>{
                const lt=(it.qty||0)*(it.price||0)*(1+(it.vat||0)/100);
                return `<tr><td>${escapeHtml(it.desc)}</td><td class="num">${it.qty} ${escapeHtml(it.unit||'')}</td><td class="num">${money(fmt(it.price)+" "+currencyLabel(cur))}</td><td class="num">${it.vat}%</td><td class="num">${money(fmt(lt)+" "+currencyLabel(cur))}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
          `}

          <div class="bottom">
            ${showQr ? `
            <div class="qrbox">
              <div class="qrimg" id="qr-holder">${qrSvgMarkup}</div>
              <div>QR platba</div>
            </div>` : ''}
            <div class="totals">
              ${co.vatPayer===false ? `
              <div class="trow"><span>Součet položek</span><span>${money(fmt(t.base)+' '+currencyLabel(cur))}</span></div>
              ${discountAmount!==0?`<div class="trow"><span>Sleva</span><span>${money('-'+fmt(discountAmount)+' '+currencyLabel(cur))}</span></div>`:''}
              <div class="trow"><span>Zaokrouhlení</span><span>${money((roundingAmount>=0?'+':'')+fmt(roundingAmount)+' '+currencyLabel(cur))}</span></div>
              <div class="trow grand"><span>CELKEM K ÚHRADĚ</span><span>${money(fmt(roundedTotal)+' '+currencyLabel(cur))}</span></div>
              ` : `
              <div class="trow"><span>Základ daně</span><span>${money(fmt(t.base)+' '+currencyLabel(cur))}</span></div>
              <div class="trow"><span>DPH</span><span>${money(fmt(t.vat)+' '+currencyLabel(cur))}</span></div>
              ${discountAmount!==0?`<div class="trow"><span>Sleva</span><span>${money('-'+fmt(discountAmount)+' '+currencyLabel(cur))}</span></div>`:''}
              ${roundingAmount!==0?`<div class="trow"><span>Zaokrouhlení</span><span>${money((roundingAmount>0?'+':'')+fmt(roundingAmount)+' '+currencyLabel(cur))}</span></div>`:''}
              <div class="trow grand"><span>K úhradě</span><span>${money(fmt(roundedTotal)+' '+currencyLabel(cur))}</span></div>
              `}

              </div>
              <div class="sig-line">Podpis a razítko</div>
            </div>
          </div>

          ${registrationSentence(co)?`<div class="signoff-terms" style="margin-top:6px;">${escapeHtml(registrationSentence(co))}</div>`:''}

          <div class="inv-footer">
            <span>${escapeHtml(co.name||'')}${co.ico?' · IČO '+escapeHtml(co.ico):''}</span>
            <span>Strana 1/1</span>
          </div>
        </div>

async function downloadSelectedInvoicesPdf(ids){
  if(!window.html2pdf) return;
  for(const id of ids){
    const inv = state.invoices.find(i=>i.id===id);
    if(!inv) continue;
    const block = buildInvoiceSheetBlock(inv, 0);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'background:#fff;width:760px;';
    wrap.innerHTML = block.html;
    document.body.appendChild(wrap);
    const sheetEl = wrap.querySelector('.invoice-sheet');
    if(sheetEl) sheetEl.classList.add('pdf-compact');
    try{
      await html2pdf().set({
        margin: [24, 16, 10, 16],
        filename: `Faktura-${(inv.number||'doklad').replace(/[^\w.-]+/g,'_')}.pdf`,
        image: { type:'jpeg', quality:0.98 },
        html2canvas: { scale:2, useCORS:true, allowTaint:true, backgroundColor:'#ffffff' },
        jsPDF: { unit:'pt', format:'a4', orientation:'portrait' },
        pagebreak: { mode:['css','legacy'] }
      }).from(sheetEl || wrap).save();
    }catch(err){ console.error(err); }
    finally{ wrap.remove(); }
  }
}
function printSelectedInvoices(ids){
  const invoices = ids.map(id=>state.invoices.find(i=>i.id===id)).filter(Boolean);
  if(!invoices.length) return;
  let sheet = document.getElementById('multi-invoice-print-sheet');
  if(!sheet){
    sheet = document.createElement('div');
    sheet.id = 'multi-invoice-print-sheet';
    document.body.appendChild(sheet);
  }
  const blocks = invoices.map((inv,idx)=> buildInvoiceSheetBlock(inv, idx));
  sheet.innerHTML = blocks.map(b=>b.html).join('');
  sheet.classList.add('printing');
  document.body.classList.add('printing-barcodes');
  const cleanup = ()=>{
    sheet.classList.remove('printing');
    document.body.classList.remove('printing-barcodes');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=> window.print(), 120);
}
function buildSpayd(co, inv, total){
  if(!co.iban) return null;
  const acc = co.iban.replace(/\s+/g,'');
  const msg = stripDiacritics(`FAKTURA ${inv.number}`).toUpperCase();
  const vs = (inv.variableSymbol||'').replace(/\D/g,'');
  const ks = (inv.constantSymbol||'').replace(/\D/g,'');
  let s = `SPD*1.0*ACC:${acc}*AM:${total.toFixed(2)}*CC:${inv.currency||'CZK'}*MSG:${msg}`;
  if(vs) s += `*X-VS:${vs}`;
  if(ks) s += `*X-KS:${ks}`;
  return s;
}

function registrationSentence(co){
  if(!co.showRegistration) return '';
  const parts = [];
  if(co.regCourt) parts.push(`Městským soudem v ${co.regCourt}`);
  if(co.regSection) parts.push(`oddíl ${co.regSection}`);
  if(co.regInsert) parts.push(`vložka ${co.regInsert}`);
  if(co.regDate) parts.push(`dne ${formatCzDate(co.regDate)}`);
  if(!parts.length) return '';
  return `Zapsáno v obchodním rejstříku vedeném ${parts.join(', ')}.`;
}
function formatCzDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('cs-CZ');
}

function clientRevenue(c){
  return state.invoices.filter(i=>i.clientId===c.id && invoiceCountsAsRevenue(i)).reduce((s,i)=>s+invoiceSignedTotal(i),0);

function sortedClients(){
  const arr = [...state.clients];
  const sort = state.clientSort || 'newest';
  if(sort==='newest') arr.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  else if(sort==='oldest') arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
  else if(sort==='az') arr.sort((a,b)=> (a.name||'').localeCompare(b.name||'','cs'));
  else if(sort==='za') arr.sort((a,b)=> (b.name||'').localeCompare(a.name||'','cs'));
  else if(sort==='revenue-desc') arr.sort((a,b)=> clientRevenue(b)-clientRevenue(a));
  else if(sort==='revenue-asc') arr.sort((a,b)=> clientRevenue(a)-clientRevenue(b));
  return arr;
}

function filterClientRows(query, field){
  const q = stripDiacritics(query||'').toLowerCase().trim();
  const attr = ({name:'data-name', ico:'data-ico', dic:'data-dic', city:'data-city', contact:'data-contact', email:'data-email', phone:'data-phone'})[field] || 'data-search';
  const tbody = document.getElementById('clients-tbody');
  if(!tbody) return;
  let visibleCount = 0;
  tbody.querySelectorAll('tr[data-search]').forEach(row=>{
    const match = !q || (row.getAttribute(attr)||'').includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  const emptyRow = document.getElementById('clients-empty-row');
  if(emptyRow) emptyRow.style.display = visibleCount===0 ? '' : 'none';
}

  });

}

/* ---------- E-SHOPY (víc platforem, průběžná synchronizace) ---------- */
async function fetchShopifyOrders(cred){
  const res = await fetch(`https://${cred.storeDomain}/admin/api/2024-01/orders.json?status=open&limit=50`, {
    headers: { 'X-Shopify-Access-Token': cred.accessToken, 'Content-Type':'application/json' }
  });
  if(!res.ok) throw new Error(`Shopify odpovědělo chybou ${res.status}.`);
  const data = await res.json();
  return (data.orders||[]).map(so=>({
    externalId: String(so.id), number: 'SHOPIFY-'+so.order_number, email: so.email||'',
    lineItems: (so.line_items||[]).map(li=>({ sku: li.sku, title: li.title, qty: li.quantity, price: parseFloat(li.price)||0 })),
    weightKg: (so.total_weight||0)/1000
  }));
}
async function fetchShoptetOrders(cred){
  const base = (cred.eshopUrl||'').replace(/\/$/,'');
  const res = await fetch(`${base}/api/orders?status=new`, {
    headers: { 'Authorization': 'Bearer '+cred.accessToken, 'Content-Type':'application/json' }
  });
  if(!res.ok) throw new Error(`Shoptet odpovědělo chybou ${res.status}.`);
  const data = await res.json();
  const list = data.data || data.orders || [];
  return list.map(so=>({
    externalId: String(so.id||so.code), number: 'SHOPTET-'+(so.code||so.id),
    email: (so.customer && so.customer.email) || '',
    lineItems: (so.items||[]).map(li=>({ sku: li.code||li.sku, title: li.name||li.title, qty: li.amount||li.qty, price: parseFloat(li.price)||0 })),
    weightKg: 0
  }));
}
async function fetchWooCommerceOrders(cred){
  const base = (cred.siteUrl||'').replace(/\/$/,'');
  const auth = btoa(`${cred.consumerKey}:${cred.consumerSecret}`);
  const res = await fetch(`${base}/wp-json/wc/v3/orders?status=processing&per_page=50`, {
    headers: { 'Authorization': 'Basic '+auth }
  });
  if(!res.ok) throw new Error(`WooCommerce odpovědělo chybou ${res.status}.`);
  const data = await res.json();
  return (data||[]).map(so=>({
    externalId: String(so.id), number: 'WOO-'+so.number,
    email: (so.billing && so.billing.email) || '',
    lineItems: (so.line_items||[]).map(li=>({ sku: li.sku, title: li.name, qty: li.quantity, price: parseFloat(li.price)||0 })),
    weightKg: 0
  }));
}
async function fetchWixOrders(cred){
  const res = await fetch('https://www.wixapis.com/ecom/v1/orders/search', {
    method:'POST',
    headers: { 'Authorization': cred.apiKey, 'wix-site-id': cred.siteId, 'Content-Type':'application/json' },
    body: JSON.stringify({ search:{ filter:{ status:{ '$eq':'APPROVED' } } } })
  });
  if(!res.ok) throw new Error(`Wix odpovědělo chybou ${res.status}.`);
  const data = await res.json();
  return (data.orders||[]).map(o=>({
    externalId: String(o.id), number: 'WIX-'+(o.number||o.id),
    email: (o.buyerInfo&&o.buyerInfo.email)||'',
    lineItems: (o.lineItems||[]).map(li=>({
      sku: (li.catalogReference&&li.catalogReference.catalogItemId)||li.sku||'',
      title: (li.productName&&li.productName.original)||li.name||'',
      qty: li.quantity||1, price: parseFloat((li.price&&li.price.amount)||li.price)||0
    })),
    weightKg: 0
  }));
}
async function fetchBigCommerceOrders(cred){
  const res = await fetch(`https://api.bigcommerce.com/stores/${cred.storeHash}/v2/orders?status_id=11&limit=50`, {
    headers: { 'X-Auth-Token': cred.accessToken, 'Accept':'application/json' }
  });
  if(!res.ok) throw new Error(`BigCommerce odpovědělo chybou ${res.status}.`);
  const orders = await res.json();
  const results = [];
  for(const o of (Array.isArray(orders)?orders:[])){
    let items = [];
    try{
      const piRes = await fetch(`https://api.bigcommerce.com/stores/${cred.storeHash}/v2/orders/${o.id}/products`, { headers:{ 'X-Auth-Token':cred.accessToken,'Accept':'application/json' } });
      if(piRes.ok) items = await piRes.json();
    }catch(e){}
    results.push({
      externalId: String(o.id), number: 'BC-'+o.id,
      email: (o.billing_address&&o.billing_address.email)||'',
      lineItems: (items||[]).map(li=>({ sku: li.sku, title: li.name, qty: parseInt(li.quantity)||1, price: parseFloat(li.price_inc_tax)||0 })),
      weightKg: 0
    });
  }
  return results;
}
async function fetchOpenCartOrders(cred){
  const base = (cred.storeUrl||'').replace(/\/$/,'');
  const res = await fetch(`${base}/index.php?route=api/order&key=${encodeURIComponent(cred.apiKey)}`, { headers:{'Content-Type':'application/json'} });
  if(!res.ok) throw new Error(`OpenCart odpovědělo chybou ${res.status} (přesná cesta API se liší podle verze/rozšíření — možná bude potřeba upravit).`);
  const data = await res.json();
  const list = data.orders || data.data || (Array.isArray(data)?data:[]);
  return list.map(o=>({
    externalId: String(o.order_id||o.id), number: 'OC-'+(o.order_id||o.id),
    email: o.email||'',
    lineItems: (o.products||o.items||[]).map(li=>({ sku: li.model||li.sku||'', title: li.name||'', qty: parseInt(li.quantity)||1, price: parseFloat(li.price)||0 })),
    weightKg: 0
  }));
}
function getByPath(obj, path){
  if(!path) return undefined;
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
async function fetchCustomApiOrders(cred){
  if(!cred.apiUrl) throw new Error('Doplň URL, kam se má program dotazovat.');
  const headers = {};
  if(cred.authHeaderName && cred.authHeaderValue) headers[cred.authHeaderName] = cred.authHeaderValue;
  const res = await fetch(cred.apiUrl, { headers });
  if(!res.ok) throw new Error(`Vlastní API odpovědělo chybou ${res.status}.`);
  const data = await res.json();
  const list = cred.ordersPath ? (getByPath(data, cred.ordersPath)||[]) : (Array.isArray(data)?data:[]);
  return list.map(o=>({
    externalId: String(getByPath(o, cred.externalIdField) ?? ''),
    number: String(getByPath(o, cred.numberField) ?? getByPath(o, cred.externalIdField) ?? ''),
    email: getByPath(o, cred.emailField) || '',
    lineItems: (cred.itemsPath ? (getByPath(o, cred.itemsPath)||[]) : []).map(li=>({
      sku: getByPath(li, cred.skuField) || '', title: getByPath(li, cred.titleField) || '',
      qty: parseFloat(getByPath(li, cred.qtyField))||1, price: parseFloat(getByPath(li, cred.priceField))||0
    })),
    weightKg: 0
  })).filter(o=>o.externalId);
}
async function fetchEshopOrders(eshop){
  if(eshop.platform==='shopify') return fetchShopifyOrders(eshop.credentials);
  if(eshop.platform==='shoptet') return fetchShoptetOrders(eshop.credentials);
  if(eshop.platform==='woocommerce') return fetchWooCommerceOrders(eshop.credentials);
  if(eshop.platform==='wix') return fetchWixOrders(eshop.credentials);
  if(eshop.platform==='bigcommerce') return fetchBigCommerceOrders(eshop.credentials);
  if(eshop.platform==='opencart') return fetchOpenCartOrders(eshop.credentials);
  if(eshop.platform==='custom_api') return fetchCustomApiOrders(eshop.credentials);
  throw new Error('Neznámá platforma e-shopu.');
}
async function pollEshopOrders(eshopId, silent){
  const eshop = state.integrations.eshops.find(e=>e.id===eshopId);
  if(!eshop || !eshop.active) return;
  if((ESHOP_PLATFORMS[eshop.platform]||{}).pushOnly) return; // tenhle typ program sama nedotazuje, jen přijímá webhook
  try{
    const orders = await fetchEshopOrders(eshop);
    let imported = 0;
    orders.forEach(eo=>{
      if(state.orders.some(o=>o.externalId===eo.externalId)) return;
      const items = eo.lineItems.map(li=>{
        const product = state.products.find(p=>p.ean===li.sku || p.number===li.sku);
        return product ? { productId:product.id, desc:li.title, qty:li.qty, unit:'ks', price:li.price, vat:21, ean:product.ean||'', productNumber:product.number||'', scannedQty:0 } : null;
      }).filter(Boolean);
      if(!items.length) return;
      state.orders.push({
        ...blankOrder(), id: uid(), number: eo.number, externalId: eo.externalId, eshopId: eshop.id,
        clientId: null, items, weightKg: eo.weightKg||0,
        note: `Import z ${ESHOP_PLATFORMS[eshop.platform].label}${eo.email?(' — '+eo.email):''}`
      });
      imported++;
    });
    eshop.lastSyncAt = new Date().toISOString();
    eshop.lastSyncStatus = { ok:true, message: imported ? `Nalezeno ${imported} nových objednávek.` : 'Žádné nové objednávky.' };
    if(imported){ await saveOrders(); if(state.view==='orders') render(); }
    await saveIntegrations();
  }catch(err){
    eshop.lastSyncAt = new Date().toISOString();
    eshop.lastSyncStatus = { ok:false, message: err.message || 'Synchronizace se nepovedla.' };
    try{ await saveIntegrations(); }catch(e){}
    if(!silent && state.view==='settings') render();
  }
}
function startEshopPolling(){
  if(!window._pollTimers) window._pollTimers = {};
  Object.values(window._pollTimers).forEach(t=>clearInterval(t));
  window._pollTimers = {};
  (state.integrations.eshops||[]).forEach(e=>{
    if(!e.active || (ESHOP_PLATFORMS[e.platform]||{}).pushOnly) return;
    window._pollTimers[e.id] = setInterval(()=>pollEshopOrders(e.id, true), (state.integrations.pollIntervalSec||60)*1000);
    pollEshopOrders(e.id, true); // hned při spuštění programu zkontrolovat, ať nečekáš na první interval
  });
  // Fronta z webhooku (viz Nastavení → Integrace, tlačítko "Nastavit okamžité doručení webhookem")
  // se kontroluje vždy, nezávisle na tom, jestli má uživatel aktivní přímé dotazování e-shopu —
  // je to levné (jen vlastní databáze), takže jede na krátkém intervalu.
  if(window._queuePollTimer) clearInterval(window._queuePollTimer);
  window._queuePollTimer = setInterval(()=>pollIncomingOrdersQueue(true), 15000);
  pollIncomingOrdersQueue(true);
}
async function pollIncomingOrdersQueue(silent){
  if(!state.tenantId) return;
  try{
    const res = await sbRequest(`/incoming_orders?tenant_id=eq.${encodeURIComponent(state.tenantId)}&processed=eq.false&select=*`);
    const rows = await res.json();
    if(!rows.length) return;
    let imported = 0;
    for(const row of rows){
      const eo = row.payload || {};
      if(!state.orders.some(o=>o.externalId===eo.external_id)){
        const items = (eo.line_items||[]).map(li=>{
          const product = state.products.find(p=>p.ean===li.sku || p.number===li.sku);
          return product ? { productId:product.id, desc:li.title, qty:li.qty, unit:'ks', price:li.price, vat:21, ean:product.ean||'', productNumber:product.number||'', scannedQty:0 } : null;
        }).filter(Boolean);
        if(items.length){
          const platformLabel = (ESHOP_PLATFORMS[row.platform]||{}).label || row.platform;
          state.orders.push({
            ...blankOrder(), id: uid(), number: eo.number || row.external_id, externalId: eo.external_id,
            clientId: null, items, weightKg: eo.weight_kg||0,
            note: `Webhook z ${platformLabel}${eo.email?(' — '+eo.email):''}`
          });
          imported++;
        }
      }
      // označit jako zpracované i v případě, že se nepodařilo spárovat položky —
      // ať program pořád nezkouší tu samou nespárovanou objednávku dokola
      await sbRequest(`/incoming_orders?id=eq.${row.id}`, { method:'PATCH', body: JSON.stringify({ processed:true }) }).catch(()=>{});
    }
    if(imported){ await saveOrders(); if(state.view==='orders') render(); }
  }catch(err){
    if(!silent) console.error('Fronta webhooku se nepovedla načíst:', err);
  }
}

/* ---------- DOPRAVCI (víc dopravců, pravidla pro automatický výběr) ---------- */
async function createZasilkovnaShipment(o, cred){
  if(!cred || !cred.apiKey) throw new Error('Chybí API klíč Zásilkovny.');
  const c = clientById(o.clientId);
  if(!c) throw new Error('Objednávka nemá odběratele s adresou.');
  const payload = {
    apiPassword: cred.apiKey,
    packetAttributes: {
      number: o.number,
      name: (c.name||'').split(' ')[0]||c.name,
      surname: (c.name||'').split(' ').slice(1).join(' ')||'',
      email: c.contactEmail||'', phone: c.contactPhone||'', addressId: 0,
      value: (o.items||[]).reduce((s,it)=>s+(it.qty||0)*(it.price||0),0),
      eshop: (companyById(o.companyId)||{}).name||''
    }
  };
  const res = await fetch('https://www.zasilkovna.cz/api/rest/createPacket', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error(`Zásilkovna odpovědělo chybou ${res.status} (pravděpodobně CORS blokace přímého volání z programu).`);
  return await res.json();
}
async function createDpdShipment(o, cred){
  // DPD API je určené výhradně pro server-to-server komunikaci — nejde bezpečně ani technicky
  // zavolat přímo z prohlížeče programu (CORS).
  throw new Error('DPD API nejde bezpečně zavolat přímo z programu v prohlížeči (vyžaduje server).');
}
async function createPplShipment(o, cred){
  throw new Error('PPL API nejde bezpečně zavolat přímo z programu v prohlížeči (vyžaduje server).');
}
async function createGlsShipment(o, cred){
  throw new Error('GLS API nejde bezpečně zavolat přímo z programu v prohlížeči (vyžaduje server).');
}
async function createCarrierShipment(carrier, o){
  if(carrier.type==='zasilkovna') return createZasilkovnaShipment(o, carrier.credentials);
  if(carrier.type==='dpd') return createDpdShipment(o, carrier.credentials);
  if(carrier.type==='ppl') return createPplShipment(o, carrier.credentials);
  if(carrier.type==='gls') return createGlsShipment(o, carrier.credentials);
  throw new Error('Neznámý typ dopravce.');
}
function carrierRuleMatches(rule, o){
  if(rule.maxWeightKg && (o.weightKg||0) > parseFloat(rule.maxWeightKg)) return false;
  if(rule.deliveryType && o.deliveryType && rule.deliveryType!==o.deliveryType) return false;
  return true;
}
function selectCarrierForOrder(o){
  const candidates = (state.integrations.carriers||[]).filter(c=>c.active).sort((a,b)=>(a.priority||0)-(b.priority||0));
  for(const c of candidates){
    const rules = c.rules||[];
    if(!rules.length || rules.every(r=>carrierRuleMatches(r,o))) return c;
  }
  return candidates[0] || null;
}
async function autoProcessShipping(o){
  const carrier = selectCarrierForOrder(o);
  state.fulfillmentStage = 'shipping';
  if(!carrier) return;
  try{
    const result = await createCarrierShipment(carrier, o);
    o.trackingNumber = (result && (result.id || result.trackingNumber)) || o.trackingNumber || '';
    o.shippingCarrier = carrier.type;
    await saveOrders();
    setTimeout(()=>printShippingLabel(o.id), 300); // rovnou nabídnout tisk štítku
  }catch(err){
    o.shippingCarrier = carrier.type;
    await saveOrders().catch(()=>{});
    state.integrationTestStatus = state.integrationTestStatus || {};
    state.integrationTestStatus['auto-ship'] = { ok:false, message: `Automatické vytvoření zásilky u ${carrier.name} se nepovedlo: ${err.message||''} Doplň sledovací číslo ručně a vytiskni programem vygenerovaný štítek.` };
  }
}

function setupIntegrationsSection(){
  const pollSelect = document.getElementById('poll-interval-select');
  if(pollSelect){
    pollSelect.addEventListener('change', async ()=>{
      state.integrations.pollIntervalSec = parseInt(pollSelect.value)||60;
      try{ await saveIntegrations(); }catch(e){}
      startEshopPolling();
    });
  }
  document.querySelectorAll('.eshop-form').forEach(form=>{
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const id = form.getAttribute('data-id');
      const eshop = state.integrations.eshops.find(x=>x.id===id);
      if(!eshop) return;
      const fd = new FormData(form);
      eshop.name = fd.get('name')||'';
      const platform = ESHOP_PLATFORMS[eshop.platform];
      const cred = {};
      (platform.fields||[]).forEach(f=>{ cred[f.key] = (fd.get(f.key)||'').trim(); });
      eshop.credentials = cred;
      if(fd.has('webhookSecret')) eshop.webhookSecret = (fd.get('webhookSecret')||'').trim();
      try{ await saveIntegrations(); }catch(err){ alert('Uložení se nepovedlo.'); return; }
      startEshopPolling();
      render();
    });
  });
  document.querySelectorAll('.carrier-form').forEach(form=>{
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const id = form.getAttribute('data-id');
      const carrier = state.integrations.carriers.find(x=>x.id===id);
      if(!carrier) return;
      const fd = new FormData(form);
      carrier.name = fd.get('name')||'';
      const type = CARRIER_TYPES[carrier.type];
      const cred = {};
      type.fields.forEach(f=>{ cred[f.key] = (fd.get(f.key)||'').trim(); });
      carrier.credentials = cred;
      const maxWeightKg = fd.get('ruleMaxWeightKg');
      const deliveryType = fd.get('ruleDeliveryType');
      carrier.rules = (maxWeightKg || deliveryType) ? [{ maxWeightKg: maxWeightKg?parseFloat(maxWeightKg):null, deliveryType: deliveryType||'' }] : [];
      try{ await saveIntegrations(); }catch(err){ alert('Uložení se nepovedlo.'); return; }
      render();
    });
  });
}
function generateWebhookSecret(){
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
}
async function addEshopPlatform(platform){
  state.integrations.eshops.push({ id:uid(), platform, name:ESHOP_PLATFORMS[platform].label, active:true, credentials:{}, webhookSecret: generateWebhookSecret(), lastSyncAt:null, lastSyncStatus:null });
  await saveIntegrations();
  render();
}
async function addCarrierType(type){
  state.integrations.carriers.push({ id:uid(), type, name:CARRIER_TYPES[type].label, active:true, credentials:{}, rules:[], priority:state.integrations.carriers.length, testStatus:null });
  await saveIntegrations();
  render();
}

/* ---------- HROMADNÝ IMPORT (CSV/Excel z libovolného zdroje) ---------- */
const BULK_FIELDS = [
  {key:'', label:'— Ignorovat —'},
  {key:'clientName', label:'Odběratel — název'},
  {key:'clientIco', label:'Odběratel — IČO'},
  {key:'clientDic', label:'Odběratel — DIČ'},
  {key:'clientEmail', label:'Odběratel — e-mail'},
  {key:'clientPhone', label:'Odběratel — telefon'},
  {key:'clientStreet', label:'Odběratel — ulice a číslo'},
  {key:'clientZip', label:'Odběratel — PSČ'},
  {key:'clientCity', label:'Odběratel — město'},
  {key:'invoiceNumber', label:'Faktura — číslo'},
  {key:'issueDate', label:'Faktura — datum vystavení'},
  {key:'dueDate', label:'Faktura — datum splatnosti'},
  {key:'variableSymbol', label:'Faktura — variabilní symbol'},
  {key:'total', label:'Faktura — částka celkem (s DPH)'},
  {key:'baseAmount', label:'Faktura — základ daně (bez DPH)'},
  {key:'vatAmount', label:'Faktura — DPH (částka)'},
  {key:'vatRate', label:'Faktura — sazba DPH (%)'},
  {key:'paid', label:'Faktura — zaplaceno (ano/ne)'},
  {key:'description', label:'Faktura — popis / položka'},
  {key:'note', label:'Faktura — poznámka'},
];

const BULK_GUESS_RULES = [
  [/variabiln|variable\s*symbol/, 'variableSymbol'],
  [/^(č|c)[íi]slo\s*faktury|faktura\s*č|inv(oice)?\s*(no|number|č)|^number$|^invoice$/, 'invoiceNumber'],
  [/vystaven|issue\s*date|date\s*of\s*issue/, 'issueDate'],
  [/splatnost|due\s*date/, 'dueDate'],
  [/z[áa]klad|subtotal|net\s*amount/, 'baseAmount'],
  // DIČ/VAT number musí být dřív než obecná pravidla pro DPH částku/sazbu,
  // jinak by "Vat number" spadlo omylem pod částku DPH
  [/di[čc]\b|vat\s*number|vat\s*id|tax\s*number/, 'clientDic'],
  [/sazba.*dph|dph.*%|vat\s*rate|vat\s*%/, 'vatRate'],
  [/dph|^vat$|vat\s*amount/, 'vatAmount'],
  [/celkem|k\s*[úu]hrad|total|[čc][áa]stka|amount\s*due|grand\s*total/, 'total'],
  [/zaplac|uhrazen|paid|status|stav/, 'paid'],
  [/psč|psc|zip|postal|postcode/, 'clientZip'],
  [/m[ěe]sto|obec|^city$/, 'clientCity'],
  [/ulice|adresa|^address$|^street$/, 'clientStreet'],
  // IČO/company number — dřív než obecné "company", ať se "Company number" nesplete s názvem firmy
  [/i[čc]o\b|company\s*number|registration\s*number|reg\.?\s*no\b/, 'clientIco'],
  [/e-?mail/, 'clientEmail'],
  [/telefon|^phone$/, 'clientPhone'],
  [/n[áa]zev|firma|odb[ěe]ratel|z[áa]kazn[íi]k|klient|customer|client\s*name|^name$|contact\s*name|company\s*name/, 'clientName'],
  [/pozn[áa]mka|note|comment/, 'note'],
  [/polo[žz]ka|popis|description|^item$/, 'description'],
  [/^č[íi]slo$/, 'invoiceNumber'],
];
function guessFieldForHeader(header){
  const h = stripDiacritics(String(header||'')).toLowerCase().trim();
  for(const rule of BULK_GUESS_RULES){
    const [re, field] = Array.isArray(rule[0]) ? rule[0] : rule;
    if(re.test(h)) return field;
  }
  return '';
}
function bulkParseBoolean(v){
  const s = stripDiacritics(String(v==null?'':v)).toLowerCase().trim();
  return ['ano','yes','true','1','x','zaplaceno','uhrazeno','paid'].includes(s);
}
function bulkParseNumber(v){
  if(v==null || v==='') return null;
  if(typeof v === 'number') return v;
  const s = String(v).replace(/\s/g,'').replace(/[^\d,.\-]/g,'').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function bulkParseDate(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  const asNum = Number(s);
  if(!isNaN(asNum) && asNum > 20000 && asNum < 60000){
    const d = new Date(Date.UTC(1899,11,30) + asNum*86400000);
    return d.toISOString().slice(0,10);
  }
  return '';
}

async function handleBulkFile(file){
  if(!file) return;
  state.bulkImport.error = '';
  state.bulkImport.fileName = file.name;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    if(!rows.length){ state.bulkImport.error = 'Soubor neobsahuje žádná data.'; render(); return; }
    const headers = Object.keys(rows[0]);
    const mapping = {};
    headers.forEach(h=>{ mapping[h] = guessFieldForHeader(h); });
    state.bulkImport.headers = headers;
    state.bulkImport.rows = rows;
    state.bulkImport.mapping = mapping;
    state.bulkImport.step = 'mapping';
  }catch(err){
    console.error(err);
    state.bulkImport.error = 'Soubor se nepodařilo přečíst. Zkus ho uložit jako .xlsx nebo .csv a nahrát znovu.';
  }
  render();
}

function computeBulkPreview(){
  const bi = state.bulkImport;
  const mapping = bi.mapping;
  const fieldToHeader = {};
  Object.entries(mapping).forEach(([h,f])=>{ if(f) fieldToHeader[f]=h; });
  const get = (row, field) => fieldToHeader[field] ? row[fieldToHeader[field]] : undefined;

  const clientMap = new Map(); // key -> {data, isNew, existingId}
  const invoices = [];
  let skipped = 0;

  function keyFor(name, ico){
    const icoNorm = stripDiacritics(String(ico||'')).replace(/\D/g,'');
    if(icoNorm) return 'ico:'+icoNorm;
    const nameNorm = stripDiacritics(String(name||'')).toLowerCase().replace(/[^a-z0-9]/g,'');
    return nameNorm ? 'name:'+nameNorm : null;
  }

  bi.rows.forEach(row=>{
    const name = (get(row,'clientName')||'').toString().trim();
    const ico = (get(row,'clientIco')||'').toString().trim();
    const invNumber = (get(row,'invoiceNumber')||'').toString().trim();
    const total = bulkParseNumber(get(row,'total'));
    const isContactsMode = bi.mode==='contacts';
    if(isContactsMode ? !name && !ico : (!name && !invNumber && total==null)){ skipped++; return; }

    const key = keyFor(name, ico) || ('row:'+invoices.length+clientMap.size);
    let entry = clientMap.get(key);
    if(!entry){
      const existing = state.clients.find(c=>
        (ico && stripDiacritics(String(c.ico||'')).replace(/\D/g,'')===stripDiacritics(ico).replace(/\D/g,'') && c.ico) ||
        (!ico && c.name && stripDiacritics(c.name).toLowerCase()===stripDiacritics(name).toLowerCase())
      );
      entry = {
        key, name: name || (existing?existing.name:'') || 'Neznámý odběratel',
        ico, dic: (get(row,'clientDic')||'').toString().trim(),
        email: (get(row,'clientEmail')||'').toString().trim(),
        phone: (get(row,'clientPhone')||'').toString().trim(),
        street: (get(row,'clientStreet')||'').toString().trim(),
        zip: (get(row,'clientZip')||'').toString().trim(),
        city: (get(row,'clientCity')||'').toString().trim(),
        isExisting: !!existing, existingId: existing?existing.id:null,
        count: 0
      };
      clientMap.set(key, entry);
    }
    entry.count++;
    if(isContactsMode) return;

    const baseAmount = bulkParseNumber(get(row,'baseAmount'));
    const vatAmount = bulkParseNumber(get(row,'vatAmount'));
    let vatRate = bulkParseNumber(get(row,'vatRate'));
    let base = baseAmount;
    if(base==null && total!=null && vatRate!=null) base = total/(1+vatRate/100);
    if(base==null && total!=null && vatAmount!=null) base = total - vatAmount;
    if(base==null) base = total!=null ? total : 0;
    if(vatRate==null && base && vatAmount!=null) vatRate = Math.round((vatAmount/base)*100);
    if(vatRate==null) vatRate = 0;

    invoices.push({
      clientKey: key,
      number: invNumber || '',
      issueDate: bulkParseDate(get(row,'issueDate')),
      dueDate: bulkParseDate(get(row,'dueDate')),
      variableSymbol: (get(row,'variableSymbol')||'').toString().trim(),
      paid: bulkParseBoolean(get(row,'paid')),
      note: (get(row,'note')||'').toString().trim(),
      desc: (get(row,'description')||'').toString().trim() || 'Import',
      base: base||0, vat: vatRate||0
    });
  });

  bi.preview = {
    clients: Array.from(clientMap.values()),
    invoices, skipped,
    newClientsCount: Array.from(clientMap.values()).filter(c=>!c.isExisting).length,
    matchedClientsCount: Array.from(clientMap.values()).filter(c=>c.isExisting).length
  };
}

async function confirmBulkImport(){
  const bi = state.bulkImport;
  if(!bi || !bi.preview) return;
  const companyId = bi.companyId || (state.companies[0] && state.companies[0].id);
  const idForKey = {};
  for(const c of bi.preview.clients){
    if(c.isExisting){ idForKey[c.key] = c.existingId; continue; }
    const newClient = {
      id: uid(), name: c.name, ico: c.ico, dic: c.dic,
      contactEmail: c.email, contactPhone: c.phone,
      address: { street: c.street, number:'', zip: c.zip, city: c.city },
      createdAt: new Date().toISOString(), attachments: []
    };
    state.clients.push(newClient);
    idForKey[c.key] = newClient.id;
  }
  await saveClients();

  if(bi.mode!=='contacts'){
    for(const inv of bi.preview.invoices){
      const clientId = idForKey[inv.clientKey];
      state.invoices.push({
        id: uid(),
        number: inv.number || `IMP-${state.invoices.length+1}`,
        clientId, companyId,
        issueDate: inv.issueDate||'', dueDate: inv.dueDate||'', taxDate: inv.issueDate||'',
        variableSymbol: inv.variableSymbol||'', note: inv.note||'',
        items: [{desc: inv.desc, qty:1, unit:'ks', price: inv.base, vat: inv.vat}],
        paid: inv.paid, paidDate: inv.paid ? (inv.dueDate||inv.issueDate||todayISO()) : null,
        createdBy: state.currentUser, colorMode:'color', currency:'CZK', rounding:'none'
      });
    }
    await saveInvoices();
  }
  state.bulkImport = null;
  state.view = bi.mode==='contacts' ? 'clients' : 'invoices';
  render();
}

function blankLocation(){ return { rack:'', shelf:'', spot:'' }; }
function formatLocation(loc){
  if(!loc) return '';
  if(typeof loc === 'string') return loc;
  const parts = [];
  if(loc.warehouse) parts.push('Sklad '+loc.warehouse);

function exVat(amount, vatPct){
  const v = vatPct||0;
  return v>0 ? amount/(1+v/100) : amount;
}
function productValuationMethod(){
  return (state.companies[0] && state.companies[0].inventoryValuationMethod) || 'average';
}
function productCostLayers(p){
  const movements = (p.movements||[]).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const layers = [];
  movements.forEach(m=>{
    if(m.qty>0){
      const grossCost = m.unitCost!=null ? m.unitCost : (p.purchasePrice||0);
      const vatPct = m.vatAtTime!=null ? m.vatAtTime : (p.vatRatePurchase??21);
      layers.push({ qty:m.qty, unitCost: exVat(grossCost, vatPct) });
    }
    else if(m.qty<0){
      let toRemove = -m.qty;
      while(toRemove>0 && layers.length){
        const layer = layers[0];
        const take = Math.min(layer.qty, toRemove);
        layer.qty -= take; toRemove -= take;
        if(layer.qty<=0) layers.shift();
      }
    }
  });
  return layers;
}
function productUnitCost(p){
  // Efektivní nákladová cena za kus BEZ DPH — nákupní cena se zadává s DPH (jako na dokladu
  // od dodavatele), program si DPH sama odečte podle sazby platné v době pohybu.
  const movements = p.movements||[];
  const fallback = exVat(p.purchasePrice||0, p.vatRatePurchase??21);
  if(!movements.length) return fallback;
  if(productValuationMethod()==='fifo'){
    const layers = productCostLayers(p);
    return layers.length ? layers[0].unitCost : fallback;
  }
  const incoming = movements.filter(m=>m.qty>0);
  const totalQty = incoming.reduce((s,m)=>s+m.qty,0);
  const totalCost = incoming.reduce((s,m)=>{
    const grossCost = m.unitCost!=null ? m.unitCost : (p.purchasePrice||0);
    const vatPct = m.vatAtTime!=null ? m.vatAtTime : (p.vatRatePurchase??21);
    return s + m.qty*exVat(grossCost, vatPct);
  }, 0);
  return totalQty>0 ? totalCost/totalQty : fallback;
}
function computeProductStockValue(p){
  if(!(p.movements||[]).length) return exVat(p.purchasePrice||0, p.vatRatePurchase??21) * (p.stockCurrent||0);
  if(productValuationMethod()==='fifo'){
    return productCostLayers(p).reduce((s,l)=> s + l.qty*l.unitCost, 0);
  }
  return productUnitCost(p) * (p.stockCurrent||0);
}
function productsRevenueAndProfit(range){
  let revenue = 0, profit = 0;
  state.invoices.forEach(inv=>{
    if(range.from && (inv.issueDate||'') < range.from) return;
    if(range.to && (inv.issueDate||'') > range.to) return;
    (inv.items||[]).forEach(it=>{
      if(!it.productId) return;
      const p = productById(it.productId);
      if(!p) return;
      const qty = parseFloat(it.qty)||0;
      const lineRevenue = qty * (it.price||0);
      const unitCost = productUnitCost(p) + (p.costs||0);
      revenue += lineRevenue;
      profit += lineRevenue - qty*unitCost;
    });
  });
  return { revenue, profit };
}
function productMargin(p){
  const purchase = productUnitCost(p), sale = p.salePrice||0, costs = p.costs||0;
  const totalCost = purchase + costs;
  const profit = sale - totalCost;
  const marginPct = sale>0 ? (profit/sale*100) : 0;
  const markupPct = totalCost>0 ? (profit/totalCost*100) : 0;
  return { profit, marginPct, markupPct, totalCost, unitCost: purchase };
}
function stockAvailable(p){ return (p.stockCurrent||0) - (p.stockReserved||0); }

function daysUntil(dateStr){

  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;

}

}

function randomDigits(len){
  let s = '';
  for(let i=0;i<len;i++) s += Math.floor(Math.random()*10);
  return s;
}
function generateCodeForType(type){
  const meta = barcodeTypeMeta(type);
  if(meta.numeric){
    const body = randomDigits(meta.digits);
    return body + gs1CheckDigit(body);
  }
  return randomDigits(10);
}

  {value:7, unit:'days', label:'7 dní'},
  {value:30, unit:'days', label:'30 dní'},
  {value:90, unit:'days', label:'90 dní'},
  {value:6, unit:'months', label:'6 měsíců'},
  {value:1, unit:'years', label:'1 rok'},
];
const BARCODE_TYPES = [
  {value:'EAN13', label:'EAN-13 (13 číslic) — běžné maloobchodní zboží', jsFormat:'EAN13', digits:12, numeric:true},
  {value:'EAN8', label:'EAN-8 (8 číslic) — malé obaly', jsFormat:'EAN8', digits:7, numeric:true},
  {value:'UPC', label:'UPC-A (12 číslic) — severoamerický trh', jsFormat:'UPC', digits:11, numeric:true},
  {value:'ITF14', label:'ITF-14 (14 číslic) — kartony, logistika', jsFormat:'ITF14', digits:13, numeric:true},
  {value:'CODE128', label:'Code 128 — čísla i písmena', jsFormat:'CODE128', digits:null, numeric:false},
  {value:'CODE39', label:'Code 39 — čísla i písmena (starší čtečky)', jsFormat:'CODE39', digits:null, numeric:false},
];
function barcodeTypeMeta(type){ return BARCODE_TYPES.find(t=>t.value===type) || BARCODE_TYPES[0]; }
function gs1CheckDigit(bodyDigits){
  // Standardní GS1 kontrolní číslice (stejný výpočet pro EAN-8/13, UPC-A i ITF-14):
  // počítáno zprava, váhy střídavě 3 a 1.
  let sum = 0;
  for(let i=0;i<bodyDigits.length;i++){
    const d = parseInt(bodyDigits[bodyDigits.length-1-i],10)||0;
    sum += (i%2===0) ? d*3 : d;
  }
  const mod = sum % 10;
  return mod===0 ? '0' : String(10-mod);
}
function buildBarcodeForType(source, type){
  const meta = barcodeTypeMeta(type);
  const digitsOnly = String(source||'').replace(/\D/g,'');
  if(meta.jsFormat==='CODE128'){
    const raw = String(source||'').trim();
    return { value: raw || digitsOnly || '0', format:'CODE128' };
  }
  if(meta.jsFormat==='CODE39'){
    let raw = String(source||'').toUpperCase().replace(/[^0-9A-Z\-\.\$\/\+% ]/g,'');
    if(!raw) raw = digitsOnly || '0';
    return { value: raw, format:'CODE39' };
  }
  // číselné GS1 typy (EAN-13/8, UPC-A, ITF-14)
  const body = digitsOnly.padStart(meta.digits,'0').slice(-meta.digits);
  return { value: body + gs1CheckDigit(body), format: meta.jsFormat };
}
function barcodeValueFor(p){
  // Čárový kód na štítku se VŽDY generuje z produktového čísla (auto nebo vlastního) a
  // podle zvoleného typu (p.barcodeType) — s EAN polem nahoře (to slouží jen k
  // vyhledání údajů o produktu) nemá nic společného.
  return buildBarcodeForType(p.number || p.internalCode || p.id || '', p.barcodeType || 'EAN13').value;
}
function barcodeLibReady(){
  if(typeof JsBarcode === 'undefined'){
    console.error('Knihovna JsBarcode se nenačetla (zkontroluj připojení k internetu nebo blokování skriptů).');
    return false;
  }
  return true;
}
function renderBarcodeToSvg(svgEl, source, type){
  if(!barcodeLibReady()) return null;
  try{
    const { value, format } = buildBarcodeForType(source, type || 'EAN13');
    JsBarcode(svgEl, value, { format, displayValue:true, fontSize:13, height:46, margin:6, background:'#ffffff', lineColor:'#1A2233' });
    return value;
  }catch(e){ console.error('Barcode render failed', e); return null; }
}
function renderAutoBarcodeToSvg(svgEl, rawValue){
  // Pro náhled zadaného/naskenovaného EAN nahoře — zobrazí přesně to, co bylo zadáno,
  // formát (EAN-13/EAN-8/Code128) se pozná podle délky. Pokud selže kontrolní součet
  // (např. při rozepsaném čísle), spadne to na Code128, ať se obrázek zobrazí vždy.
  if(!barcodeLibReady()) return false;
  const v = String(rawValue||'');
  const format = /^\d{13}$/.test(v) ? 'EAN13' : /^\d{8}$/.test(v) ? 'EAN8' : 'CODE128';
  try{
    JsBarcode(svgEl, v, { format, displayValue:true, fontSize:13, height:46, margin:6, background:'#ffffff', lineColor:'#1A2233' });
    return true;
  }catch(e){
    try{
      JsBarcode(svgEl, v, { format:'CODE128', displayValue:true, fontSize:13, height:46, margin:6, background:'#ffffff', lineColor:'#1A2233' });
      return true;
    }catch(e2){
      console.error('Barcode render failed', e2);
      return false;
    }
  }
}

/* ---------- EAN lookup (Open Food Facts – veřejné API bez klíče) ---------- */
async function eanLookup(ean){
  // Univerzální endpoint prohledá zároveň Open Food Facts, Open Beauty Facts,
  // Open Pet Food Facts i Open Products Facts (obecné/nepotravinové zboží) —
  // takže nejde jen o potraviny jako u klasických "kalorických tabulek".
  const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(ean)}.json?product_type=all`);
  if(!res.ok) throw new Error('Vyhledávání se nepovedlo.');
  const data = await res.json();
  if((data.status !== 1 && data.status !== 'success') || !data.product) return null;
  const p = data.product;
  const n = p.nutriments || {};
  const numOrNull = v => (v===undefined || v===null || v==='') ? null : parseFloat(v);
  return {
    name: p.product_name || p.product_name_cs || p.generic_name || p.product_name_en || '',
    manufacturer: (p.brands||'').split(',')[0]?.trim() || '',
    category: (p.categories||'').split(',')[0]?.trim() || '',
    image: p.image_front_url || p.image_url || p.image_front_small_url || '',
    nutrition: {
      per: '100g',
      energyKj: numOrNull(n['energy-kj_100g']),
      energyKcal: numOrNull(n['energy-kcal_100g']),
      fat: numOrNull(n['fat_100g']),
      saturatedFat: numOrNull(n['saturated-fat_100g']),
      carbs: numOrNull(n['carbohydrates_100g']),
      sugars: numOrNull(n['sugars_100g']),
      fiber: numOrNull(n['fiber_100g']),
      protein: numOrNull(n['proteins_100g']),
      salt: numOrNull(n['salt_100g'])
    }
  };
}

function setupProductPhotoDropzone(){
  const drop = document.getElementById('product-photo-drop');
  const input = document.getElementById('product-photo-input');
  if(!drop) return;
  drop.addEventListener('click', ()=>{ if(input) input.click(); });
  drop.addEventListener('dragover', (e)=>{ e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', ()=> drop.classList.remove('drag'));
  drop.addEventListener('drop', async (e)=>{
    e.preventDefault(); drop.classList.remove('drag');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) await applyProductPhotoFile(file);
  });
  if(input){
    input.addEventListener('change', async ()=>{ if(input.files[0]) await applyProductPhotoFile(input.files[0]); });
  }
  document.addEventListener('paste', productPastePhotoHandler);
}
async function productPastePhotoHandler(e){
  if(!document.getElementById('product-photo-drop')) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type && item.type.startsWith('image/')){
      const file = item.getAsFile();
      if(file){ await applyProductPhotoFile(file); break; }
    }
  }
}
async function applyProductPhotoFile(file){
  if(!file.type || !file.type.startsWith('image/')){ alert('Vyber prosím obrázek.'); return; }
  try{
    const dataUrl = await resizeImageFile(file, 480, 0.85);
    state.currentProductDraftPhoto = dataUrl;
    const drop = document.getElementById('product-photo-drop');
    if(drop) drop.innerHTML = `<img src="${dataUrl}" alt="Fotografie produktu">`;
  }catch(err){ alert('Fotografii se nepodařilo zpracovat, zkus to prosím znovu.'); }
}

function receivedInvoiceStatusLabel(s){ return s==='paid' ? 'Zaplaceno' : (s==='overdue' ? 'Po splatnosti' : (s==='draft' ? 'Nezpracováno' : 'Čeká na platbu')); }
function receivedInvoiceStatusPill(s){ return s==='paid' ? 'paid' : (s==='overdue' ? 'overdue' : (s==='draft' ? 'draft' : 'pending')); }
function receivedInvoiceIsDraft(inv){
  // Rychle nahraný soubor bez dalších údajů — čeká na doplnění.
  return !!inv.attachment && !(parseFloat(inv.amount)>0) && !inv.issueDate && !inv.number;
}
function receivedInvoiceStatus(inv){
  if(receivedInvoiceIsDraft(inv)) return 'draft';
  if(inv.status==='paid') return 'paid';
  if(inv.dueDate && inv.dueDate < todayISO()) return 'overdue';
  return 'unpaid';
}
function filteredSortedReceivedInvoices(){
  const q = stripDiacritics(state.receivedInvoiceSearch||'').toLowerCase().trim();
  const statusFilter = state.receivedInvoiceFilters.status;
  const supplierFilter = state.receivedInvoiceFilters.supplierId;
  let list = state.receivedInvoices.filter(inv=>{
    if(q){
      const hay = stripDiacritics(`${inv.supplierName||''} ${inv.number||''} ${inv.variableSymbol||''} ${inv.orderNumber||''} ${inv.note||''}`).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(statusFilter && receivedInvoiceStatus(inv)!==statusFilter) return false;
    if(supplierFilter && inv.supplierId!==supplierFilter) return false;
    return true;
  });
  const {key,dir} = state.receivedInvoiceSort;
  const mul = dir==='asc'?1:-1;
  list.sort((a,b)=>{
    let av, bv;
    if(key==='amount'){ av = parseFloat(a.amount)||0; bv = parseFloat(b.amount)||0; }
    else { av = a[key]; bv = b[key]; }
    if(typeof av==='number' && typeof bv==='number') return (av-bv)*mul;
    return String(av||'').localeCompare(String(bv||''),'cs')*mul;
  });
  return list;
}
function viewReceivedInvoices(){

function blankRecurring(){
  return {
    id: uid(), clientId: state.clients[0]?state.clients[0].id:null, companyId: state.companies[0].id,
    items: [{desc:'',qty:1,unit:'ks',price:0,vat:21}],
    interval:'monthly', startDate: todayISO(), nextRunDate: todayISO(), dueDays:14,
    paymentMethod:'Bankovním převodem', currency:'CZK', note:'', active:true,
    createdCount:0, lastGeneratedAt:null, lastGeneratedInvoiceId:null
  };
}
function recurringIntervalLabel(iv){ return iv==='monthly'?'Měsíčně':(iv==='quarterly'?'Čtvrtletně':'Ročně'); }
function advanceRecurringDate(dateStr, interval){
  const d = new Date(dateStr+'T00:00:00');
  if(interval==='quarterly') d.setMonth(d.getMonth()+3);
  else if(interval==='yearly') d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
async function generateInvoiceFromRecurring(tpl){
  const co = companyById(tpl.companyId) || state.companies[0];
  const num = `${co.prefix}${co.nextNumber}`;
  const invoice = {
    id: uid(), number: num, clientId: tpl.clientId, companyId: co.id,
    docType:'invoice', relatedInvoiceId:null, creditReason:'',
    issueDate: todayISO(), taxDate: todayISO(), dueDate: addDays(todayISO(), tpl.dueDays||14),
    variableSymbol: num.replace(/\D/g,''), constantSymbol:'', orderNumber:'',
    currency: tpl.currency||'CZK', discountType:'none', discountValue:0, rounding:'none',
    paymentMethod: tpl.paymentMethod||'Bankovním převodem',
    includeStamp:true, colorMode:'color', includeSignature:true, includeQr:true,
    note: tpl.note||'', items: JSON.parse(JSON.stringify(tpl.items||[])),
    paid:false, paidDate:null, createdBy: state.currentUser, generatedFromRecurringId: tpl.id
  };
  state.invoices.push(invoice);
  co.nextNumber = (co.nextNumber||1) + 1;
  tpl.nextRunDate = advanceRecurringDate(tpl.nextRunDate, tpl.interval);
  tpl.createdCount = (tpl.createdCount||0) + 1;
  tpl.lastGeneratedAt = new Date().toISOString();
  tpl.lastGeneratedInvoiceId = invoice.id;
  await saveCompanies();
  await saveInvoices();
  await saveRecurringInvoices();
  return invoice;
}

function warehouseById(id){ return state.warehouses.find(w=>w.id===id); }
function defaultWarehouse(){ return state.warehouses.find(w=>w.isDefault) || state.warehouses[0]; }
function warehouseOptions(selectedId){
  return state.warehouses.map(w=>`<option value="${w.id}" ${selectedId===w.id?'selected':''}>${escapeHtml(w.name)}${w.isDefault?' (výchozí)':''}</option>`).join('');
}
const WAREHOUSE_CAPACITY_UNITS = { palety:'Palety', boxy:'Boxy', jine:'Vlastní jednotka' };
function warehouseCapacityUnitLabel(w){
  if(w.capacityUnitType==='jine') return w.capacityUnitCustomLabel||'jednotky';
  return WAREHOUSE_CAPACITY_UNITS[w.capacityUnitType]||'jednotky';
}
function computeWarehouseUsage(w){
  // Palety/boxy program počítá sama z aktuálního skladu produktů v tomhle skladu
  // (podle "kusů na paletě"/"kusů v boxu" u produktu) — u vlastní jednotky se
  // hodnota zadává ručně, protože program neví, co ta jednotka znamená.
  // Každý produkt se počítá zvlášť a zaokrouhluje se NAHORU (1,5 palety = 2 palety,
  // protože rozdělaná paleta pořád zabírá celé místo — jakmile se to nevejde na
  // jednu, hned je potřeba další).
  if(w.capacityUnitType==='jine') return w.currentUsage||0;
  const key = w.capacityUnitType==='boxy' ? 'unitsPerBox' : 'unitsPerPallet';
  return state.products
    .filter(p=>p.warehouseId===w.id && !p.archived && (p[key]||0)>0)
    .reduce((s,p)=> s + Math.ceil((p.stockCurrent||0)/p[key]), 0);
}

async function onSubmitOrder(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const items = state.orderFormItems.filter(it=>it.productId && (it.qty||0)>0);
  if(!items.length){ alert('Přidej alespoň jednu položku napojenou na produkt.'); return; }
  const fields = {
    number: (fd.get('number')||'').trim(), clientId: fd.get('clientId'), companyId: fd.get('companyId'),
    warehouseId: fd.get('warehouseId'), note: fd.get('note')||'', items
  };
  const editing = state.editingOrderId ? state.orders.find(o=>o.id===state.editingOrderId) : null;
  if(editing){
    const idx = state.orders.findIndex(o=>o.id===editing.id);
    // zachovat scannedQty u položek, které v editaci zůstaly stejné (podle productId)
    fields.items = fields.items.map(it=>{
      const prev = (editing.items||[]).find(x=>x.productId===it.productId);
      return { ...it, scannedQty: prev ? Math.min(prev.scannedQty||0, it.qty) : 0 };
    });
    state.orders[idx] = { ...editing, ...fields };
  } else {
    fields.items = fields.items.map(it=>({ ...it, scannedQty:0 }));
    state.orders.push({ ...blankOrder(), ...fields });
  }
  try{ await saveOrders(); }catch(err){ alert('Uložení se nepovedlo, zkus to prosím znovu.'); return; }
  state.editingOrderId = null;
  state.orderFormItems = [];
  state.view = 'orders';
  render();
}
function setupStockMovementPicker(){
  const input = document.getElementById('stock-movement-product-input');
  const list = document.getElementById('stock-movement-product-list');
  if(!input || !list) return;
  if(state.newMovementPanelOpen && !state.stockMovementProductId) input.focus();
  function renderList(query){
    const q = stripDiacritics(query||'').toLowerCase().trim();
    const matches = state.products.filter(p=>{
      if(p.archived) return false;
      if(!q) return true;
      return stripDiacritics(`${p.name} ${p.ean||''} ${p.number||''}`).toLowerCase().includes(q);
    }).slice(0,30);
    list.innerHTML = matches.length ? matches.map(p=>`
      <div class="combo-item" data-id="${p.id}">
        <div>${escapeHtml(p.name)}</div>
        <div class="sub">${escapeHtml(p.number||'')}${p.ean?' · EAN '+escapeHtml(p.ean):''} · skladem ${stockAvailable(p)} ${escapeHtml(p.unit||'ks')}</div>
      </div>
    `).join('') : `<div class="combo-empty">Žádný produkt neodpovídá.</div>`;
    list.classList.add('open');
  }
  input.addEventListener('focus', ()=>renderList(input.value));
  input.addEventListener('input', ()=>renderList(input.value));
  list.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.combo-item');
    if(!item) return;
    state.stockMovementProductId = item.getAttribute('data-id');
    list.classList.remove('open');
    render();
  });
  document.addEventListener('click', (e)=>{
    if(e.target!==input && !list.contains(e.target)) list.classList.remove('open');
  });
}

  const invoice = {

function processScan(code){
  code = (code||'').trim();
  if(!code) return;
  const o = state.orders.find(x=>x.id===state.fulfillingOrderId);
  if(!o) return;
  const item = currentPickItem(o);
  const statusEl = document.getElementById('fulfill-scan-status');
  if(!item) return;
  const matches = (item.ean && code===item.ean) || (item.productNumber && code===item.productNumber);
  if(matches){
    item.scannedQty = (item.scannedQty||0) + 1;
    if(o.status==='new') o.status = 'picking';
    saveOrders().catch(()=>{});
    if(statusEl) statusEl.textContent = '✅ Naskenováno';
    render();
  } else {
    if(statusEl) statusEl.textContent = '❌ Kód neodpovídá téhle položce — zkus znovu, nebo potvrď ručně.';
  }
}
async function startCameraScan(){
  if(!('BarcodeDetector' in window)){
    alert('Tenhle prohlížeč nepodporuje skenování kamerou (funguje v Chrome na Androidu/desktopu). Použij čtečku napojenou jako klávesnice, nebo kód zadej ručně.');
    return;
  }
  const video = document.getElementById('fulfill-camera-video');
  if(!video) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    video.style.display = '';
    await video.play();
    const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','code_128','upc_a','upc_e'] });
    const stop = ()=>{ stream.getTracks().forEach(t=>t.stop()); video.style.display='none'; };
    const scanLoop = async ()=>{
      if(video.style.display==='none' || !document.body.contains(video)) { stream.getTracks().forEach(t=>t.stop()); return; }
      try{
        const codes = await detector.detect(video);
        if(codes.length){ processScan(codes[0].rawValue); stop(); return; }
      }catch(err){}
      requestAnimationFrame(scanLoop);
    };
    scanLoop();
  }catch(err){
    alert('Přístup ke kameře se nepovedlo získat.');
  }
}

  (items||[]).forEach(it=>{ const b=(it.qty||0)*(it.price||0); base+=b; vat+=b*((it.vat||0)/100); });

}

async function onSubmitSupplier(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const id = fd.get('id');
  const existing = supplierById(id);
  const s = {
    id: id || uid(),
    name: fd.get('name'), ico: fd.get('ico'), dic: fd.get('dic'),
    address: gatherAddrField(fd,'supplier-address'),
    contactPerson: fd.get('contactPerson'), contactPhone: fd.get('contactPhone'), contactEmail: fd.get('contactEmail'),
    website: fd.get('website'), note: fd.get('note'),
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
    attachments: existing ? (existing.attachments||[]) : (state.newSupplierDraftAttachments||[])
  };
  if(existing){ const idx = state.suppliers.findIndex(x=>x.id===id); state.suppliers[idx]=s; }
  else{ state.suppliers.push(s); }
  state.newSupplierDraftId = null;
  state.newSupplierDraftAttachments = [];
  await saveSuppliers();
  state.view='supplier-detail'; state.viewingSupplierId=s.id;
  render();
}
