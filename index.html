function visibleProductColumns(){ return state.productColumns.filter(c=>c.visible); }
function filteredSortedProducts(){
  const q = stripDiacritics(state.productSearch||'').toLowerCase().trim();
  const f = state.productFilters;
  let list = state.products.filter(p=>{
    if(f.archived==='' && p.archived) return false;
    if(f.archived==='archived' && !p.archived) return false;
    if(q){
      const hay = stripDiacritics(`${p.name} ${p.ean} ${p.number} ${p.internalCode} ${p.manufacturer} ${formatLocation(p.location)} ${(supplierById(p.supplierId)||{}).name||''}`).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(f.stock && stockStatus(p)!==f.stock) return false;
    if(f.category && p.category!==f.category) return false;
    if(f.supplierId && p.supplierId!==f.supplierId) return false;
    if(f.manufacturer && p.manufacturer!==f.manufacturer) return false;
    if(f.expiry && f.expiry!=='sort-asc' && f.expiry!=='sort-desc'){
      const days = daysUntil(p.expiryDate);
      if(days==null) return false;
      const limit = parseInt(f.expiry,10);
      if(days>limit) return false;
    }
    return true;
  });
  let sortKey = state.productSort.key, sortDir = state.productSort.dir;
  if(f.expiry==='sort-asc'){ sortKey='expiry'; sortDir='asc'; }
  else if(f.expiry==='sort-desc'){ sortKey='expiry'; sortDir='desc'; }
  const mul = sortDir==='asc'?1:-1;
  list.sort((a,b)=>{
    let av, bv;
    if(sortKey==='supplier'){ av=(supplierById(a.supplierId)||{}).name||''; bv=(supplierById(b.supplierId)||{}).name||''; }
    else if(sortKey==='margin'){ av=productMargin(a).marginPct; bv=productMargin(b).marginPct; }
    else if(sortKey==='stock'){ av=stockAvailable(a); bv=stockAvailable(b); }
    else if(sortKey==='expiry'){ av=a.expiryDate||'9999'; bv=b.expiryDate||'9999'; }
    else { av=a[sortKey]; bv=b[sortKey]; }
    if(typeof av==='number' && typeof bv==='number') return (av-bv)*mul;
    return String(av||'').localeCompare(String(bv||''),'cs')*mul;
  });
  return list;
}
function productCellContent(p, key){
  switch(key){
    case 'photo': return p.photo ? `<img class="prod-thumb" src="${p.photo}" alt="">` : `<div class="prod-thumb-empty"></div>`;
    case 'name': return `<div style="font-weight:500;">${escapeHtml(p.name||'(bez názvu)')}</div>`;
    case 'number': return `<span class="num">${escapeHtml(p.number||'—')}</span>`;
    case 'internalCode': return `<span class="num">${escapeHtml(p.internalCode||'—')}</span>`;
    case 'ean': return `<span class="num">${escapeHtml(p.ean||'—')}</span>`;
    case 'category': return escapeHtml(p.category||'—');
    case 'manufacturer': return escapeHtml(p.manufacturer||'—');
    case 'supplier': return escapeHtml((supplierById(p.supplierId)||{}).name||'—');
    case 'purchasePrice': return `<span class="num">${money(fmt(p.purchasePrice||0)+' Kč')}</span>`;
    case 'salePrice': return `<span class="num">${money(fmt(p.salePrice||0)+' Kč')}</span>`;
    case 'margin': { const m=productMargin(p); return `<span class="num">${money(m.marginPct.toFixed(0)+'%')}</span>`; }
    case 'stock': { const s=stockStatus(p); return `<span class="pill ${stockPillClass(s)}">${stockAvailable(p)} ${escapeHtml(p.unit||'ks')}</span>`; }
    case 'warehouseName': return escapeHtml((warehouseById(p.warehouseId)||{}).name||'—');
    case 'location': return escapeHtml(formatLocation(p.location)) || '—';
    case 'expiry': return expiryBadge(p) || '—';
    default: return '';
  }
}

function setupProductForm(){
  const form = document.getElementById('product-form');
  if(!form) return;
  setupProductPhotoDropzone();

  const nutritionCheckbox = document.getElementById('has-nutrition-checkbox');
  const nutritionBox = document.getElementById('nutrition-fields-box');
  if(nutritionCheckbox && nutritionBox){
    nutritionCheckbox.addEventListener('change', ()=>{
      nutritionBox.style.display = nutritionCheckbox.checked ? 'block' : 'none';
    });
  }

  const categorySelect = document.getElementById('product-category-select');
  if(categorySelect){
    categorySelect.addEventListener('change', async ()=>{
      if(categorySelect.value !== '__new__') return;
      const name = prompt('Název nové kategorie:');
      if(!name || !name.trim()){ categorySelect.value = ''; return; }
      const trimmed = name.trim();
      let cat = state.categories.find(c=>c.name.toLowerCase()===trimmed.toLowerCase());
      if(!cat){
        cat = { id: uid(), name: trimmed };
        state.categories.push(cat);
        try{ await saveCategories(); }catch(err){ alert('Uložení kategorie se nepovedlo.'); }
      }
      const opt = document.createElement('option');
      opt.value = cat.name; opt.textContent = cat.name;
      categorySelect.insertBefore(opt, categorySelect.querySelector('option[value="__new__"]'));
      categorySelect.value = cat.name;
    });
  }

  if(state.pendingEditMovementId){
    const p = state.editingProductId ? productById(state.editingProductId) : null;
    const m = p ? (p.movements||[]).find(x=>x.id===state.pendingEditMovementId) : null;
    state.pendingEditMovementId = null;
    if(m) openMovementEditPanel(m);
  }

  function drawProductNumberBarcode(){
    const svg = document.getElementById('product-number-barcode-svg');
    const errorEl = document.getElementById('product-number-barcode-error');
    if(!svg) return;
    const numberInput = form.querySelector('input[name="number"]');
    const value = (numberInput && numberInput.value.trim()) || peekProductNumber('EAN13');
    if(!barcodeLibReady()) return;
    svg.innerHTML = '';
    let usedFallback = false;
    try{
      JsBarcode(svg, value, { format:'EAN13', displayValue:true, fontSize:13, height:46, margin:6, background:'#ffffff', lineColor:'#1A2233' });
    }catch(e){
      try{
        JsBarcode(svg, value, { format:'CODE128', displayValue:true, fontSize:13, height:46, margin:6, background:'#ffffff', lineColor:'#1A2233' });
        usedFallback = true;
      }catch(e2){ console.error('Barcode render failed', e2); }
    }
    if(errorEl) errorEl.style.display = usedFallback ? '' : 'none';
  }
  function filterNumberInput(){
    const numberInput = form.querySelector('input[name="number"]');
    if(!numberInput) return;
    const cleaned = numberInput.value.replace(/\D/g,'');
    if(cleaned !== numberInput.value) numberInput.value = cleaned;
  }
  drawProductNumberBarcode();
  const numberInputEl = form.querySelector('input[name="number"]');
  if(numberInputEl){
    numberInputEl.addEventListener('input', ()=>{ filterNumberInput(); drawProductNumberBarcode(); });
  }
  const regenNumberBtn = document.getElementById('regen-number-btn');
  if(regenNumberBtn){
    regenNumberBtn.addEventListener('click', ()=>{
      if(numberInputEl){ numberInputEl.value = generateUniqueProductNumber('EAN13'); drawProductNumberBarcode(); }
    });
  }

  function drawEanBarcodePreview(){
    const svg = document.getElementById('ean-barcode-svg');
    const box = document.getElementById('ean-barcode-box');
    const eanInput = document.getElementById('product-ean');
    const errorEl = document.getElementById('ean-barcode-error');
    if(!svg || !box || !eanInput) return;
    const val = eanInput.value.trim();
    if(!val){ box.style.display = 'none'; return; }
    box.style.display = '';
    svg.innerHTML = '';
    const ok = renderAutoBarcodeToSvg(svg, val);
    if(errorEl) errorEl.style.display = ok ? 'none' : '';
  }
  drawEanBarcodePreview();
  const eanInput = document.getElementById('product-ean');
  if(eanInput) eanInput.addEventListener('input', drawEanBarcodePreview);

  const eanBtn = document.getElementById('ean-lookup-btn');
  if(eanBtn){
    eanBtn.addEventListener('click', async ()=>{
      const ean = document.getElementById('product-ean').value.trim();
      const statusEl = document.getElementById('ean-lookup-status');
      if(!ean){ if(statusEl) statusEl.textContent = 'Napiš nebo naskenuj EAN.'; return; }
      if(statusEl) statusEl.textContent = 'Hledám v databázi produktů…';
      eanBtn.disabled = true;
      try{
        const found = await eanLookup(ean);
        if(!found){
          if(statusEl) statusEl.textContent = 'Produkt s tímto EAN nebyl nalezen — doplň údaje ručně.';
        } else {
          if(found.name) form.querySelector('input[name="name"]').value = found.name;
          if(found.manufacturer) form.querySelector('input[name="manufacturer"]').value = found.manufacturer;
          if(found.category){
            const catSelect = document.getElementById('product-category-select');
            if(catSelect){
              let opt = [...catSelect.options].find(o=>o.value.toLowerCase()===found.category.toLowerCase());
              if(!opt){
                opt = document.createElement('option');
                opt.value = found.category; opt.textContent = found.category;
                catSelect.insertBefore(opt, catSelect.querySelector('option[value="__new__"]'));
                state.categories.push({ id: uid(), name: found.category });
                saveCategories().catch(()=>{});
              }
              catSelect.value = opt.value;
            }
          }
          if(found.image){
            state.currentProductDraftPhoto = found.image;
            const drop = document.getElementById('product-photo-drop');
            if(drop) drop.innerHTML = `<img src="${found.image}" alt="Fotografie produktu">`;
          }
          if(found.nutrition){
            const nu = found.nutrition;
            const anyValue = Object.keys(nu).some(k=>k!=='per' && nu[k]!=null);
            if(anyValue){
              const nutritionCheckbox = document.getElementById('has-nutrition-checkbox');
              const nutritionBox = document.getElementById('nutrition-fields-box');
              if(nutritionCheckbox) nutritionCheckbox.checked = true;
              if(nutritionBox) nutritionBox.style.display = 'block';
            }
            Object.keys(nu).forEach(k=>{
              if(k==='per' || nu[k]===null) return;
              const el2 = document.querySelector(`[name="nutri-${k}"]`);
              if(el2) el2.value = nu[k];
            });
          }
          if(statusEl) statusEl.textContent = 'Údaje doplněny — zkontroluj je a uprav podle potřeby.';
        }
      }catch(err){
        if(statusEl) statusEl.textContent = 'Vyhledávání se nepovedlo, zkus to prosím znovu.';
      } finally {
        eanBtn.disabled = false;
        drawEanBarcodePreview();
      }
    });
  }

  form.addEventListener('submit', onSubmitProduct);
}

    expiryDate: existing ? existing.expiryDate : '', photo, link: fd.get('link')||'',
    composition: fd.get('composition')||'',
    dimensionUnit: fd.get('dimensionUnit')||'cm',
    dimensions: { width: parseFloat(fd.get('dimWidth'))||0, height: parseFloat(fd.get('dimHeight'))||0, depth: parseFloat(fd.get('dimDepth'))||0 },
    packageDimensions: { width: parseFloat(fd.get('pkgWidth'))||0, height: parseFloat(fd.get('pkgHeight'))||0, depth: parseFloat(fd.get('pkgDepth'))||0 },
    unitsPerPallet: parseFloat(fd.get('unitsPerPallet'))||0,

      energyKcal: fd.get('nutri-energyKcal')!=='' ? parseFloat(fd.get('nutri-energyKcal')) : null,
      fat: fd.get('nutri-fat')!=='' ? parseFloat(fd.get('nutri-fat')) : null,
      saturatedFat: fd.get('nutri-saturatedFat')!=='' ? parseFloat(fd.get('nutri-saturatedFat')) : null,
      carbs: fd.get('nutri-carbs')!=='' ? parseFloat(fd.get('nutri-carbs')) : null,
      sugars: fd.get('nutri-sugars')!=='' ? parseFloat(fd.get('nutri-sugars')) : null,
      fiber: fd.get('nutri-fiber')!=='' ? parseFloat(fd.get('nutri-fiber')) : null,
      protein: fd.get('nutri-protein')!=='' ? parseFloat(fd.get('nutri-protein')) : null,

function recomputeMovementsChain(p){
  const sorted = [...(p.movements||[])].sort((a,b)=> new Date(a.date)-new Date(b.date));
  let running = 0;
  sorted.forEach(m=>{ running += (parseFloat(m.qty)||0); m.resultingStock = running; });
  p.stockCurrent = running;
}
async function promptStockMovement(productId){
  const p = productById(productId);
  if(!p) return;
  const types = ['příjem','výdej','prodej','vrácení','reklamace','inventura','ruční úprava'];
  const typeInput = prompt(`Typ pohybu (${types.join(' / ')}):`, 'příjem');
  if(typeInput===null) return;
  const type = types.includes(typeInput.trim()) ? typeInput.trim() : 'ruční úprava';
  const qtyRaw = prompt('Množství (kladné = přijde na sklad, záporné = odejde ze skladu):', '1');
  if(qtyRaw===null) return;
  const qty = parseFloat(qtyRaw);
  if(isNaN(qty) || qty===0){ alert('Zadej platné nenulové množství.'); return; }
  const reason = prompt('Důvod / poznámka:', type) || type;
  const resulting = (p.stockCurrent||0) + qty;
  if(resulting < 0 && !confirm(`Sklad produktu „${p.name}“ klesne do záporných hodnot (${resulting}). Pokračovat?`)) return;
  p.stockCurrent = resulting;
  p.movements = p.movements || [];
  p.movements.push({ id: uid(), type, qty, reason, note:'', date: new Date().toISOString(), user: state.currentUser, resultingStock: resulting, unitCost: p.purchasePrice||0 });
  try{ await saveProducts(); }catch(err){ alert('Uložení se nepovedlo, zkus to prosím znovu.'); return; }
  render();
}

function findProductByScanCode(code){
  const raw = String(code||'').trim();
  if(!raw) return null;
  const digits = raw.replace(/\D/g,'');
  return state.products.find(p=>{
    if(p.ean && (p.ean===raw || (digits && p.ean===digits))) return true;
    if(p.number && (p.number===raw || (digits && p.number===digits))) return true;
    if(p.number){
      const generated = buildBarcodeForType(p.number, p.barcodeType||'EAN13').value;
      if(generated===raw || (digits && generated===digits)) return true;
    }
    return false;
  }) || null;
}

function setupStockScan(){
  const input = document.getElementById('stock-scan-input');
  const list = document.getElementById('stock-scan-list');
  const resultBox = document.getElementById('stock-scan-result');
  if(!input || !resultBox) return;
  function renderSuggestions(query){
    const q = stripDiacritics(query||'').toLowerCase().trim();
    if(!q || !list){ if(list){ list.classList.remove('open'); list.innerHTML=''; } return; }
    const matches = state.products.filter(p=>{
      if(p.archived) return false;
      return stripDiacritics(`${p.name||''} ${p.ean||''} ${p.number||''} ${p.internalCode||''} ${p.description||''} ${p.composition||''}`).toLowerCase().includes(q);
    }).slice(0,20);
    list.innerHTML = matches.length ? matches.map(p=>`
      <div class="combo-item" data-id="${p.id}">
        <div>${escapeHtml(p.name)}</div>
        <div class="sub">${escapeHtml(p.number||'')}${p.ean?' · EAN '+escapeHtml(p.ean):''} · skladem ${stockAvailable(p)} ${escapeHtml(p.unit||'ks')}</div>
      </div>
    `).join('') : `<div class="combo-empty">Žádný produkt neodpovídá.</div>`;
    list.classList.add('open');
  }
  function run(){
    const val = input.value.trim();
    renderSuggestions(val);
    // Přesná shoda (typicky čtečka čárových kódů) — rovnou ukázat detail.
    const exact = val ? findProductByScanCode(val) : null;
    if(exact) resultBox.innerHTML = renderStockScanResult(exact);
    else if(!val) resultBox.innerHTML = '';
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', ()=> renderSuggestions(input.value));
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') e.preventDefault(); });
  if(list){
    list.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.combo-item');
      if(!item) return;
      const p = productById(item.getAttribute('data-id'));
      if(p){ input.value = p.name; resultBox.innerHTML = renderStockScanResult(p); }
      list.classList.remove('open');
    });
    document.addEventListener('click', (e)=>{
      if(e.target!==input && !list.contains(e.target)) list.classList.remove('open');
    });
  }
}

function buildBarcodeLabelsHtml(products, qtyEach, showPrice){
  let html = '';
  products.forEach(p=>{
    for(let i=0;i<qtyEach;i++){
      html += `<div class="barcode-label">
        <div class="bl-name">${escapeHtml(p.name||'')}</div>
        <div class="bl-num">${escapeHtml(p.number||'')}</div>
        <svg class="bl-svg" data-barcode-source="${escapeAttr(p.number || p.internalCode || p.id || '')}" data-barcode-type="${escapeAttr(p.barcodeType||'EAN13')}"></svg>
        ${showPrice?`<div class="bl-price">${fmt(p.salePrice||0)} Kč</div>`:''}
      </div>`;
    }
  });
  return html;
}
async function downloadProductCodeFiles(productIds){
  const ids = Array.isArray(productIds) ? productIds : [productIds];
  if(!barcodeLibReady()) return;
  for(const id of ids){
    const p = productById(id);
    if(!p) continue;
    const canvas = document.createElement('canvas');
    const v = String(p.number || p.ean || '');
    const format = /^\d{13}$/.test(v) ? 'EAN13' : /^\d{8}$/.test(v) ? 'EAN8' : 'CODE128';
    try{ JsBarcode(canvas, v, { format, displayValue:true, fontSize:16, margin:10 }); }
    catch(e){ try{ JsBarcode(canvas, v, { format:'CODE128', displayValue:true, fontSize:16, margin:10 }); }catch(e2){ console.error(e2); continue; } }
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = `Produktovy-kod-${(v||p.id).replace(/[^\w.-]+/g,'_')}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  }
}
async function downloadProductInfoFiles(productIds){
  const ids = Array.isArray(productIds) ? productIds : [productIds];
  if(!window.html2pdf) return;
  for(const id of ids){
    const p = productById(id);
    if(!p) continue;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'background:#fff;padding:10px;width:700px;';
    wrap.innerHTML = productInfoSheetHtml(p).html;
    document.body.appendChild(wrap);
    wrap.querySelectorAll('svg.pi-code-own').forEach(svg=> renderAutoBarcodeToSvg(svg, svg.getAttribute('data-code')));
    wrap.querySelectorAll('svg.pi-code-mfr').forEach(svg=> renderAutoBarcodeToSvg(svg, svg.getAttribute('data-code')));
    try{
      await html2pdf().set({
        margin:10,
        filename: `Informace-o-produktu-${(p.name||'produkt').replace(/[^\w.-]+/g,'_')}.pdf`,
        image:{type:'jpeg',quality:0.98},
        html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff'},
        jsPDF:{unit:'pt', format:'a4', orientation:'portrait'}
      }).from(wrap).save();
    }catch(err){ console.error(err); }
    finally{ wrap.remove(); }
  }
}
function printProductCodeOnly(productIds){
  const ids = Array.isArray(productIds) ? productIds : [productIds];
  const products = ids.map(id=>productById(id)).filter(Boolean);
  if(!products.length) return;
  let sheet = document.getElementById('product-code-print-sheet');
  if(!sheet){
    sheet = document.createElement('div');
    sheet.id = 'product-code-print-sheet';
    document.body.appendChild(sheet);
  }
  sheet.innerHTML = products.map((p,i)=>`<div class="code-only-block"><svg id="product-code-only-svg-${i}"></svg></div>`).join('');
  products.forEach((p,i)=>{
    const svg = document.getElementById('product-code-only-svg-'+i);
    if(!svg || !barcodeLibReady()) return;
    const v = String(p.number || p.ean || '');
    const format = /^\d{13}$/.test(v) ? 'EAN13' : /^\d{8}$/.test(v) ? 'EAN8' : 'CODE128';
    try{ JsBarcode(svg, v, { format, displayValue:true, fontSize:14, margin:6, background:'#ffffff', lineColor:'#1A2233' }); }
    catch(e){ try{ JsBarcode(svg, v, { format:'CODE128', displayValue:true, fontSize:14, margin:6, background:'#ffffff', lineColor:'#1A2233' }); }catch(e2){ console.error(e2); } }
  });
  sheet.classList.add('printing');
  document.body.classList.add('printing-barcodes');
  const cleanup = ()=>{
    sheet.classList.remove('printing');
    document.body.classList.remove('printing-barcodes');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=> window.print(), 60);
}

/* ---------- SKLAD ↔ FAKTURY (automatický odečet/vrácení) ---------- */
function productStockDeltaMap(items){
  const m = new Map();
  (items||[]).forEach(it=>{
    if(!it.productId) return;
    m.set(it.productId, (m.get(it.productId)||0) + (parseFloat(it.qty)||0));
  });
  return m;
}
async function applyStockForInvoiceChange(oldItems, newItems, reasonLabel){
  const oldMap = productStockDeltaMap(oldItems);
  const newMap = productStockDeltaMap(newItems);
  const allIds = new Set([...oldMap.keys(), ...newMap.keys()]);
  if(!allIds.size) return;
  const negatives = [];
  allIds.forEach(pid=>{
    const product = productById(pid);
    if(!product) return;
    const delta = (newMap.get(pid)||0) - (oldMap.get(pid)||0);
    if(delta===0) return;
    const resulting = (product.stockCurrent||0) - delta;
    if(resulting<0) negatives.push(product.name);
  });
  if(negatives.length && !confirm(`Sklad u produktů (${negatives.join(', ')}) klesne do záporných hodnot. Pokračovat a uložit fakturu?`)) {
    throw new Error('cancelled');
  }
  let changed = false;
  allIds.forEach(pid=>{
    const product = productById(pid);
    if(!product) return;
    const delta = (newMap.get(pid)||0) - (oldMap.get(pid)||0);
    if(delta===0) return;
    product.stockCurrent = (product.stockCurrent||0) - delta;
    product.movements = product.movements || [];
    product.movements.push({ id: uid(), type: delta>0?'prodej':'vrácení', qty: -delta, reason: reasonLabel, note:'', date: new Date().toISOString(), user: state.currentUser, resultingStock: product.stockCurrent, unitCost: product.purchasePrice||0, expiryAtTime: product.expiryDate||'', vatAtTime: product.vatRatePurchase??21 });
    changed = true;
  });
  if(changed) await saveProducts();
}

  // Přijatá faktura = zboží k nám přichází, takže sklad se (na rozdíl od vystavené faktury) navyšuje.
  const oldMap = productStockDeltaMap(oldItems);

function guessProductFieldForHeader(header){
  const h = stripDiacritics(String(header||'')).toLowerCase().trim();
  const rules = [
    [/ean|čárov|carov|barcode/, 'ean'],
    [/^sku$|\bsku\b/, 'number'],
    [/produktov.{0,3}č[íi]slo|product\s*number/, 'internalCode'],
    [/kategori/, 'category'],
    [/v[ýy]robce|manufacturer|brand/, 'manufacturer'],
    [/dodavatel|supplier/, 'supplierName'],
    [/jednotk|^unit$/, 'unit'],
    [/dph|vat/, 'vatRate'],
    [/n[áa]kupn[íi]/, 'purchasePrice'],
    [/prodejn[íi]|sale\s*price/, 'salePrice'],
    [/minim[áa]ln[íi]/, 'stockMin'],
    [/um[íi]st[ěe]n|regál|regal|police|pozice|location|shelf/, 'location'],
    [/sklad|stock|mnoz?stv[íi]|quantity/, 'stockCurrent'],
    [/expirac|expir|trvanliv/, 'expiryDate'],
    [/pozn[áa]mka|note/, 'note'],
    [/n[áa]zev|^name$|produkt/, 'name'],
  ];
  for(const [re,f] of rules){ if(re.test(h)) return f; }
  return '';
}
async function handleProductBulkFile(file){
  if(!file) return;
  state.bulkImport.error = '';
  state.bulkImport.fileName = file.name;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    if(!rows.length){ state.bulkImport.error = 'Soubor neobsahuje žádná data.'; render(); return; }
    const headers = Object.keys(rows[0]);
    const mapping = {};
    headers.forEach(h=>{ mapping[h] = guessProductFieldForHeader(h); });
    state.bulkImport.headers = headers; state.bulkImport.rows = rows; state.bulkImport.mapping = mapping;
    state.bulkImport.step = 'mapping';
  }catch(err){ state.bulkImport.error = 'Soubor se nepodařilo přečíst. Zkus .xlsx nebo .csv.'; }
  render();
}
function computeProductBulkPreview(){
  const bi = state.bulkImport;
  const fieldToHeader = {};
  Object.entries(bi.mapping).forEach(([h,f])=>{ if(f) fieldToHeader[f]=h; });
  const get = (row,f) => fieldToHeader[f] ? row[fieldToHeader[f]] : undefined;
  const items = []; let skipped = 0; let dupCount = 0;
  const seenEans = new Set(state.products.map(p=>p.ean).filter(Boolean));
  const seenNumbers = new Set(state.products.map(p=>p.number).filter(Boolean));
  bi.rows.forEach(row=>{
    const name = (get(row,'name')||'').toString().trim();
    const ean = (get(row,'ean')||'').toString().trim();
    if(!name && !ean){ skipped++; return; }
    let isDup = false;
    if(ean && seenEans.has(ean)) isDup = true;
    const number = (get(row,'number')||'').toString().trim();
    if(number && seenNumbers.has(number)) isDup = true;
    const internalCode = (get(row,'internalCode')||'').toString().trim();
    if(isDup) dupCount++;
    items.push({
      name: name || '(bez názvu)', ean, number, internalCode,
      category: (get(row,'category')||'').toString().trim(), manufacturer: (get(row,'manufacturer')||'').toString().trim(),
      supplierName: (get(row,'supplierName')||'').toString().trim(), unit: (get(row,'unit')||'ks').toString().trim()||'ks',
      vatRate: bulkParseNumber(get(row,'vatRate'))||0, purchasePrice: bulkParseNumber(get(row,'purchasePrice'))||0,
      salePrice: bulkParseNumber(get(row,'salePrice'))||0, stockCurrent: bulkParseNumber(get(row,'stockCurrent'))||0,
      stockMin: bulkParseNumber(get(row,'stockMin'))||0, location: (get(row,'location')||'').toString().trim(), expiryDate: bulkParseDate(get(row,'expiryDate')),
      note: (get(row,'note')||'').toString().trim(), isDup
    });
    if(ean) seenEans.add(ean);
    if(number) seenNumbers.add(number);
  });
  bi.preview = { items, skipped, dupCount };
}
async function confirmProductBulkImport(){
  const bi = state.bulkImport;
  if(!bi || !bi.preview) return;
  for(const it of bi.preview.items){
    if(it.isDup) continue; // duplicity přeskočíme, ať nevzniknou konflikty
    let supplierId = '';
    if(it.supplierName){
      let sup = state.suppliers.find(s=>stripDiacritics(s.name).toLowerCase()===stripDiacritics(it.supplierName).toLowerCase());
      if(!sup){ sup = { ...blankSupplier(), name: it.supplierName }; state.suppliers.push(sup); }
      supplierId = sup.id;
    }
    const number = it.number || generateUniqueProductNumber();
    state.products.push({
      ...blankProduct(), id: uid(), number, ean: it.ean, internalCode: it.internalCode||'',
      name: it.name, category: it.category, manufacturer: it.manufacturer, supplierId,
      unit: it.unit, vatRate: it.vatRate, purchasePrice: it.purchasePrice, salePrice: it.salePrice,
      stockCurrent: it.stockCurrent, stockMin: it.stockMin, location: it.location ? { warehouse: it.location, rack:'', shelf:'', spot:'' } : blankLocation(), expiryDate: it.expiryDate, note: it.note,
      movements: it.stockCurrent ? [{id:uid(), type:'počáteční stav', qty:it.stockCurrent, reason:'Import', note:'', date:new Date().toISOString(), user:state.currentUser, resultingStock:it.stockCurrent, unitCost:it.purchasePrice||0}] : []
    });
  }
  await saveSuppliers();
  await saveProducts();
  await saveProductSettings();
  state.bulkImport = null;
  state.view = 'products';
  render();
}
function exportProductsCsv(format){

function productsKeyHandler(e){
  if(state.view!=='products') return;
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(e.key==='n' || e.key==='N'){ state.view='product-form'; state.editingProductId=null; state.newProductDraftId=null; render(); }
  else if(e.key==='Delete' || e.key==='Backspace'){
    if(state.selectedProductIds.size){
      e.preventDefault();
      if(confirm(`Smazat ${state.selectedProductIds.size} vybraných produktů?`)){
        state.products = state.products.filter(p=>!state.selectedProductIds.has(p.id));
        saveProducts();
        state.selectedProductIds.clear();
        render();
      }
    }
  } else if(e.key==='Escape'){ state.selectedProductIds.clear(); closeProductContextMenu(); render(); }
}

      state.reportPeriod = { preset:'custom', from, to };
      render();
    });
  });
  // drag & drop přeuspořádání widgetů na Přehledu
  const widgetGrid = document.getElementById('dashboard-widget-grid');
  if(widgetGrid){
    let dragSrcIndex = null;
    widgetGrid.querySelectorAll('.widget-card[draggable="true"]').forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        dragSrcIndex = parseInt(card.getAttribute('data-widget-index'),10);
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        widgetGrid.querySelectorAll('.widget-card').forEach(c=>c.classList.remove('drag-over'));
      });
      card.addEventListener('dragover', (e)=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', ()=>{ card.classList.remove('drag-over'); });
      card.addEventListener('drop', (e)=>{
        e.preventDefault();
        card.classList.remove('drag-over');
        const targetIndex = parseInt(card.getAttribute('data-widget-index'),10);
        if(dragSrcIndex===null || targetIndex===dragSrcIndex) return;
        const widgets = activeDashboardWidgets();
        const moved = widgets.splice(dragSrcIndex,1)[0];
        widgets.splice(targetIndex,0,moved);
        state.dashboardWidgets = widgets;
        saveDashboardWidgets().catch(()=>{});
        render();
      });
    });
  }
  ['pstats-from','pstats-to'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', ()=>{
      const from = document.getElementById('pstats-from').value;
      const to = document.getElementById('pstats-to').value;
      state.productStatsFilter = { preset:'custom', from, to };
      render();
    });
  });

  // invoice list filter controls
  ['inv-from','inv-to','inv-client','inv-status','inv-doctype'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', ()=>{
      const from = document.getElementById('inv-from').value;
      const to = document.getElementById('inv-to').value;
      const clientId = document.getElementById('inv-client').value;
      const status = document.getElementById('inv-status').value;
      const docType = document.getElementById('inv-doctype').value;
      state.invoiceFilter = { ...state.invoiceFilter, from, to, clientId, status, docType };
      render();
    });
  });
  const invSortSelect = document.getElementById('inv-sort');
  if(invSortSelect){ invSortSelect.addEventListener('change', ()=>{ state.invoiceSort = invSortSelect.value; render(); }); }
  const invSearchInput = document.getElementById('inv-search');
  if(invSearchInput){
    invSearchInput.addEventListener('input', (e)=>{
      state.invoiceFilter.search = e.target.value;
      filterInvoiceRows(e.target.value);
    });
    if(state.invoiceFilter.search) filterInvoiceRows(state.invoiceFilter.search);
  }
  const restoreFileInput = document.getElementById('restore-file-input');
  if(restoreFileInput){
    restoreFileInput.addEventListener('change', ()=>{ if(restoreFileInput.files[0]) restoreFromUploadedFile(restoreFileInput.files[0]); });
  }
  const bulkFileInput = document.getElementById('bulk-file-input');
  if(bulkFileInput){
    bulkFileInput.addEventListener('change', ()=>{
      if(!bulkFileInput.files[0]) return;
      if(state.bulkImport && state.bulkImport.mode==='products') handleProductBulkFile(bulkFileInput.files[0]);
      else handleBulkFile(bulkFileInput.files[0]);
    });
  }
  document.querySelectorAll('select[data-action="bulk-map"]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ state.bulkImport.mapping[sel.getAttribute('data-header')] = sel.value; });
  });
  const brandingFileInput = document.getElementById('branding-file-input');
  if(brandingFileInput){
    brandingFileInput.addEventListener('change', ()=>{
      const field = brandingFileInput.getAttribute('data-target-field');
      const companyId = brandingFileInput.getAttribute('data-target-company');
      if(field && brandingFileInput.files[0]) handleBrandingUpload(field, brandingFileInput.files[0], companyId);
    });
  }

  // item input sync
  const itemsBody = document.getElementById('items-body');
  if(itemsBody){
    itemsBody.addEventListener('input', (e)=>{
      const f = e.target.getAttribute('data-field');
      const idx = e.target.getAttribute('data-index');
      if(f==null||idx==null) return;
      let val = e.target.value;
      if(f==='qty'||f==='price'||f==='vat') val = parseFloat(val)||0;
      state.formItems[idx][f]=val;
      // live update row total + totals box without full rerender (keeps focus)
      const totalsBox = document.getElementById('totals-box');
      const itemsTableEl = document.querySelector('.items-table');
      const vatPayerNow = !(itemsTableEl && itemsTableEl.classList.contains('no-vat'));
      if(totalsBox) totalsBox.innerHTML = renderTotalsBox(vatPayerNow);
      const row = e.target.closest('tr');
      if(row){
        const it = state.formItems[idx];
        const lineTotal = (it.qty||0)*(it.price||0)*(1+(it.vat||0)/100);
        const cell = row.querySelector('.num');
        if(cell) cell.textContent = fmt(lineTotal)+' Kč';
      }
    });
  }
}

/* ---------- CLIENT COMBO BOX (searchable client picker in invoice form) ---------- */
/* ---------- ARES (vyhledávání firem podle IČO / názvu) ----------
   Veřejné, bezplatné API Ministerstva financí ČR, bez nutnosti klíče.
   https://ares.gov.cz/swagger-ui/ */
const ARES_BASE = 'https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty';

function blankAddr(){ return {street:'',number:'',zip:'',city:''}; }
function addrGet(addr, key){
  if(!addr) return '';
  if(typeof addr === 'string') return key==='street' ? addr : '';
  return addr[key] || '';
}
function formatAddress(addr){
  if(!addr) return '';
  if(typeof addr === 'string') return addr;
  const line1 = [addr.street, addr.number].filter(Boolean).join(' ');
  const line2 = [addr.zip, addr.city].filter(Boolean).join(' ');
  return [line1, line2].filter(Boolean).join('\n');
}
function aresAddressToParts(sidlo){
  if(!sidlo) return blankAddr();
  const street = sidlo.nazevUlice || sidlo.nazevCastiObce || '';
  const number = [sidlo.cisloDomovni, sidlo.cisloOrientacni].filter(Boolean).join('/');
  return { street, number, zip: sidlo.psc?String(sidlo.psc):'', city: sidlo.nazevObce || '' };
}
function addressFieldGroup(prefix, label, addr){
  return `
    <div class="field">
      <label>${label}</label>
      <div class="field-row" style="grid-template-columns:2fr 1fr;margin-bottom:6px;">
        <div class="field combo-field">
          <input name="${prefix}-street" id="${prefix}-street" placeholder="Ulice" autocomplete="off" value="${escapeAttr(addrGet(addr,'street'))}">
          <div class="combo-list" id="${prefix}-street-list"></div>
        </div>
        <div class="field"><input name="${prefix}-number" id="${prefix}-number" placeholder="Číslo" value="${escapeAttr(addrGet(addr,'number'))}"></div>
      </div>
      <div class="field-row" style="grid-template-columns:1fr 2fr;">
        <div class="field"><input name="${prefix}-zip" id="${prefix}-zip" placeholder="PSČ" value="${escapeAttr(addrGet(addr,'zip'))}"></div>
        <div class="field combo-field"><input name="${prefix}-city" id="${prefix}-city" placeholder="Město" autocomplete="off" value="${escapeAttr(addrGet(addr,'city'))}">
          <div class="combo-list" id="${prefix}-city-list"></div>
        </div>
      </div>
      <p style="font-size:11px;color:var(--ink-soft);margin:4px 0 0 0;">Začni psát ulici nebo město — ledgers nabídne shody a doplní zbytek adresy.</p>
    </div>
  `;
}
function gatherAddrField(fd, prefix){
  return {
    street: fd.get(prefix+'-street')||'', number: fd.get(prefix+'-number')||'',
    zip: fd.get(prefix+'-zip')||'', city: fd.get(prefix+'-city')||''
  };
}
function addrFromInputs(prefix){
  const val = id => { const el = document.getElementById(id); return el ? el.value||'' : ''; };
  return {
    street: val(prefix+'-street'), number: val(prefix+'-number'),
    zip: val(prefix+'-zip'), city: val(prefix+'-city')
  };
}

function aresAddressToText(sidlo){
  if(!sidlo) return '';
  if(sidlo.textovaAdresa) return sidlo.textovaAdresa;
  const parts = [];
  if(sidlo.nazevUlice) parts.push(sidlo.nazevUlice + (sidlo.cisloDomovni?' '+sidlo.cisloDomovni:'') + (sidlo.cisloOrientacni?'/'+sidlo.cisloOrientacni:''));
  if(sidlo.psc && sidlo.nazevObce) parts.push(`${sidlo.psc} ${sidlo.nazevObce}`);
  return parts.join(', ');
}

async function aresLookupByIco(ico){
  const res = await fetch(`${ARES_BASE}/${encodeURIComponent(ico)}`);
  if(!res.ok) throw new Error('Subjekt s tímto IČO nebyl v ARES nalezen.');
  return await res.json();
}

async function aresSearchByName(name){
  const res = await fetch(`${ARES_BASE}/vyhledat`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ obchodniJmeno: name, pocet: 10, start: 0 })
  });
  if(!res.ok) throw new Error('Vyhledávání v ARES selhalo.');
  const data = await res.json();
  return data.ekonomickeSubjekty || [];
}

function applyAresEntityToForm(entity, ids){
  ids = ids || { name:'client-name', ico:'client-ico', dic:'client-dic', addrPrefix:'client-address' };
  const nameEl = document.getElementById(ids.name);
  const icoEl = document.getElementById(ids.ico);
  const dicEl = document.getElementById(ids.dic);
  if(nameEl) nameEl.value = entity.obchodniJmeno || nameEl.value;
  if(icoEl) icoEl.value = entity.ico || icoEl.value;
  if(dicEl && entity.dic) dicEl.value = entity.dic;
  const parts = aresAddressToParts(entity.sidlo);
  const streetEl = document.getElementById(ids.addrPrefix+'-street');
  const numberEl = document.getElementById(ids.addrPrefix+'-number');
  const zipEl = document.getElementById(ids.addrPrefix+'-zip');
  const cityEl = document.getElementById(ids.addrPrefix+'-city');
  if(streetEl && parts.street) streetEl.value = parts.street;
  if(numberEl && parts.number) numberEl.value = parts.number;
  if(zipEl && parts.zip) zipEl.value = parts.zip;
  if(cityEl && parts.city) cityEl.value = parts.city;
}

function setupAresCombo(ids){
  ids = ids || { name:'client-name', list:'client-name-list', status:'ares-status', ico:'client-ico', dic:'client-dic', addrPrefix:'client-address' };
  const input = document.getElementById(ids.name);
  const list = document.getElementById(ids.list);
  const status = document.getElementById(ids.status);
  if(!input || !list) return;
  let debounceTimer = null;

  function setStatus(msg, isError){
    if(!status) return;
    status.textContent = msg || '';
    status.style.color = isError ? 'var(--red)' : 'var(--ink-soft)';
  }

  async function runSearch(q){
    const trimmed = q.trim();
    if(trimmed.length < 3){ list.classList.remove('open'); return; }
    const isIco = /^\d{6,8}$/.test(trimmed);
    list.innerHTML = `<div class="combo-empty">Hledám v ARES…</div>`;
    list.classList.add('open');
    try{
      if(isIco){
        const entity = await aresLookupByIco(trimmed);
        list.innerHTML = `
          <div class="combo-item" data-ico="${escapeAttr(entity.ico)}">
            <div>${escapeHtml(entity.obchodniJmeno||'')}</div>
            <div class="sub">IČO: ${escapeHtml(entity.ico)} · ${escapeHtml(aresAddressToText(entity.sidlo))}</div>
          </div>`;
        list.dataset.cache = JSON.stringify([entity]);
      } else {
        const results = await aresSearchByName(trimmed);
        if(!results.length){
          list.innerHTML = `<div class="combo-empty">V ARES nic neodpovídá. Zkus zadat přesnější název nebo IČO.</div>`;
          list.dataset.cache = '[]';
        } else {
          list.innerHTML = results.map((r,i)=>`
            <div class="combo-item" data-idx="${i}">
              <div>${escapeHtml(r.obchodniJmeno||'')}</div>
              <div class="sub">IČO: ${escapeHtml(r.ico||'')} · ${escapeHtml(aresAddressToText(r.sidlo))}</div>
            </div>`).join('');
          list.dataset.cache = JSON.stringify(results);
        }
      }
    }catch(err){
      list.innerHTML = `<div class="combo-empty">Vyhledávání se nepovedlo. Zkus to prosím znovu.</div>`;
      list.dataset.cache = '[]';
    }
  }

  input.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    setStatus('');
    debounceTimer = setTimeout(()=> runSearch(input.value), 450);
  });
  input.addEventListener('focus', ()=>{ if(input.value.trim().length>=3) runSearch(input.value); });

  list.addEventListener('mousedown', async (e)=>{
    const item = e.target.closest('.combo-item[data-ico], .combo-item[data-idx]');
    if(!item) return;
    e.preventDefault();
    let cache = [];
    try{ cache = JSON.parse(list.dataset.cache||'[]'); }catch(err){}
    const entity = item.hasAttribute('data-idx') ? cache[parseInt(item.getAttribute('data-idx'))] : cache[0];
    if(entity){
      applyAresEntityToForm(entity, ids);
      input.value = entity.obchodniJmeno || '';
      setStatus('Údaje doplněny z ARES — zkontroluj je a případně uprav.');
    }
    list.classList.remove('open');
  });

  document.addEventListener('click', (e)=>{
    if(e.target!==input && !list.contains(e.target)) list.classList.remove('open');
  });
}

/* ---------- Živé našeptávání adresy + PSČ (OpenStreetMap / Nominatim, zdarma bez klíče) ---------- */
function formatOsmAddress(item){
  const a = item.address || {};
  const street = a.road || a.pedestrian || a.footway || '';
  const houseNum = a.house_number || '';
  const streetLine = [street, houseNum].filter(Boolean).join(' ');
  const city = a.city || a.town || a.village || a.municipality || a.suburb || '';
  const psc = a.postcode || '';
  const cityLine = [psc, city].filter(Boolean).join(' ');
  return [streetLine, cityLine].filter(Boolean).join(', ') || item.display_name;
}

async function osmSearchAddresses(q){
  const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=cz&limit=5&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { 'Accept':'application/json' } });
  if(!res.ok) throw new Error('Vyhledávání adresy selhalo.');
  return await res.json();
}

async function osmSearchCities(q){
  const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=cz&limit=6&city=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { 'Accept':'application/json' } });
  if(!res.ok) throw new Error('Vyhledávání města selhalo.');
  return await res.json();
}
function cityLabel(item){
  const a = item.address || {};
  return a.city || a.town || a.village || a.municipality || (item.display_name||'').split(',')[0] || '';
}

function setupAddressGroupAutocomplete(prefix){
  const streetInput = document.getElementById(prefix+'-street');
  const list = document.getElementById(prefix+'-street-list');
  const numberInput = document.getElementById(prefix+'-number');
  const zipInput = document.getElementById(prefix+'-zip');
  const cityInput = document.getElementById(prefix+'-city');
  if(!streetInput || !list) return;
  let debounceTimer = null;
  let cache = [];

  function renderList(items){
    cache = items;
    if(!items.length){
      list.classList.remove('open');
      list.innerHTML = '';
      return;
    }
    list.innerHTML = items.map((item,i)=>`
      <div class="combo-item" data-idx="${i}">${escapeHtml(formatOsmAddress(item))}</div>
    `).join('');
    list.classList.add('open');
  }

  streetInput.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    const q = streetInput.value.trim();
    if(q.length < 3){ list.classList.remove('open'); return; }
    const queryStr = cityInput && cityInput.value ? `${q}, ${cityInput.value}` : q;
    debounceTimer = setTimeout(async ()=>{
      try{ renderList(await osmSearchAddresses(queryStr)); }
      catch(err){ list.classList.remove('open'); }
    }, 450);
  });

  list.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.combo-item');
    if(!item) return;
    e.preventDefault();
    const picked = cache[parseInt(item.getAttribute('data-idx'))];
    if(picked){
      const a = picked.address || {};
      streetInput.value = a.road || a.pedestrian || a.footway || streetInput.value;
      if(numberInput) numberInput.value = a.house_number || numberInput.value;
      if(zipInput) zipInput.value = a.postcode || zipInput.value;
      if(cityInput) cityInput.value = a.city||a.town||a.village||a.municipality||a.suburb || cityInput.value;
    }
    list.classList.remove('open');
  });

  document.addEventListener('click', (e)=>{
    if(e.target!==streetInput && !list.contains(e.target)) list.classList.remove('open');
  });

  if(zipInput){
    let zipDebounce = null;
    zipInput.addEventListener('input', ()=>{
      clearTimeout(zipDebounce);
      const digits = zipInput.value.replace(/\s+/g,'');
      if(!/^\d{5}$/.test(digits)) return;
      zipDebounce = setTimeout(async ()=>{
        try{
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&country=cz&postalcode=${digits}&limit=1`, { headers:{'Accept':'application/json'} });
          const rows = await res.json();
          if(rows && rows[0]){
            const a = rows[0].address || {};
            const foundCity = a.city || a.town || a.village || a.municipality || (rows[0].display_name||'').split(',')[0] || '';
            if(cityInput && foundCity && !cityInput.value.trim()) cityInput.value = foundCity;
          }
        }catch(err){}
      }, 500);
    });
  }

  const cityList = document.getElementById(prefix+'-city-list');
  if(cityInput && cityList){
    let cityDebounce = null, cityCache = [];

    function renderCityList(items){
      cityCache = items;
      if(!items.length){ cityList.classList.remove('open'); cityList.innerHTML=''; return; }
      cityList.innerHTML = items.map((item,i)=>{
        const name = cityLabel(item);
        const psc = (item.address||{}).postcode || '';
        return `<div class="combo-item" data-idx="${i}">${escapeHtml(name)}${psc?` <span class="sub">PSČ ${escapeHtml(psc)}</span>`:''}</div>`;
      }).join('');
      cityList.classList.add('open');
    }

    cityInput.addEventListener('input', ()=>{
      clearTimeout(cityDebounce);
      const q = cityInput.value.trim();
      if(q.length < 2){ cityList.classList.remove('open'); return; }
      cityDebounce = setTimeout(async ()=>{
        try{ renderCityList(await osmSearchCities(q)); }
        catch(err){ cityList.classList.remove('open'); }
      }, 350);
    });

    cityList.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.combo-item');
      if(!item) return;
      e.preventDefault();
      const picked = cityCache[parseInt(item.getAttribute('data-idx'))];
      if(picked){
        const a = picked.address || {};
        cityInput.value = cityLabel(picked) || cityInput.value;
        if(zipInput && a.postcode) zipInput.value = a.postcode;
      }
      cityList.classList.remove('open');
    });

    document.addEventListener('click', (e)=>{
      if(e.target!==cityInput && !cityList.contains(e.target)) cityList.classList.remove('open');
    });
  }
}

/* ---------- PŘÍLOHY ODBĚRATELŮ (Supabase Storage, bucket "client-files") ----------
   Vyžaduje jednorázové nastavení bucketu + RLS, viz supabase-setup-attachments.sql */
const ATTACHMENTS_BUCKET = 'client-files';

async function uploadClientFile(clientId, file){
  await ensureFreshSession();
  const safeName = file.name.replace(/[^\w.\-]+/g,'_');
  const path = `${state.tenantId}/${clientId}/${Date.now()}_${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENTS_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`Nahrání se nepovedlo: ${text}`);
  }
  return { name: file.name, path, uploaded_at: new Date().toISOString(), size: file.size };
}

async function deleteClientFile(path){
  await ensureFreshSession();
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENTS_BUCKET}`, {
    method: 'DELETE',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ prefixes: [path] })
  });
  if(!res.ok) throw new Error('Mazání souboru selhalo.');
}

async function signAttachmentUrl(path){
  await ensureFreshSession();
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${ATTACHMENTS_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ expiresIn: 120 })
  });
  if(!res.ok) throw new Error('Nepovedlo se vytvořit odkaz na soubor.');
  const data = await res.json();
  return SUPABASE_URL + '/storage/v1' + data.signedURL;
}

async function deleteReceivedInvoiceFile(path){

async function signReceivedInvoiceUrl(path){

  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${RECEIVED_INVOICES_BUCKET}/${path}`, {
    method: 'POST',

    body: JSON.stringify({ expiresIn: 120 })
  });
  if(!res.ok) throw new Error('Nepovedlo se otevřít přílohu.');
  const data = await res.json();
  return SUPABASE_URL + '/storage/v1' + data.signedURL;
}
async function onSubmitReceivedInvoice(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const supplierId = fd.get('supplierId') || null;
  const supplierName = (fd.get('supplierName')||'').trim();
  const companyId = fd.get('companyId') || (state.companies[0]||{}).id || null;
  const number = (fd.get('number')||'').trim();
  const orderNumber = (fd.get('orderNumber')||'').trim();
  const issueDate = fd.get('issueDate')||'';
  const dueDate = fd.get('dueDate')||'';
  const taxDate = fd.get('taxDate')||'';
  const variableSymbol = (fd.get('variableSymbol')||'').trim();
  const constantSymbol = (fd.get('constantSymbol')||'').trim();
  const paymentMethod = fd.get('paymentMethod') || 'Bankovním převodem';
  const currency = fd.get('currency') || 'CZK';
  const amount = parseFloat(fd.get('amount'))||0;
  const note = (fd.get('note')||'').trim();
  const paid = fd.get('paid') === 'on';
  const existing = state.editingReceivedInvoiceId ? state.receivedInvoices.find(i=>i.id===state.editingReceivedInvoiceId) : null;
  const attachment = existing ? existing.attachment : null;
  const items = state.receivedFormItems.filter(it=> (it.desc||'').trim()!=='' || (it.qty||0)!==0 );

  // Promítnutí ručně upravených údajů zpět do karty dodavatele (stejně jako u odběratele na vystavené faktuře)
  if(supplierId){
    const supplierIdx = state.suppliers.findIndex(s=>s.id===supplierId);
    if(supplierIdx > -1){
      state.suppliers[supplierIdx] = {
        ...state.suppliers[supplierIdx],
        ico: fd.get('supplierIco') ?? state.suppliers[supplierIdx].ico,
        dic: fd.get('supplierDic') ?? state.suppliers[supplierIdx].dic,
        contactEmail: fd.get('supplierEmail') ?? state.suppliers[supplierIdx].contactEmail,
        contactPhone: fd.get('supplierPhone') ?? state.suppliers[supplierIdx].contactPhone
      };
      await saveSuppliers();
    }
  }

  const oldItemsForStock = existing ? (existing.items || []) : [];
  try{
    await applyStockForReceivedInvoiceChange(oldItemsForStock, items, 'Přijatá faktura '+(number||supplierName));
  }catch(err){
    if(err && err.message==='cancelled') return; // uživatel zrušil kvůli zápornému skladu
  }

  const fields = {
    supplierId, supplierName, companyId, number, orderNumber, issueDate, dueDate, taxDate,
    variableSymbol, constantSymbol, paymentMethod, currency, amount, note, items,
    status: paid?'paid':'unpaid', attachment
  };
  if(existing){
    const idx = state.receivedInvoices.findIndex(i=>i.id===existing.id);
    state.receivedInvoices[idx] = { ...existing, ...fields };
  } else {
    state.receivedInvoices.push({ id: uid(), ...fields, createdAt: new Date().toISOString() });
  }
  const btn = e.target.querySelector('button[type="submit"]');
  if(btn) btn.disabled = true;
  try{
    await saveReceivedInvoices();
    state.editingReceivedInvoiceId = null;
    state.receivedFormItems = [];
    state.view = 'received-invoices';
    render();
  }catch(err){
    alert('Uložení se nepovedlo, zkus to prosím znovu.');
    if(btn) btn.disabled = false;
  }
}

function setupAttachmentUpload(){
  const input = document.getElementById('attachment-file-input');
  const box = document.getElementById('attachments-box');
  const status = document.getElementById('attachment-status');
  if(!input || !box) return;
  const { type, entityId } = attachmentEntityContext();
  input.addEventListener('change', async ()=>{
    const file = input.files[0];
    input.value = '';
    if(!file) return;
    if(status) status.textContent = 'Nahrávám…';
    let meta = null;
    let pushedInto = null;
    try{
      meta = await uploadClientFile(entityId, file);
      const entity = type==='supplier' ? supplierById(entityId) : clientById(entityId);
      if(entity){
        entity.attachments = entity.attachments || [];
        entity.attachments.push(meta);
        pushedInto = entity.attachments;
        if(type==='supplier') await saveSuppliers(); else await saveClients();
      } else if(type==='client' && entityId === state.newClientDraftId){
        state.newClientDraftAttachments.push(meta);
        pushedInto = state.newClientDraftAttachments;
      } else if(type==='supplier' && entityId === state.newSupplierDraftId){
        state.newSupplierDraftAttachments.push(meta);
        pushedInto = state.newSupplierDraftAttachments;
      }
      if(status) status.textContent = 'Soubor uložen.';
      render();
    }catch(err){
      console.error(err);
      // Uložení selhalo — vrátíme stav zpět, ať program netváří, že se soubor přidal, když se ve skutečnosti neuložil.
      if(pushedInto && meta){
        const idx = pushedInto.indexOf(meta);
        if(idx>-1) pushedInto.splice(idx,1);
      }
      if(status) status.textContent = (err && err.message) || 'Nahrání se nepovedlo, zkus to prosím znovu.';
    }
  });
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');

  if(action==='auth-switch'){ state.authView = el.getAttribute('data-view'); state.authError=''; state.authNotice=''; render(); }
  else if(action==='choose-plan'){
    state.selectedPlan = el.getAttribute('data-plan');
    state.authView = 'billing-details';
    state.billingError = '';
    render();
  }
  else if(action==='refresh-subscription'){
    el.disabled = true; el.textContent = 'Kontroluji…';
    await loadSubscriptionStatus();
    if(state.subscription && state.subscription.status === 'active'){
      await loadAll();
      state.view = firstAccessibleView();
      startEshopPolling();
    }
    render();
  }
  else if(action==='logout'){
    await signOutRemote();
    persistSession(null);
    state.currentUser=null; state.currentUserId=null; state.users=[];
    state.companies=[]; state.clients=[]; state.invoices=[];
    state.authView='login'; state.view='dashboard';
    render();
  }

  else if(action==='new-invoice'){ state.view='invoice-form'; state.editingInvoiceId=null; state.formItems=[]; state.formCompanyId=null; state.newInvoiceDocType='invoice'; state.newInvoiceRelatedId=null; render(); }
  else if(action==='new-credit-note'){ state.view='invoice-form'; state.editingInvoiceId=null; state.formItems=[]; state.formCompanyId=null; state.newInvoiceDocType='credit_note'; state.newInvoiceRelatedId=null; render(); }
  else if(action==='new-proforma'){ state.view='invoice-form'; state.editingInvoiceId=null; state.formItems=[]; state.formCompanyId=null; state.newInvoiceDocType='proforma'; state.newInvoiceRelatedId=null; render(); }
  else if(action==='new-credit-note-for-invoice'){
    const src = state.invoices.find(i=>i.id===id);
    if(src){
      state.view='invoice-form'; state.editingInvoiceId=null;
      state.formItems = JSON.parse(JSON.stringify(src.items||[]));
      state.formCompanyId = src.companyId;
      state.newInvoiceDocType='credit_note';
      state.newInvoiceRelatedId=src.id;
      state.newInvoiceClientId=src.clientId;
    }
    render();
  }
  else if(action==='toggle-invoice-select'){
    const cid = el.getAttribute('data-id');
    if(state.selectedInvoiceIds.has(cid)) state.selectedInvoiceIds.delete(cid); else state.selectedInvoiceIds.add(cid);
    render();
  }
  else if(action==='toggle-select-all-invoices'){
    const checked = el.checked;
    document.querySelectorAll('#invoices-tbody input[data-action="toggle-invoice-select"]').forEach(cb=>{
      const cid = cb.getAttribute('data-id');
      if(checked) state.selectedInvoiceIds.add(cid); else state.selectedInvoiceIds.delete(cid);
    });
    render();
  }
  else if(action==='bulk-print-invoices'){ printSelectedInvoices([...state.selectedInvoiceIds]); }
  else if(action==='bulk-save-invoices'){ await downloadSelectedInvoicesPdf([...state.selectedInvoiceIds]); }
  else if(action==='bulk-mark-paid' || action==='bulk-mark-unpaid'){
    const paid = action==='bulk-mark-paid';
    state.invoices.forEach(inv=>{
      if(state.selectedInvoiceIds.has(inv.id)){ inv.paid = paid; inv.paidDate = paid ? (inv.paidDate||todayISO()) : null; }
    });
    try{ await saveInvoices(); }catch(err){ alert('Uložení se nepovedlo, zkus to prosím znovu.'); }
    state.selectedInvoiceIds.clear();
    render();
  }
  else if(action==='bulk-delete-invoices'){
    const n = state.selectedInvoiceIds.size;

  else if(action==='submit-stock-movement'){

    const editId = document.getElementById('sm-edit-id').value;
    const type = document.getElementById('sm-type').value;
    const qty = normalizeMovementQty(type, parseFloat(document.getElementById('sm-qty').value));
    const note = document.getElementById('sm-note').value.trim();
    const newExpiry = document.getElementById('sm-expiry').value;
    const newPriceRaw = document.getElementById('sm-price').value;
    const newVatRaw = document.getElementById('sm-vat').value;
    const newSalePriceRaw = (document.getElementById('sm-sale-price')||{}).value ?? '';
    const newSaleVatRaw = (document.getElementById('sm-sale-vat')||{}).value ?? '';
    const newCostsRaw = (document.getElementById('sm-costs')||{}).value ?? '';
    const newSupplierId = (document.getElementById('sm-supplier')||{}).value || '';

    if(isNaN(qty) || qty===0){ alert('Zadej platné nenulové množství.'); return; }
    const changedParts = [];
    if(newExpiry){ p.expiryDate = newExpiry; changedParts.push('trvanlivost '+newExpiry); }
    if(newPriceRaw!==''){ p.purchasePrice = parseFloat(newPriceRaw)||0; changedParts.push('nákupní cena '+fmt(p.purchasePrice)+' Kč'); }
    if(newVatRaw!==''){ p.vatRatePurchase = parseFloat(newVatRaw)||0; changedParts.push('DPH nákup '+p.vatRatePurchase+'%'); }
    if(newSalePriceRaw!==''){ p.salePrice = parseFloat(newSalePriceRaw)||0; changedParts.push('prodejní cena '+fmt(p.salePrice)+' Kč'); }
    if(newSaleVatRaw!==''){ p.vatRate = parseFloat(newSaleVatRaw)||0; changedParts.push('DPH prodej '+p.vatRate+'%'); }
    if(newCostsRaw!==''){ p.costs = parseFloat(newCostsRaw)||0; changedParts.push('náklady '+fmt(p.costs)+' Kč'); }

    const newLocation = { rack: newRack, shelf: newShelf, spot: newSpot };
    if(newWarehouseId && newWarehouseId!==p.warehouseId){ p.warehouseId = newWarehouseId; changedParts.push('sklad '+((warehouseById(newWarehouseId)||{}).name||'')); }
    if(newRack || newShelf || newSpot){ p.location = newLocation; changedParts.push('umístění '+(formatLocation(newLocation)||'')); }
    const fullReason = [note, changedParts.length?('aktualizováno: '+changedParts.join(', ')):''].filter(Boolean).join(' — ') || type;
    const movementExpiry = newExpiry || p.expiryDate || '';
    const movementVat = newVatRaw!=='' ? (parseFloat(newVatRaw)||0) : (p.vatRatePurchase??21);
    const movementSalePrice = newSalePriceRaw!=='' ? (parseFloat(newSalePriceRaw)||0) : (p.salePrice||0);
    const movementSaleVat = newSaleVatRaw!=='' ? (parseFloat(newSaleVatRaw)||0) : (p.vatRate??21);
    const movementCosts = newCostsRaw!=='' ? (parseFloat(newCostsRaw)||0) : (p.costs||0);
    const movementSupplierId = newSupplierId || p.supplierId || '';
    const movementWarehouseId = newWarehouseId || p.warehouseId || '';
    const movementLocation = (newRack||newShelf||newSpot) ? newLocation : (p.location||blankLocation());
    p.movements = p.movements || [];
    if(editId){
      const m = p.movements.find(x=>x.id===editId);
      if(!m){ alert('Pohyb nebyl nalezen.'); return; }
      m.type = type; m.qty = qty; m.reason = fullReason; m.unitCost = p.purchasePrice||0;
      m.expiryAtTime = movementExpiry; m.vatAtTime = movementVat;
      m.salePrice = movementSalePrice; m.saleVat = movementSaleVat; m.costs = movementCosts;
      m.supplierId = movementSupplierId; m.warehouseId = movementWarehouseId; m.location = movementLocation;
      recomputeMovementsChain(p);
      if((p.stockCurrent||0) < 0 && !confirm(`Po úpravě klesne sklad do záporných hodnot (${p.stockCurrent}). Pokračovat a uložit?`)) return;
    } else {
      const resulting = (p.stockCurrent||0) + qty;
      if(resulting < 0 && !confirm(`Sklad produktu „${p.name}“ klesne do záporných hodnot (${resulting}). Pokračovat?`)) return;
      p.stockCurrent = resulting;
      p.movements.push({ id: uid(), type, qty, reason: fullReason, note:'', date: new Date().toISOString(), user: state.currentUser, resultingStock: resulting, unitCost: p.purchasePrice||0, expiryAtTime: movementExpiry, vatAtTime: movementVat, salePrice: movementSalePrice, saleVat: movementSaleVat, costs: movementCosts, supplierId: movementSupplierId, warehouseId: movementWarehouseId, location: movementLocation });
    }
    try{ await saveProducts(); }catch(err){ alert('Uložení se nepovedlo, zkus to prosím znovu.'); return; }
    if(state.view==='stock'){ state.stockMovementProductId = null; }
    render();

  else if(action==='print-one-barcode'){ closeProductContextMenu(); printProductBarcodes([id], 1, true); }

  else if(action==='save-product-code-only'){ await downloadProductCodeFiles(id); }
  else if(action==='print-product-info'){ printProductInfoSheet(id); }
  else if(action==='save-product-info'){ await downloadProductInfoFiles(id); }
  else if(action==='download-barcode-png'){ downloadBarcodePng(id); }
  else if(action==='download-barcode-pdf'){ await downloadBarcodePdf([id], 1, true); }
  else if(action==='toggle-product-select'){
    const pid = el.getAttribute('data-id');
    if(state.selectedProductIds.has(pid)) state.selectedProductIds.delete(pid); else state.selectedProductIds.add(pid);
    render();
  }
  else if(action==='toggle-select-all-products'){
    const checked = el.checked;
    document.querySelectorAll('#products-tbody input[data-action="toggle-product-select"]').forEach(cb=>{
      const pid = cb.getAttribute('data-id');
      if(checked) state.selectedProductIds.add(pid); else state.selectedProductIds.delete(pid);
    });
    render();
  }
  else if(action==='sort-products'){
    const key = el.getAttribute('data-key');
    if(state.productSort.key===key) state.productSort.dir = state.productSort.dir==='asc'?'desc':'asc';
    else state.productSort = { key, dir:'asc' };
    render();
  }
  else if(action==='products-show-more'){ state.productVisibleCount += 150; render(); }
  else if(action==='toggle-cols-panel'){ state.productColsPanelOpen = !state.productColsPanelOpen; render(); }
  else if(action==='toggle-col-visible'){
    const col = state.productColumns.find(c=>c.key===el.getAttribute('data-key'));
    if(col){ col.visible = el.checked; saveProductColumns(); }
  }
  else if(action==='move-col'){
    const key = el.getAttribute('data-key');
    const dir = parseInt(el.getAttribute('data-dir'),10);
    const idx = state.productColumns.findIndex(c=>c.key===key);
    const swapIdx = idx+dir;
    if(swapIdx>=0 && swapIdx<state.productColumns.length){
      [state.productColumns[idx], state.productColumns[swapIdx]] = [state.productColumns[swapIdx], state.productColumns[idx]];
      await saveProductColumns();
      render();
    }
  }
  else if(action==='bulk-clear-selection'){ state.selectedInvoiceIds.clear(); state.selectedClientIds.clear(); state.selectedProductIds.clear(); render(); }
  else if(action==='bulk-print-barcodes'){ printProductBarcodes([...state.selectedProductIds], 1, true); }
  else if(action==='bulk-print-product-code'){ printProductCodeOnly([...state.selectedProductIds]); }
  else if(action==='bulk-save-product-code'){ await downloadProductCodeFiles([...state.selectedProductIds]); }
  else if(action==='bulk-print-product-info'){ printProductInfoSheet([...state.selectedProductIds]); }
  else if(action==='bulk-save-product-info'){ await downloadProductInfoFiles([...state.selectedProductIds]); }
  else if(action==='bulk-edit-products-price'){
    const mode = prompt('Jak upravit prodejní cenu vybraných produktů?\nNapiš buď pevnou částku (např. 199), nebo procentuální změnu s % (např. +10% nebo -5%).');
    if(mode===null) return;
    const trimmed = mode.trim();
    const ids = [...state.selectedProductIds];
    if(/%$/.test(trimmed)){
      const pct = parseFloat(trimmed)/100;
      state.products.forEach(p=>{ if(ids.includes(p.id)) p.salePrice = Math.max(0, Math.round((p.salePrice||0)*(1+pct)*100)/100); });
      await saveProducts(); render();
    } else {
      const val = parseFloat(trimmed);
      if(!isNaN(val)) await bulkUpdateProducts(ids, { salePrice: val });
      render();
    }
  }
  else if(action==='bulk-edit-products-vat'){
    const val = prompt('Nová sazba DPH (%) pro vybrané produkty:', '21');
    if(val===null) return;
    const rate = parseFloat(val);
    if(!isNaN(rate)) await bulkUpdateProducts([...state.selectedProductIds], { vatRate: rate });
    render();
  }
  else if(action==='bulk-edit-products-supplier'){
    if(!state.suppliers.length){ alert('Nejdřív přidej alespoň jednoho dodavatele.'); return; }
    const names = state.suppliers.map((s,i)=>`${i+1}. ${s.name}`).join('\n');
    const val = prompt(`Zadej číslo dodavatele:\n${names}`);
    if(val===null) return;
    const idx = parseInt(val,10)-1;
    if(state.suppliers[idx]) await bulkUpdateProducts([...state.selectedProductIds], { supplierId: state.suppliers[idx].id });
    render();
  }
  else if(action==='bulk-edit-products-category'){
    const val = prompt('Nová kategorie pro vybrané produkty:');
    if(val===null) return;
    await bulkUpdateProducts([...state.selectedProductIds], { category: val.trim() });
    render();
  }
  else if(action==='bulk-archive-products'){
    const ids = [...state.selectedProductIds];
    const allArchived = ids.length && ids.every(pid=>{ const pr=productById(pid); return pr && pr.archived; });
    const newState = !allArchived;
    const msg = newState ? `Archivovat ${ids.length} vybraných produktů?` : `Odebrat archivaci u ${ids.length} vybraných produktů?`;
    if(confirm(msg)){
      await bulkUpdateProducts(ids, { archived:newState });
      state.selectedProductIds.clear();
      render();
    }
  }
  else if(action==='bulk-delete-products'){
    const n = state.selectedProductIds.size;
    if(confirm(`Opravdu smazat ${n} vybraných produktů?`)){
      state.products = state.products.filter(p=>!state.selectedProductIds.has(p.id));
      await saveProducts();
      state.selectedProductIds.clear();
      render();
    }
  }
  else if(action==='goto-bulk-import-products'){
    state.view='bulk-import';
    state.bulkImport = { mode:'products', step:'upload', error:'', fileName:'', headers:[], rows:[], mapping:{}, preview:null };
    render();
  }
  else if(action==='export-products'){ exportProductsCsv('xlsx'); }
});

async function downloadInvoicePdf(id, triggerEl){
  const inv = state.invoices.find(i=>i.id===id);
  const sheet = document.getElementById('invoice-sheet');
  if(!inv || !sheet || !window.html2pdf){ window.print(); return; }
  const originalLabel = triggerEl ? triggerEl.textContent : '';
  if(triggerEl){ triggerEl.textContent='Generuji…'; triggerEl.disabled = true; }
  sheet.classList.add('pdf-compact');
  try{
    await html2pdf().set({
      margin: [24, 16, 10, 16],
      filename: `Faktura-${(inv.number||'doklad').replace(/[^\w.-]+/g,'_')}.pdf`,
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:2, useCORS:true, allowTaint:true, backgroundColor:'#ffffff' },
      jsPDF: { unit:'pt', format:'a4', orientation:'portrait' },
      pagebreak: { mode:['css','legacy'] }
    }).from(sheet).save();
  } catch(err){
    console.error(err);
    alert('Stažení PDF se nepovedlo, zkus to prosím znovu.');
  } finally {
    sheet.classList.remove('pdf-compact');
    if(triggerEl){ triggerEl.textContent = originalLabel || 'Stáhnout PDF'; triggerEl.disabled = false; }
  }
}

async function onSubmitInvoice(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const id = fd.get('id');
  const clientId = fd.get('clientId');

    alert('Vyber odběratele ze seznamu (napiš jeho jméno a klikni na něj v nabídce).');
    return;
  }
  // Update the client's own record with any edits made inline on this invoice
  const clientIdx = state.clients.findIndex(c=>c.id===clientId);
  if(clientIdx > -1){
    state.clients[clientIdx] = {
      ...state.clients[clientIdx],
      ico: fd.get('clientIco') ?? state.clients[clientIdx].ico,
      dic: fd.get('clientDic') ?? state.clients[clientIdx].dic,
      contactEmail: fd.get('clientEmail') ?? state.clients[clientIdx].contactEmail,
      contactPhone: fd.get('clientPhone') ?? state.clients[clientIdx].contactPhone
    };

  }
  let companyId = fd.get('companyId');
  if(companyId === '__new__'){
    const name = (fd.get('newCoName')||'').trim();
    if(!name){ alert('Zadej alespoň název nové firmy.'); return; }
    const newCompany = {

      email: fd.get('newCoEmail')||'', phone: fd.get('newCoPhone')||'', account: fd.get('newCoAccount')||'', iban: fd.get('newCoIban')||'',
      tagline:'', bankName:'', swift:'', website:'', registration:'',
      prefix: new Date().getFullYear().toString(), nextNumber:1, defaultDueDays:14, defaultNote:'Děkujeme za spolupráci.',
      invoiceTerms:'Fakturovaná částka bude odečtena z uvedeného účtu. V případě prodlení s úhradou je odběratel povinen uhradit úrok z prodlení dle platné legislativy.',
      defaultPaymentMethod:'Bankovním převodem', invoiceAccent:'#5B8DEF',
      logo:'', signature:'', stamp:'', showLogo:true, showStamp:true, showSignature:true, showQr:true
    };
    state.companies.push(newCompany);
    companyId = newCompany.id;
  }
  const items = state.formItems.filter(it=> (it.desc||'').trim()!=='' || (it.qty||0)!==0 );
  const docType = fd.get('docType') || 'invoice';
  const invoice = {
    id: id || uid(),
    number: fd.get('number'),
    clientId: clientId,
    companyId: companyId,
    docType: docType,
    relatedInvoiceId: docType==='credit_note' ? (fd.get('relatedInvoiceId')||null) : null,
    creditReason: docType==='credit_note' ? (fd.get('creditReason')||'') : '',
    issueDate: fd.get('issueDate'),
    dueDate: fd.get('dueDate'),
    taxDate: fd.get('taxDate'),
    variableSymbol: fd.get('variableSymbol'),
    constantSymbol: fd.get('constantSymbol'),
    orderNumber: fd.get('orderNumber'),
    currency: fd.get('currency') || 'CZK',
    discountType: fd.get('discountType') || 'none',
    discountValue: parseFloat(fd.get('discountValue'))||0,
    rounding: fd.get('rounding') || 'none',
    paymentMethod: fd.get('paymentMethod') || 'Bankovním převodem',
    includeStamp: fd.get('includeStamp')==='1',
    colorMode: fd.get('colorMode')==='bw' ? 'bw' : 'color',
    includeSignature: fd.get('includeSignature')==='1',
    includeQr: fd.get('includeQr')==='1',
    note: fd.get('note'),
    items: items,
    paid: fd.get('paid')==='1',
    paidDate: fd.get('paidDate')||null,
    createdBy: id ? (state.invoices.find(i=>i.id===id)||{}).createdBy || state.currentUser : state.currentUser
  };
  // Sklad se automaticky mění jen u skutečných faktur — dobropis i zálohová faktura
  // fyzický pohyb zboží neznamenají samy o sobě (dobropis lze řešit ručním skladovým pohybem).
  if(docType==='invoice'){
    const oldItemsForStock = id ? ((state.invoices.find(i=>i.id===id)||{}).items || []) : [];
    try{
      await applyStockForInvoiceChange(oldItemsForStock, invoice.items, 'Faktura '+invoice.number);
    }catch(err){
      if(err && err.message==='cancelled') return; // uživatel zrušil kvůli zápornému skladu
    }
  }
  if(id){
    const idx = state.invoices.findIndex(i=>i.id===id);
    state.invoices[idx] = invoice;
  } else {
    state.invoices.push(invoice);
    const issuingCo = companyById(companyId);
    if(issuingCo){
      if(docType==='credit_note') issuingCo.creditNoteNextNumber = (issuingCo.creditNoteNextNumber||1) + 1;
      else if(docType==='proforma') issuingCo.proformaNextNumber = (issuingCo.proformaNextNumber||1) + 1;
      else issuingCo.nextNumber = (issuingCo.nextNumber||1) + 1;
    }
  }
  await saveCompanies();
  await saveInvoices();
  state.formItems = [];
  state.formCompanyId = null;
  state.newInvoiceDocType = 'invoice';
  state.newInvoiceRelatedId = null;
  state.newInvoiceClientId = null;
  state.previewId = invoice.id;
  state.view = 'invoice-preview';
  render();
}

function resizeImageFile(file, maxDim = 480, quality = 0.86){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Soubor se nepodařilo přečíst.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Obrázek se nepodařilo zpracovat.'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

window.addEventListener('unhandledrejection', (e)=>{
  console.error('Unhandled error:', e.reason);
  let msg;
  if(e.reason instanceof Error){
    msg = e.reason.message;
  } else if(typeof Event!=='undefined' && e.reason instanceof Event){
    const t = e.reason.target;
    const tag = (t && t.tagName) ? t.tagName.toLowerCase() : '';
    const src = (t && (t.src||t.href)) ? ` (${t.src||t.href})` : '';
    msg = `nepodařilo se načíst${tag?' prvek <'+tag+'>':''}${src} — typ události: ${e.reason.type}`;
  } else {
    msg = String(e.reason||'neznámá chyba');
  }
  alert('Něco se nepovedlo uložit nebo načíst. Zkus akci prosím zopakovat.\n\nPodrobnost: ' + msg);
});

  document.getElementById('app').innerHTML = '<div style="padding:60px;font-family:Inter,sans-serif;color:#64748B;">Načítám…</div>';

  // Návrat ze Stripe Checkout (po zaplacení / po zrušení) — jen vyčistíme
  // URL, samotné ověření platby řeší afterLogin() + billing-gate obrazovka.
  const checkoutParam = new URLSearchParams(window.location.search).get('checkout');
  if(checkoutParam){
    history.replaceState(null, '', window.location.pathname);
    if(checkoutParam === 'cancel') state.checkoutCanceled = true;
  }

  const recovery = parseRecoveryHash();
  if(recovery){
    // Uživatel přišel z odkazu v e-mailu ("zapomenuté heslo") — samotné
    // ověření proběhlo kliknutím na tenhle odkaz, takže rovnou nabídneme
    // nastavení nového hesla, žádný další krok navíc.
    history.replaceState(null, '', window.location.pathname + window.location.search);
    const info = await fetchRecoveryUser(recovery.access_token);
    state.recoverySession = { ...recovery, email: info ? info.email : '' };
    state.authView = 'reset-password';
    render();
    return;
  }
  loadSessionFromStorage();
  if(session){
    const fresh = await ensureFreshSession();
    if(fresh){
      try{ await afterLogin(); return; }
      catch(e){ console.error(e); persistSession(null); }
    }
  }
  render();
})();
</script>
</body>
</html>
