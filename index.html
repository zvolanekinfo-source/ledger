<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — fakturační kniha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#182420;
    --ink-soft:#5C6B66;
    --paper:#EEF0EA;
    --surface:#FFFFFF;
    --line:#D7D9CF;
    --accent:#1F5C4D;
    --accent-soft:#DCE8E2;
    --amber:#B8802B;
    --amber-soft:#F3E6CD;
    --red:#AE4530;
    --red-soft:#F3DCD4;
    --inv-accent:#1F5C4D;
    --inv-accent-soft:#DCE8E2;
    --inv-accent-tint:rgba(31,92,77,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .num{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--ink);
    color:#EDEFEA;
    display:flex;
    flex-direction:column;
    padding:24px 0;
  }
  .brand{
    padding:0 22px 20px 22px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:16px;
  }
  .brand .display{font-size:22px;font-weight:600;letter-spacing:0.3px;color:#fff;}
  .brand .sub{font-size:11px;color:#9BAAA3;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px;}
  .navitem{
    display:flex;align-items:center;gap:10px;
    padding:11px 22px;
    font-size:14px;
    color:#C9D2CC;
    border-left:3px solid transparent;
    transition:background .15s;
  }
  .navitem:hover{background:rgba(255,255,255,0.05);}
  .navitem.active{
    background:rgba(255,255,255,0.07);
    color:#fff;
    border-left:3px solid var(--accent-soft);
  }
  .navitem .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7C8B84;width:18px;}
  .sidebar-foot{margin-top:auto;padding:16px 22px 20px 22px;font-size:11px;color:#647069;border-top:1px solid rgba(255,255,255,0.1);}

  /* MAIN */
  .main{flex:1;padding:36px 44px;max-width:1180px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;}
  .pagehead h1{font-size:28px;margin:0 0 4px 0;font-weight:600;}
  .pagehead .desc{color:var(--ink-soft);font-size:14px;margin:0;}
  .btn{
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:3px;
    font-size:14px;
    font-weight:500;
  }
  .btn:hover{background:#0f1815;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{background:#fff;}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-soft);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.small{padding:6px 12px;font-size:12.5px;}

  /* CARDS */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;}
  .card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:8px;}
  .card .value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .card .value.amber{color:var(--amber);}
  .card .value.red{color:var(--red);}
  .card .value.accent{color:var(--accent);}

  /* TABLE */
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;
    color:var(--ink-soft);padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;
  }
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAF6;}
  .rowlink{cursor:pointer;}
  .empty{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty .display{font-size:18px;color:var(--ink);margin-bottom:6px;}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:0.2px;}
  .pill.paid{background:var(--accent-soft);color:var(--accent);}
  .pill.pending{background:var(--amber-soft);color:var(--amber);}
  .pill.overdue{background:var(--red-soft);color:var(--red);}

  /* FILTER BAR */
  .filter-bar{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:20px;}
  .filter-presets{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;}
  .chip:hover{background:var(--paper);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .filter-row .field{margin-bottom:0;}
  .filter-row .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
  .filter-row input,.filter-row select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:13.5px;background:#fff;color:var(--ink);}
  .filter-row input:focus,.filter-row select:focus{outline:none;border-color:var(--accent);}
  .filter-clear{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:12.5px;padding:0;margin-top:12px;}

  /* CHART */
  .chart-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:24px;}
  .chart-card .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .chart-card .chart-head .display{font-size:16px;font-weight:600;}
  .chart-card .chart-head .chart-total{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;color:var(--accent);}

  /* FORMS */
  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 28px;max-width:840px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  input[type="date"]{accent-color:var(--ink);color-scheme:light;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;opacity:1;}
  .field textarea{resize:vertical;min-height:60px;}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:24px 0 12px 0;border-top:1px solid var(--line);padding-top:18px;}
  .section-title:first-child{border-top:none;padding-top:0;margin-top:0;}

  .items-table{width:100%;border-collapse:collapse;margin-bottom:10px;table-layout:fixed;}
  .items-table th{font-size:11px;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);}
  .items-table td{padding:6px 8px;vertical-align:top;}
  .items-table input,.items-table select{padding:7px 8px;font-size:13.5px;width:100%;box-sizing:border-box;}
  .items-table .col-desc{width:30%;}
  .items-table .col-qty{width:10%;}
  .items-table .col-unit{width:9%;}
  .items-table .col-price{width:14%;}
  .items-table .col-vat{width:11%;}
  .items-table.no-vat .col-vat{display:none;}
  .items-table .col-total{width:17%;}
  .items-table .col-remove{width:32px;}
  .items-table-wrap{overflow-x:auto;}
  .totals-box{margin-left:auto;width:260px;font-size:14px;}
  .totals-box .trow{display:flex;justify-content:space-between;padding:5px 0;color:var(--ink-soft);}
  .totals-box .trow.grand{color:var(--ink);font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-family:'IBM Plex Mono',monospace;}
  .formfoot{display:flex;gap:10px;margin-top:22px;align-items:center;}
  .btn-link{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:14px;padding:10px 4px;}
  .btn-link:hover{color:var(--ink);}
  .mini-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:14px 0 6px 0;}
  .detail-grid{display:flex;flex-direction:column;gap:10px;}
  .detail-row{display:grid;grid-template-columns:180px 1fr;gap:14px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--ink-soft);}
  .attachment-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:13.5px;background:var(--paper);}
  .attachment-row .att-actions{display:flex;gap:14px;flex-shrink:0;}
  .attachment-row .att-note{font-size:12px;color:var(--ink-soft);}
  .attachment-row .att-actions .btn-link{padding:0;font-size:12.5px;}

  /* SEARCH */
  .search-row{margin-bottom:16px;}
  .search-input{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:#fff;}
  .search-input:focus{outline:none;border-color:var(--accent);}

  /* CLIENT COMBO */
  .combo-field{position:relative;}
  .client-detail-box{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px 4px 18px;margin:-4px 0 18px 0;}
  .combo-list{
    position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:4px;margin-top:4px;max-height:220px;overflow-y:auto;box-shadow:0 6px 18px rgba(24,36,32,0.1);
    z-index:20;display:none;
  }
  .combo-list.open{display:block;}
  .combo-item{padding:9px 12px;font-size:13.5px;cursor:pointer;}
  .combo-item:hover,.combo-item.hl{background:var(--accent-soft);}
  .combo-item .sub{font-size:11.5px;color:var(--ink-soft);}
  .combo-empty{padding:12px;font-size:13px;color:var(--ink-soft);}

  /* INVOICE IMPORT */
  .dropzone{
    border:2px dashed var(--line);border-radius:8px;padding:40px 24px;text-align:center;
    color:var(--ink-soft);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone .display{font-size:17px;color:var(--ink);margin-bottom:6px;}
  .import-status{margin-top:16px;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .import-error{background:var(--red-soft);color:var(--red);font-size:13.5px;padding:10px 14px;border-radius:4px;margin-top:14px;}
  .import-preview{margin-top:22px;border-top:1px solid var(--line);padding-top:20px;}
  .import-preview .row{display:flex;gap:24px;margin-bottom:14px;font-size:13.5px;}
  .import-preview .col{flex:1;}
  .import-preview .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:4px;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-left:6px;}
  .iconbtn{background:transparent;border:none;color:var(--ink-soft);font-size:13px;padding:4px 6px;}
  .iconbtn:hover{color:var(--red);}
  .actions-cell{display:flex;gap:8px;}

  /* INVOICE PREVIEW */
  .preview-wrap{display:flex;gap:24px;align-items:flex-start;}
  .invoice-sheet{
    background:var(--surface);width:760px;padding:0;border:1px solid var(--line);
    position:relative;overflow:hidden;border-radius:14px;
    box-shadow:0 6px 28px rgba(24,36,32,0.05);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
  }
  .invoice-sheet .inv-body{padding:48px 52px 48px 52px;}
  .invoice-sheet.bw-mode{filter:grayscale(1) contrast(1.05);}

  /* header */
  .invoice-sheet .inv-header{
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--line);
  }
  .invoice-sheet .inv-header-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .invoice-sheet .inv-logo{height:48px;width:auto;max-width:170px;object-fit:contain;flex-shrink:0;}
  .invoice-sheet .inv-logo-placeholder{
    width:44px;height:44px;border-radius:10px;background:var(--paper);
    border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
    font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;text-align:center;
  }
  .invoice-sheet .inv-co-name{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:var(--ink);line-height:1.3;letter-spacing:-0.2px;}
  .invoice-sheet .inv-co-tagline{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .invoice-sheet .inv-header-right{text-align:right;flex-shrink:0;}
  .invoice-sheet .inv-doctitle{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:1.5px;text-transform:uppercase;}
  .invoice-sheet .inv-docnum{font-family:'Inter',sans-serif;color:var(--ink);font-size:19px;font-weight:600;margin-top:6px;letter-spacing:-0.2px;}
  .invoice-sheet .paid-badge{
    display:inline-block;margin-top:10px;
    color:var(--inv-accent);background:var(--inv-accent-soft);
    font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;
    padding:3px 11px;border-radius:20px;
  }

  /* info cards (dodavatel+platba / odběratel) — rozvržení podle referenční faktury */
  .invoice-sheet .info-grid{display:flex;gap:20px;margin-bottom:30px;align-items:stretch;}
  .invoice-sheet .info-card{flex:1;border:1px solid var(--line);border-radius:10px;padding:18px 20px;font-size:13px;line-height:1.6;color:var(--ink-soft);}
  .invoice-sheet .info-card .k{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
  .invoice-sheet .info-card .nm{font-weight:600;font-size:14px;margin-bottom:3px;color:var(--ink);}
  .invoice-sheet .info-card .divider{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;}
  .invoice-sheet .info-card .meta-row{display:flex;justify-content:space-between;padding:2px 0;gap:10px;}
  .invoice-sheet .info-card .meta-row span:first-child{color:var(--ink-soft);}
  .invoice-sheet .info-card .meta-row span:last-child{font-family:'Inter',sans-serif;font-weight:600;color:var(--ink);text-align:right;}

  .invoice-sheet table.lines{width:100%;border-collapse:collapse;margin-bottom:22px;}
  .invoice-sheet table.lines thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);
    padding:0 10px 10px 10px;font-weight:500;border-bottom:1px solid var(--ink);
  }
  .invoice-sheet table.lines td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink);}
  .invoice-sheet table.lines tbody tr:last-child td{border-bottom:1px solid var(--ink);}
  .invoice-sheet table.lines td.num,.invoice-sheet table.lines th.num{text-align:right;font-family:'Inter',sans-serif;}

  .invoice-sheet .bottom{display:flex;justify-content:flex-end;align-items:flex-start;margin-top:8px;gap:32px;}
  .invoice-sheet .qrbox{text-align:center;font-size:10.5px;color:var(--ink-soft);flex-shrink:0;}
  .invoice-sheet .qrbox .qrimg{border:1px solid var(--line);padding:8px;background:#fff;display:inline-block;margin-bottom:6px;border-radius:8px;}
  .invoice-sheet .totals{width:230px;flex-shrink:0;}
  .invoice-sheet .totals .trow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink-soft);}
  .invoice-sheet .totals .trow.grand{
    font-family:'Inter',sans-serif;font-size:21px;font-weight:700;color:var(--inv-accent);
    border-top:1.5px solid var(--ink);margin-top:8px;padding-top:14px;letter-spacing:-0.3px;
  }
  .invoice-sheet .note{margin-top:24px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:16px;white-space:pre-wrap;}

  /* signature / stamp row */
  .invoice-sheet .signoff{display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px;gap:24px;}
  .invoice-sheet .signoff-terms{flex:1;font-size:11px;color:var(--ink-soft);line-height:1.5;white-space:pre-wrap;}
  .invoice-sheet .signbox{width:260px;flex-shrink:0;text-align:center;min-height:92px;}
  .invoice-sheet .signbox .sig-stack{display:flex;align-items:flex-end;justify-content:center;gap:18px;height:64px;}
  .invoice-sheet .signbox img.sig-img{max-height:60px;max-width:130px;object-fit:contain;}
  .invoice-sheet .signbox img.co-stamp-img{max-height:64px;max-width:120px;object-fit:contain;}
  .invoice-sheet .signbox .sig-line{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}

  .invoice-sheet .inv-footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);}

  .preview-side{width:220px;display:flex;flex-direction:column;gap:8px;}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;background:var(--surface);}
  .login-side{
    flex:1 1 46%;
    position:relative;
    overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:56px 56px;
    background:
      radial-gradient(560px 420px at 15% 12%, rgba(220,232,226,0.16), transparent 60%),
      radial-gradient(680px 520px at 88% 90%, rgba(184,128,43,0.14), transparent 55%),
      linear-gradient(155deg, #14201c 0%, var(--ink) 55%, #0f1815 100%);
    color:#EDEFEA;
  }
  .login-side::before{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.09) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(650px 500px at 20% 15%, #000 0%, transparent 70%);
    mask-image:radial-gradient(650px 500px at 20% 15%, #000 0%, transparent 70%);
    pointer-events:none;
  }
  .login-side .side-top{position:relative;z-index:1;}
  .login-side .side-mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:11px;
    background:rgba(220,232,226,0.12);border:1px solid rgba(220,232,226,0.22);
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:#fff;
    margin-bottom:22px;
  }
  .login-side .side-brand{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:#fff;margin-bottom:8px;}
  .login-side .side-sub{font-size:14.5px;color:#AEBBB4;max-width:320px;line-height:1.55;}
  .login-side .side-foot{position:relative;z-index:1;font-size:12px;color:#7C8B84;letter-spacing:0.3px;}
  .login-form-side{
    flex:1 1 54%;
    display:flex;align-items:center;justify-content:center;
    padding:40px;
  }
  .login-card{width:100%;max-width:380px;padding:0;}
  .login-card .brand-head{margin-bottom:26px;}
  .login-card .display{font-size:24px;margin-bottom:3px;font-weight:600;}
  .login-card .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:0;}
  .login-card .field{margin-bottom:14px;}

function stripDiacritics(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function hexToRgba(hex, alpha){
  const h = (hex||'#1F5C4D').replace('#','');
  const full = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const r = parseInt(full.substring(0,2),16)||0, g = parseInt(full.substring(2,4),16)||0, b = parseInt(full.substring(4,6),16)||0;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ---------- SUPABASE STORAGE + AUTH ----------
   Ukládání dat běží nad Supabase REST API, aby Ledger fungoval i po nahrání
   na GitHub Pages / kamkoliv jinam mimo Claude.
   Přístup k datům je řízený skutečným přihlášením přes Supabase Auth
   (hesla hashuje a spravuje Supabase, tento kód s nimi nikdy nepracuje
   v čitelné podobě) a RLS pravidly, které povolí čtení/zápis jen členům
   týmu. Kompletní SQL nastavení najdeš v přiloženém souboru supabase-setup.sql —
   je potřeba ho jednou spustit v Supabase SQL editoru. */
const SUPABASE_URL = 'https://jucphmkmujjhxymvguhc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wk2kCIi0aM_wq-ZEAGF8OA_m9D4gGaG'; // veřejný "anon" klíč – bezpečný ve frontend kódu, sám o sobě k datům nepustí (viz RLS)
const SUPABASE_REST = SUPABASE_URL + '/rest/v1';
const SUPABASE_AUTH = SUPABASE_URL + '/auth/v1';
const SESSION_KEY = 'ledger_session_v1';

/* ---- session (JWT vydaný Supabase Auth po přihlášení) ---- */
let session = null; // { access_token, refresh_token, expires_at, user:{id,email} }

function loadSessionFromStorage(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    session = raw ? JSON.parse(raw) : null;
  }catch(e){ session = null; }
}
function persistSession(s){
  session = s;
  try{
    if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}

async function authRequest(path, body){
  const res = await fetch(SUPABASE_AUTH + path, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=> ({}));
  if(!res.ok){
    const msg = data.error_description || data.msg || data.error || 'Chyba přihlašovací služby.';
    throw new Error(msg);
  }
  return data;
}

function toSession(data){
  if(!data || !data.access_token) return null;
  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + ((data.expires_in||3600)*1000) - 15000,
    user: { id: data.user.id, email: data.user.email }
  };
}

async function ensureFreshSession(){
  if(!session) return null;
  if(Date.now() < session.expires_at) return session;
  try{
    const data = await authRequest('/token?grant_type=refresh_token', { refresh_token: session.refresh_token });
    persistSession(toSession(data));
    return session;
  }catch(e){
    persistSession(null);
    return null;
  }
}

async function signUp(email, password){
  const data = await authRequest('/signup', { email, password });
  return toSession(data); // null pokud instance vyžaduje potvrzení e-mailem
}
async function signIn(email, password){
  const data = await authRequest('/token?grant_type=password', { email, password });
  return toSession(data);
}

}

async function sbRequest(path, options = {}){
  await ensureFreshSession();
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
    'Content-Type': 'application/json',
    ...(options.headers || {})
  };
  const res = await fetch(SUPABASE_REST + path, { ...options, headers });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  return res;
}

window.storage = {
  async get(key){
    const rows = await (await sbRequest(`/app_storage?key=eq.${encodeURIComponent(key)}&select=value`)).json();
    if(!rows.length) return null;
    return { key, value: rows[0].value };
  },
  async set(key, value){
    await sbRequest('/app_storage?on_conflict=key', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
    });
    return { key, value };
  },
  async delete(key){
    await sbRequest(`/app_storage?key=eq.${encodeURIComponent(key)}`, { method: 'DELETE' });
    return { key, deleted: true };
  },
  async list(prefix){
    const filter = prefix ? `&key=like.${encodeURIComponent(prefix)}*` : '';
    const rows = await (await sbRequest(`/app_storage?select=key${filter}`)).json();
    return { keys: rows.map(r => r.key) };
  }
};

/* ---------- BACKUP / SNAPSHOTS ---------- */
async function loadBackupIndex(){
  try{ const r = await window.storage.get('backup-index', true); return r ? JSON.parse(r.value) : []; }catch(e){ return []; }
}
async function saveSnapshotBackup(){
  try{
    const date = todayISO();
    const payload = JSON.stringify({ savedAt: new Date().toISOString(), companies: state.companies, clients: state.clients, invoices: state.invoices });
    await window.storage.set('backup:'+date, payload, true);
    let dates = await loadBackupIndex();
    if(!dates.includes(date)) dates.push(date);
    dates.sort();
    while(dates.length > 10){
      const old = dates.shift();
      try{ await window.storage.delete('backup:'+old, true); }catch(e){/* ignore */}
    }
    await window.storage.set('backup-index', JSON.stringify(dates), true);
    state.backupDates = dates;
  }catch(e){ console.error('Snapshot backup failed', e); }
}

/* ---------- DERIVED ---------- */
function invoiceTotals(inv){
  let base=0, vat=0;
  (inv.items||[]).forEach(it=>{
    const b = (it.qty||0)*(it.price||0);
    base += b;
    vat += b*((it.vat||0)/100);
  });
  return { base, vat, total: base+vat };
}
function invoiceStatus(inv){
  if(inv.paid) return 'paid';
  if(inv.dueDate && inv.dueDate < todayISO()) return 'overdue';
  return 'pending';
}
function statusLabel(s){ return s==='paid'?'Zaplaceno':(s==='overdue'?'Po splatnosti':'Čeká na platbu'); }
function clientById(id){ return state.clients.find(c=>c.id===id); }

function applyDateRangeFromPreset(preset){
  const today = todayISO();
  if(preset==='month'){
    return { from: today.slice(0,7)+'-01', to: today };
  }
  if(preset==='12m'){
    const d = new Date(today); d.setMonth(d.getMonth()-11); d.setDate(1);
    return { from: d.toISOString().slice(0,10), to: today };
  }
  return { from:'', to:'' }; // 'all' or 'custom'
}

function applyInvoiceFilters(list, f){
  return list.filter(inv=>{
    if(f.from && (inv.issueDate||'') < f.from) return false;
    if(f.to && (inv.issueDate||'') > f.to) return false;
    if(f.clientId && inv.clientId !== f.clientId) return false;
    if(f.status){ if(invoiceStatus(inv) !== f.status) return false; }
    return true;
  });
}

const MONTH_SHORT = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];

function buildRevenueChart(list){
  const map = new Map();
  list.forEach(inv=>{
    const key = (inv.issueDate||'').slice(0,7);
    if(!key || key.length!==7) return;
    map.set(key, (map.get(key)||0) + invoiceTotals(inv).total);
  });
  const months = [...map.keys()].sort();
  if(!months.length){
    return '<div class="empty" style="padding:34px 20px;"><div class="display" style="font-size:15px;">Pro vybrané období nejsou žádná data</div><div>Zkus rozšířit rozsah dat nebo zrušit filtr.</div></div>';
  }
  const max = Math.max(...months.map(m=>map.get(m)), 1);
  const w = 780, h = 230, padL = 56, padR = 12, padT = 12, padB = 32;
  const chartW = w - padL - padR;
  const gap = 12;
  const barW = Math.max(6, chartW/months.length - gap);
  let grid = '';
  [0, 0.5, 1].forEach(frac=>{
    const y = h - padB - Math.round(frac*(h-padT-padB));
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="10" style="fill:var(--ink-soft);font-family:'IBM Plex Mono',monospace;">${fmt(frac*max)}</text>`;
  });
  let bars = '';
  months.forEach((m,i)=>{
    const val = map.get(m);
    const bh = Math.max(1, Math.round((val/max)*(h-padT-padB)));
    const x = padL + i*(barW+gap);
    const y = h - padB - bh;
    const [yy,mo] = m.split('-');
    const label = `${MONTH_SHORT[parseInt(mo,10)-1]} ${yy.slice(2)}`;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" style="fill:var(--accent);opacity:0.88;"><title>${label}: ${fmt(val)} Kč</title></rect>`;
    bars += `<text x="${x+barW/2}" y="${h-padB+16}" text-anchor="middle" font-size="10.5" style="fill:var(--ink-soft);font-family:Inter,sans-serif;">${label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:220px;display:block;">${grid}${bars}</svg>`;
}

function clientOptions(selectedId){

function afterRenderAuth(){
  const lf = document.getElementById('login-form');
  if(lf) lf.addEventListener('submit', onSubmitLogin);
  const rf = document.getElementById('register-form');
  if(rf) rf.addEventListener('submit', onSubmitRegister);
}

async function afterLogin(){
  await loadTeam();
  let me = state.users.find(u=>u.id===session.user.id);
  if(!me){
    // Účet existuje v Supabase Auth, ale ještě nemá záznam v týmu
    // (typicky když se přihlásí poprvé po potvrzení e-mailu) — doplníme ho.
    try{
      await insertTeamMember(session.user.id, session.user.email, session.user.email);
      await loadTeam();
      me = state.users.find(u=>u.id===session.user.id);
    }catch(err){ console.error('Nepovedlo se založit záznam v týmu:', err); }
  }
  state.currentUser = me ? me.name : session.user.email;
  state.currentUserId = session.user.id;
  await loadAll();
  state.view = 'dashboard';
  state.authError=''; state.authNotice='';
  render();
}

async function onSubmitLogin(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  state.lastLoginEmail = email;
  const submitBtn = e.target.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    const s = await signIn(email, password);
    persistSession(s);
    await afterLogin();
  }catch(err){
    state.authError = 'Nesedí e-mail nebo heslo.';
    render();
  }
}

async function onSubmitRegister(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const displayName = (fd.get('displayName')||'').trim();
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  const password2 = fd.get('password2');
  if(password !== password2){
    state.authError = 'Zadaná hesla se neshodují.';
    render();
    return;
  }
  const submitBtn = e.target.querySelector('button[type="submit"]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    const s = await signUp(email, password);
    if(!s){
      // Instance vyžaduje potvrzení e-mailem, než je session vydaná
      state.authError = '';
      state.authNotice = 'Účet je vytvořený. Zkontroluj e-mail a potvrď registraci, pak se přihlas.';
      state.authView = 'login';
      state.lastLoginEmail = email;
      render();
      return;
    }
    persistSession(s);
    await insertTeamMember(s.user.id, email, displayName || email);
    await afterLogin();
  }catch(err){
    state.authError = err.message || 'Registrace se nepovedla.';
    render();
  }
}

function renderView(){
  switch(state.view){
    case 'dashboard': return viewDashboard();
    case 'invoices': return viewInvoices();
    case 'invoice-form': return viewInvoiceForm();
    case 'invoice-preview': return viewInvoicePreview();
    case 'bulk-import': return viewBulkImport();
    case 'clients': return viewClients();
    case 'client-form': return viewClientForm();
    case 'client-detail': return viewClientDetail();
    case 'settings': return viewSettings();
    case 'company-form': return viewCompanyForm();
    case 'account-form': return viewAccountForm();
    case 'colleague-form': return viewColleagueForm();
    case 'user-creds-form': return viewUserCredsForm();
    default: return '';
  }
}

/* ---------- DASHBOARD ---------- */
function viewDashboard(){
  const f = state.dashboardFilter;
  const filtered = applyInvoiceFilters(state.invoices, f).map(i=>({...i, status: invoiceStatus(i), t: invoiceTotals(i)}));
  const revenue = filtered.reduce((s,i)=>s+i.t.total,0);
  const unpaidSum = filtered.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.t.total,0);
  const overdueCount = filtered.filter(i=>i.status==='overdue').length;
  const sorted = [...filtered].sort((a,b)=> (b.issueDate||'').localeCompare(a.issueDate||''));

  const presets = [['month','Tento měsíc'],['12m','Posledních 12 měsíců'],['all','Vše'],['custom','Vlastní']];

  return `
    <div class="pagehead">
      <div><h1>Přehled</h1><p class="desc">Stav fakturace za vybrané období.</p></div>
    </div>

    <div class="filter-bar no-print">
      <div class="filter-presets">
        ${presets.map(([v,l])=>`<button type="button" class="chip ${f.preset===v?'active':''}" data-action="dash-preset" data-preset="${v}">${l}</button>`).join('')}
      </div>
      ${f.preset==='custom' ? `
      <div class="filter-row">
        <div class="field"><label>Od</label><input type="date" id="dash-from" value="${f.from||''}"></div>
        <div class="field"><label>Do</label><input type="date" id="dash-to" value="${f.to||''}"></div>
        <div class="field"><label>Odběratel</label><select id="dash-client">${clientOptions(f.clientId)}</select></div>
        <div class="field"><label>Stav</label><select id="dash-status">${statusOptions(f.status)}</select></div>
      </div>
      ` : ''}
    </div>

    <div class="cards">
      <div class="card"><div class="label">Faktur ve výběru</div><div class="value">${filtered.length}</div></div>
      <div class="card"><div class="label">Fakturováno celkem</div><div class="value accent num">${fmt(revenue)} Kč</div></div>
      <div class="card"><div class="label">Nezaplaceno</div><div class="value amber num">${fmt(unpaidSum)} Kč</div></div>
      <div class="card"><div class="label">Po splatnosti</div><div class="value red num">${overdueCount}</div></div>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <div class="display">Výnos podle měsíce</div>
        <div class="chart-total">${fmt(revenue)} Kč</div>
      </div>
      ${buildRevenueChart(filtered)}
    </div>

    <div class="section-title">Faktury ve výběru (${filtered.length})</div>
    ${sorted.length ? renderInvoiceTable(sorted) : emptyState('Žádné faktury pro tento filtr','Zkus zmenšit rozsah filtru nebo zvolit „Vše“.')}
  `;
}

function emptyState(title, sub){
  return `<div class="empty"><div class="display">${title}</div><div>${sub}</div></div>`;
}

  state.preselectClientId = null;
  return {
    id:null, number:num, clientId: preselected, companyId: c.id,
    issueDate: todayISO(), taxDate: todayISO(), dueDate: addDays(todayISO(), c.defaultDueDays||14),
    variableSymbol: num.replace(/\D/g,''), constantSymbol:'', orderNumber:'', currency:'CZK', rounding:'none',
    note: c.defaultNote||'', paid:false, paidDate:null,
    paymentMethod: c.defaultPaymentMethod || 'Bankovním převodem', colorMode:'color', discountType:'none', discountValue:0,
    includeStamp:true, includeSignature:true, includeQr:true
  };
}

function renderItemRows(){
  return state.formItems.map((it,idx)=>{
    const lineTotal = (it.qty||0)*(it.price||0)*(1+(it.vat||0)/100);
    return `<tr>
      <td class="col-desc"><input data-field="desc" data-index="${idx}" value="${escapeAttr(it.desc)}" placeholder="Popis položky"></td>
      <td class="col-qty"><input type="number" step="0.01" data-field="qty" data-index="${idx}" value="${it.qty}"></td>
      <td class="col-unit"><input data-field="unit" data-index="${idx}" value="${escapeAttr(it.unit||'ks')}"></td>
      <td class="col-price"><input type="number" step="0.01" data-field="price" data-index="${idx}" value="${it.price}"></td>
      <td class="col-vat">
        <input type="number" step="0.1" min="0" max="100" list="vat-rate-options" data-field="vat" data-index="${idx}" value="${it.vat}">
      </td>
      <td class="col-total num" style="white-space:nowrap;padding-top:14px;">${fmt(lineTotal)} Kč</td>
      <td class="col-remove"><button type="button" class="iconbtn no-print" data-action="remove-item" data-index="${idx}">✕</button></td>
    </tr>`;
  }).join('');
}

function renderTotalsBox(vatPayerNow){
  let base=0, vat=0;
  state.formItems.forEach(it=>{ const b=(it.qty||0)*(it.price||0); base+=b; vat+=b*((it.vat||0)/100); });
  return `
    <div class="trow"><span>Základ daně</span><span class="num">${fmt(base)} Kč</span></div>
    ${vatPayerNow!==false?`<div class="trow"><span>DPH</span><span class="num">${fmt(vat)} Kč</span></div>`:''}
    <div class="trow grand"><span>Celkem</span><span>${fmt(base+vat)} Kč</span></div>
  `;
}

function buildSpayd(co, inv, total){
  if(!co.iban) return null;
  const acc = co.iban.replace(/\s+/g,'');
  const msg = stripDiacritics(`FAKTURA ${inv.number}`).toUpperCase();
  const vs = (inv.variableSymbol||'').replace(/\D/g,'');
  const ks = (inv.constantSymbol||'').replace(/\D/g,'');
  let s = `SPD*1.0*ACC:${acc}*AM:${total.toFixed(2)}*CC:${inv.currency||'CZK'}*MSG:${msg}`;
  if(vs) s += `*X-VS:${vs}`;
  if(ks) s += `*X-KS:${ks}`;
  return s;
}

function registrationSentence(co){
  if(!co.showRegistration) return '';
  const parts = [];
  if(co.regCourt) parts.push(`Městským soudem v ${co.regCourt}`);
  if(co.regSection) parts.push(`oddíl ${co.regSection}`);
  if(co.regInsert) parts.push(`vložka ${co.regInsert}`);
  if(co.regDate) parts.push(`dne ${formatCzDate(co.regDate)}`);
  if(!parts.length) return '';
  return `Zapsáno v obchodním rejstříku vedeném ${parts.join(', ')}.`;
}
function formatCzDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('cs-CZ');
}

function sortedClients(){

  else if(sort==='za') arr.sort((a,b)=> (b.name||'').localeCompare(a.name||'','cs'));
  return arr;
}

function filterClientRows(query, field){
  const q = stripDiacritics(query||'').toLowerCase().trim();
  const attr = ({name:'data-name', ico:'data-ico', dic:'data-dic', city:'data-city', contact:'data-contact', email:'data-email', phone:'data-phone'})[field] || 'data-search';
  const tbody = document.getElementById('clients-tbody');
  if(!tbody) return;
  let visibleCount = 0;
  tbody.querySelectorAll('tr[data-search]').forEach(row=>{
    const match = !q || (row.getAttribute(attr)||'').includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  const emptyRow = document.getElementById('clients-empty-row');
  if(emptyRow) emptyRow.style.display = visibleCount===0 ? '' : 'none';
}

function filterInvoiceRows(query){
  const q = stripDiacritics(query||'').toLowerCase().trim();
  const tbody = document.getElementById('invoices-tbody');
  if(!tbody) return;
  let visibleCount = 0;
  tbody.querySelectorAll('tr[data-search]').forEach(row=>{
    const match = !q || row.getAttribute('data-search').includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  const emptyRow = document.getElementById('invoices-empty-row');
  if(emptyRow) emptyRow.style.display = visibleCount===0 ? '' : 'none';
}

function renderAttachmentsBox(c){
  const files = c.attachments || [];
  return `
    <div id="attachments-box" data-client-id="${c.id}">
      <div id="attachments-list">
        ${files.length ? files.map(f=>`
          <div class="attachment-row" data-path="${escapeAttr(f.path)}">
            <span>
              <span class="att-name">📄 ${escapeHtml(f.name)}</span>
              ${f.note?`<br><span class="att-note">${escapeHtml(f.note)}</span>`:''}
            </span>
            <span class="att-actions">
              <button type="button" class="btn-link" data-action="open-attachment" data-path="${escapeAttr(f.path)}">Otevřít</button>
              <button type="button" class="btn-link" data-action="note-attachment" data-path="${escapeAttr(f.path)}" data-note="${escapeAttr(f.note||'')}">${f.note?'Upravit poznámku':'Přidat poznámku'}</button>
              <button type="button" class="btn-link" data-action="delete-attachment" data-path="${escapeAttr(f.path)}" data-name="${escapeAttr(f.name)}" style="color:var(--red);">Smazat</button>
            </span>
          </div>
        `).join('') : `<p style="font-size:13px;color:var(--ink-soft);margin:0 0 10px 0;">Zatím žádné soubory (faktury, smlouvy, objednávky…).</p>`}
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px;">
        <input type="file" id="attachment-file-input" style="font-size:13px;">
        <span id="attachment-status" style="font-size:12px;color:var(--ink-soft);"></span>
      </div>
    </div>
  `;
}

/* ---------- HROMADNÝ IMPORT (CSV/Excel z libovolného zdroje) ---------- */
const BULK_FIELDS = [
  {key:'', label:'— Ignorovat —'},
  {key:'clientName', label:'Odběratel — název'},
  {key:'clientIco', label:'Odběratel — IČO'},
  {key:'clientDic', label:'Odběratel — DIČ'},
  {key:'clientEmail', label:'Odběratel — e-mail'},
  {key:'clientPhone', label:'Odběratel — telefon'},
  {key:'clientStreet', label:'Odběratel — ulice a číslo'},
  {key:'clientZip', label:'Odběratel — PSČ'},
  {key:'clientCity', label:'Odběratel — město'},
  {key:'invoiceNumber', label:'Faktura — číslo'},
  {key:'issueDate', label:'Faktura — datum vystavení'},
  {key:'dueDate', label:'Faktura — datum splatnosti'},
  {key:'variableSymbol', label:'Faktura — variabilní symbol'},
  {key:'total', label:'Faktura — částka celkem (s DPH)'},
  {key:'baseAmount', label:'Faktura — základ daně (bez DPH)'},
  {key:'vatAmount', label:'Faktura — DPH (částka)'},
  {key:'vatRate', label:'Faktura — sazba DPH (%)'},
  {key:'paid', label:'Faktura — zaplaceno (ano/ne)'},
  {key:'description', label:'Faktura — popis / položka'},
  {key:'note', label:'Faktura — poznámka'},
];

const BULK_GUESS_RULES = [
  [/variabiln|variable\s*symbol/, 'variableSymbol'],
  [/^(č|c)[íi]slo\s*faktury|faktura\s*č|inv(oice)?\s*(no|number|č)|^number$|^invoice$/, 'invoiceNumber'],
  [/vystaven|issue\s*date|date\s*of\s*issue/, 'issueDate'],
  [/splatnost|due\s*date/, 'dueDate'],
  [/z[áa]klad|subtotal|net\s*amount/, 'baseAmount'],
  // DIČ/VAT number musí být dřív než obecná pravidla pro DPH částku/sazbu,
  // jinak by "Vat number" spadlo omylem pod částku DPH
  [/di[čc]\b|vat\s*number|vat\s*id|tax\s*number/, 'clientDic'],
  [/sazba.*dph|dph.*%|vat\s*rate|vat\s*%/, 'vatRate'],
  [/dph|^vat$|vat\s*amount/, 'vatAmount'],
  [/celkem|k\s*[úu]hrad|total|[čc][áa]stka|amount\s*due|grand\s*total/, 'total'],
  [/zaplac|uhrazen|paid|status|stav/, 'paid'],
  [/psč|psc|zip|postal|postcode/, 'clientZip'],
  [/m[ěe]sto|obec|^city$/, 'clientCity'],
  [/ulice|adresa|^address$|^street$/, 'clientStreet'],
  // IČO/company number — dřív než obecné "company", ať se "Company number" nesplete s názvem firmy
  [/i[čc]o\b|company\s*number|registration\s*number|reg\.?\s*no\b/, 'clientIco'],
  [/e-?mail/, 'clientEmail'],
  [/telefon|^phone$/, 'clientPhone'],
  [/n[áa]zev|firma|odb[ěe]ratel|z[áa]kazn[íi]k|klient|customer|client\s*name|^name$|contact\s*name|company\s*name/, 'clientName'],
  [/pozn[áa]mka|note|comment/, 'note'],
  [/polo[žz]ka|popis|description|^item$/, 'description'],
  [/^č[íi]slo$/, 'invoiceNumber'],
];
function guessFieldForHeader(header){
  const h = stripDiacritics(String(header||'')).toLowerCase().trim();
  for(const rule of BULK_GUESS_RULES){
    const [re, field] = Array.isArray(rule[0]) ? rule[0] : rule;
    if(re.test(h)) return field;
  }
  return '';
}
function bulkParseBoolean(v){
  const s = stripDiacritics(String(v==null?'':v)).toLowerCase().trim();
  return ['ano','yes','true','1','x','zaplaceno','uhrazeno','paid'].includes(s);
}
function bulkParseNumber(v){
  if(v==null || v==='') return null;
  if(typeof v === 'number') return v;
  const s = String(v).replace(/\s/g,'').replace(/[^\d,.\-]/g,'').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function bulkParseDate(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  const asNum = Number(s);
  if(!isNaN(asNum) && asNum > 20000 && asNum < 60000){
    const d = new Date(Date.UTC(1899,11,30) + asNum*86400000);
    return d.toISOString().slice(0,10);
  }
  return '';
}

async function handleBulkFile(file){
  if(!file) return;
  state.bulkImport.error = '';
  state.bulkImport.fileName = file.name;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    if(!rows.length){ state.bulkImport.error = 'Soubor neobsahuje žádná data.'; render(); return; }
    const headers = Object.keys(rows[0]);
    const mapping = {};
    headers.forEach(h=>{ mapping[h] = guessFieldForHeader(h); });
    state.bulkImport.headers = headers;
    state.bulkImport.rows = rows;
    state.bulkImport.mapping = mapping;
    state.bulkImport.step = 'mapping';
  }catch(err){
    console.error(err);
    state.bulkImport.error = 'Soubor se nepodařilo přečíst. Zkus ho uložit jako .xlsx nebo .csv a nahrát znovu.';
  }
  render();
}

function computeBulkPreview(){
  const bi = state.bulkImport;
  const mapping = bi.mapping;
  const fieldToHeader = {};
  Object.entries(mapping).forEach(([h,f])=>{ if(f) fieldToHeader[f]=h; });
  const get = (row, field) => fieldToHeader[field] ? row[fieldToHeader[field]] : undefined;

  const clientMap = new Map(); // key -> {data, isNew, existingId}
  const invoices = [];
  let skipped = 0;

  function keyFor(name, ico){
    const icoNorm = stripDiacritics(String(ico||'')).replace(/\D/g,'');
    if(icoNorm) return 'ico:'+icoNorm;
    const nameNorm = stripDiacritics(String(name||'')).toLowerCase().replace(/[^a-z0-9]/g,'');
    return nameNorm ? 'name:'+nameNorm : null;
  }

  bi.rows.forEach(row=>{
    const name = (get(row,'clientName')||'').toString().trim();
    const ico = (get(row,'clientIco')||'').toString().trim();
    const invNumber = (get(row,'invoiceNumber')||'').toString().trim();
    const total = bulkParseNumber(get(row,'total'));
    const isContactsMode = bi.mode==='contacts';
    if(isContactsMode ? !name && !ico : (!name && !invNumber && total==null)){ skipped++; return; }

    const key = keyFor(name, ico) || ('row:'+invoices.length+clientMap.size);
    let entry = clientMap.get(key);
    if(!entry){
      const existing = state.clients.find(c=>
        (ico && stripDiacritics(String(c.ico||'')).replace(/\D/g,'')===stripDiacritics(ico).replace(/\D/g,'') && c.ico) ||
        (!ico && c.name && stripDiacritics(c.name).toLowerCase()===stripDiacritics(name).toLowerCase())
      );
      entry = {
        key, name: name || (existing?existing.name:'') || 'Neznámý odběratel',
        ico, dic: (get(row,'clientDic')||'').toString().trim(),
        email: (get(row,'clientEmail')||'').toString().trim(),
        phone: (get(row,'clientPhone')||'').toString().trim(),
        street: (get(row,'clientStreet')||'').toString().trim(),
        zip: (get(row,'clientZip')||'').toString().trim(),
        city: (get(row,'clientCity')||'').toString().trim(),
        isExisting: !!existing, existingId: existing?existing.id:null,
        count: 0
      };
      clientMap.set(key, entry);
    }
    entry.count++;
    if(isContactsMode) return;

    const baseAmount = bulkParseNumber(get(row,'baseAmount'));
    const vatAmount = bulkParseNumber(get(row,'vatAmount'));
    let vatRate = bulkParseNumber(get(row,'vatRate'));
    let base = baseAmount;
    if(base==null && total!=null && vatRate!=null) base = total/(1+vatRate/100);
    if(base==null && total!=null && vatAmount!=null) base = total - vatAmount;
    if(base==null) base = total!=null ? total : 0;
    if(vatRate==null && base && vatAmount!=null) vatRate = Math.round((vatAmount/base)*100);
    if(vatRate==null) vatRate = 0;

    invoices.push({
      clientKey: key,
      number: invNumber || '',
      issueDate: bulkParseDate(get(row,'issueDate')),
      dueDate: bulkParseDate(get(row,'dueDate')),
      variableSymbol: (get(row,'variableSymbol')||'').toString().trim(),
      paid: bulkParseBoolean(get(row,'paid')),
      note: (get(row,'note')||'').toString().trim(),
      desc: (get(row,'description')||'').toString().trim() || 'Import',
      base: base||0, vat: vatRate||0
    });
  });

  bi.preview = {
    clients: Array.from(clientMap.values()),
    invoices, skipped,
    newClientsCount: Array.from(clientMap.values()).filter(c=>!c.isExisting).length,
    matchedClientsCount: Array.from(clientMap.values()).filter(c=>c.isExisting).length
  };
}

async function confirmBulkImport(){
  const bi = state.bulkImport;
  if(!bi || !bi.preview) return;
  const companyId = bi.companyId || (state.companies[0] && state.companies[0].id);
  const idForKey = {};
  for(const c of bi.preview.clients){
    if(c.isExisting){ idForKey[c.key] = c.existingId; continue; }
    const newClient = {
      id: uid(), name: c.name, ico: c.ico, dic: c.dic,
      contactEmail: c.email, contactPhone: c.phone,
      address: { street: c.street, number:'', zip: c.zip, city: c.city },
      createdAt: new Date().toISOString(), attachments: []
    };
    state.clients.push(newClient);
    idForKey[c.key] = newClient.id;
  }
  await saveClients();

  if(bi.mode!=='contacts'){
    for(const inv of bi.preview.invoices){
      const clientId = idForKey[inv.clientKey];
      state.invoices.push({
        id: uid(),
        number: inv.number || `IMP-${state.invoices.length+1}`,
        clientId, companyId,
        issueDate: inv.issueDate||'', dueDate: inv.dueDate||'', taxDate: inv.issueDate||'',
        variableSymbol: inv.variableSymbol||'', note: inv.note||'',
        items: [{desc: inv.desc, qty:1, unit:'ks', price: inv.base, vat: inv.vat}],
        paid: inv.paid, paidDate: inv.paid ? (inv.dueDate||inv.issueDate||todayISO()) : null,
        createdBy: state.currentUser, colorMode:'color', currency:'CZK', rounding:'none'
      });
    }
    await saveInvoices();
  }
  state.bulkImport = null;
  state.view = bi.mode==='contacts' ? 'clients' : 'invoices';
  render();
}

/* ---------- HELPERS ---------- */
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }

function afterRender(){
  // QR code render
  const spaydHolder = document.querySelector('[data-spayd]');
  if(spaydHolder){
    const val = spaydHolder.getAttribute('data-spayd');
    const target = document.getElementById('qr-holder');
    if(val && target && window.QRCode){
      target.innerHTML='';
      new QRCode(target, { text: val, width:110, height:110, correctLevel: QRCode.CorrectLevel.M });
    }
  }

  const invoiceForm = document.getElementById('invoice-form');
  if(invoiceForm){
    invoiceForm.addEventListener('submit', onSubmitInvoice);
  }
  setupInvoiceCompanySelect();
  setupOrderNumberSync();
  const companyForm = document.getElementById('company-form');
  if(companyForm){ companyForm.addEventListener('submit', onSubmitCompany); }
  const accountForm = document.getElementById('account-form');
  if(accountForm){ accountForm.addEventListener('submit', onSubmitAccount); }
  const colleagueForm = document.getElementById('colleague-form');
  if(colleagueForm){ colleagueForm.addEventListener('submit', onSubmitColleague); }
  const userCredsForm = document.getElementById('user-creds-form');
  if(userCredsForm){ userCredsForm.addEventListener('submit', onSubmitUserCreds); }

  setupAresCombo();
