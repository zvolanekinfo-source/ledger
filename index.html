    [/intern[íi]\s*k[oó]d|internal\s*code/, 'internalCode'],
    [/kategori/, 'category'],
    [/v[ýy]robce|manufacturer|brand/, 'manufacturer'],
    [/dodavatel|supplier/, 'supplierName'],
    [/jednotk|^unit$/, 'unit'],
    [/dph|vat/, 'vatRate'],
    [/n[áa]kupn[íi]/, 'purchasePrice'],
    [/prodejn[íi]|sale\s*price/, 'salePrice'],
    [/minim[áa]ln[íi]/, 'stockMin'],
    [/um[íi]st[ěe]n|regál|regal|police|pozice|location|shelf/, 'location'],
    [/sklad|stock|mnoz?stv[íi]|quantity/, 'stockCurrent'],
    [/expirac|expir|trvanliv/, 'expiryDate'],
    [/pozn[áa]mka|note/, 'note'],
    [/n[áa]zev|^name$|produkt/, 'name'],
  ];
  for(const [re,f] of rules){ if(re.test(h)) return f; }
  return '';
}
async function handleProductBulkFile(file){
  if(!file) return;
  state.bulkImport.error = '';
  state.bulkImport.fileName = file.name;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    if(!rows.length){ state.bulkImport.error = 'Soubor neobsahuje žádná data.'; render(); return; }
    const headers = Object.keys(rows[0]);
    const mapping = {};
    headers.forEach(h=>{ mapping[h] = guessProductFieldForHeader(h); });
    state.bulkImport.headers = headers; state.bulkImport.rows = rows; state.bulkImport.mapping = mapping;
    state.bulkImport.step = 'mapping';
  }catch(err){ state.bulkImport.error = 'Soubor se nepodařilo přečíst. Zkus .xlsx nebo .csv.'; }
  render();
}
function computeProductBulkPreview(){
  const bi = state.bulkImport;
  const fieldToHeader = {};
  Object.entries(bi.mapping).forEach(([h,f])=>{ if(f) fieldToHeader[f]=h; });
  const get = (row,f) => fieldToHeader[f] ? row[fieldToHeader[f]] : undefined;
  const items = []; let skipped = 0; let dupCount = 0;
  const seenEans = new Set(state.products.map(p=>p.ean).filter(Boolean));
  const seenNumbers = new Set(state.products.map(p=>p.number).filter(Boolean));
  bi.rows.forEach(row=>{
    const name = (get(row,'name')||'').toString().trim();
    const ean = (get(row,'ean')||'').toString().trim();
    if(!name && !ean){ skipped++; return; }
    let isDup = false;
    if(ean && seenEans.has(ean)) isDup = true;
    const number = (get(row,'number')||'').toString().trim();
    if(number && seenNumbers.has(number)) isDup = true;
    if(isDup) dupCount++;
    items.push({
      name: name || '(bez názvu)', ean, number, internalCode: (get(row,'internalCode')||'').toString().trim(),
      category: (get(row,'category')||'').toString().trim(), manufacturer: (get(row,'manufacturer')||'').toString().trim(),
      supplierName: (get(row,'supplierName')||'').toString().trim(), unit: (get(row,'unit')||'ks').toString().trim()||'ks',
      vatRate: bulkParseNumber(get(row,'vatRate'))||0, purchasePrice: bulkParseNumber(get(row,'purchasePrice'))||0,
      salePrice: bulkParseNumber(get(row,'salePrice'))||0, stockCurrent: bulkParseNumber(get(row,'stockCurrent'))||0,
      stockMin: bulkParseNumber(get(row,'stockMin'))||0, location: (get(row,'location')||'').toString().trim(), expiryDate: bulkParseDate(get(row,'expiryDate')),
      note: (get(row,'note')||'').toString().trim(), isDup
    });
    if(ean) seenEans.add(ean);
    if(number) seenNumbers.add(number);
  });
  bi.preview = { items, skipped, dupCount };
}
async function confirmProductBulkImport(){
  const bi = state.bulkImport;
  if(!bi || !bi.preview) return;
  for(const it of bi.preview.items){
    if(it.isDup) continue; // duplicity přeskočíme, ať nevzniknou konflikty
    let supplierId = '';
    if(it.supplierName){
      let sup = state.suppliers.find(s=>stripDiacritics(s.name).toLowerCase()===stripDiacritics(it.supplierName).toLowerCase());
      if(!sup){ sup = { ...blankSupplier(), name: it.supplierName }; state.suppliers.push(sup); }
      supplierId = sup.id;
    }
    const number = it.number || generateUniqueProductNumber();
    state.products.push({
      ...blankProduct(), id: uid(), number, ean: it.ean, internalCode: it.internalCode,
      name: it.name, category: it.category, manufacturer: it.manufacturer, supplierId,
      unit: it.unit, vatRate: it.vatRate, purchasePrice: it.purchasePrice, salePrice: it.salePrice,
      stockCurrent: it.stockCurrent, stockMin: it.stockMin, location: it.location, expiryDate: it.expiryDate, note: it.note,
      movements: it.stockCurrent ? [{id:uid(), type:'počáteční stav', qty:it.stockCurrent, reason:'Import', note:'', date:new Date().toISOString(), user:state.currentUser, resultingStock:it.stockCurrent}] : []
    });
  }
  await saveSuppliers();
  await saveProducts();
  await saveProductSettings();
  state.bulkImport = null;
  state.view = 'products';
  render();
}
function exportProductsCsv(format){
  const rows = state.products.map(p=>({
    Název: p.name, EAN: p.ean, 'Produktové číslo': p.number, 'Interní kód': p.internalCode,
    Kategorie: p.category, Výrobce: p.manufacturer, Dodavatel: (supplierById(p.supplierId)||{}).name||'',
    Jednotka: p.unit, 'DPH %': p.vatRate, 'Nákupní cena': p.purchasePrice, 'Prodejní cena': p.salePrice,
    Sklad: p.stockCurrent, Minimum: p.stockMin, Umístění: p.location||'', Expirace: p.expiryDate, Poznámka: p.note
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Produkty');
  XLSX.writeFile(wb, `produkty-export.${format==='csv'?'csv':'xlsx'}`, { bookType: format==='csv'?'csv':'xlsx' });
}

function productsKeyHandler(e){
  if(state.view!=='products') return;
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(e.key==='n' || e.key==='N'){ state.view='product-form'; state.editingProductId=null; state.newProductDraftId=null; render(); }
  else if(e.key==='Delete' || e.key==='Backspace'){
    if(state.selectedProductIds.size){
      e.preventDefault();
      if(confirm(`Smazat ${state.selectedProductIds.size} vybraných produktů?`)){
        state.products = state.products.filter(p=>!state.selectedProductIds.has(p.id));
        saveProducts();
        state.selectedProductIds.clear();
        render();
      }
    }
  } else if(e.key==='Escape'){ state.selectedProductIds.clear(); closeProductContextMenu(); render(); }
}
document.addEventListener('keydown', productsKeyHandler);

/* ---------- ARES (vyhledávání firem podle IČO / názvu) ----------
   Veřejné, bezplatné API Ministerstva financí ČR, bez nutnosti klíče.
   https://ares.gov.cz/swagger-ui/ */
const ARES_BASE = 'https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty';

function blankAddr(){ return {street:'',number:'',zip:'',city:''}; }
function addrGet(addr, key){
  if(!addr) return '';
  if(typeof addr === 'string') return key==='street' ? addr : '';
  return addr[key] || '';
}
function formatAddress(addr){
  if(!addr) return '';
  if(typeof addr === 'string') return addr;
  const line1 = [addr.street, addr.number].filter(Boolean).join(' ');
  const line2 = [addr.zip, addr.city].filter(Boolean).join(' ');
  return [line1, line2].filter(Boolean).join('\n');
}
function aresAddressToParts(sidlo){
  if(!sidlo) return blankAddr();
  const street = sidlo.nazevUlice || sidlo.nazevCastiObce || '';
  const number = [sidlo.cisloDomovni, sidlo.cisloOrientacni].filter(Boolean).join('/');
  return { street, number, zip: sidlo.psc?String(sidlo.psc):'', city: sidlo.nazevObce || '' };
}
function addressFieldGroup(prefix, label, addr){
  return `
    <div class="field">
      <label>${label}</label>
      <div class="field-row" style="grid-template-columns:2fr 1fr;margin-bottom:6px;">
        <div class="field combo-field">
          <input name="${prefix}-street" id="${prefix}-street" placeholder="Ulice" autocomplete="off" value="${escapeAttr(addrGet(addr,'street'))}">
          <div class="combo-list" id="${prefix}-street-list"></div>
        </div>
        <div class="field"><input name="${prefix}-number" id="${prefix}-number" placeholder="Číslo" value="${escapeAttr(addrGet(addr,'number'))}"></div>
      </div>
      <div class="field-row" style="grid-template-columns:1fr 2fr;">
        <div class="field"><input name="${prefix}-zip" id="${prefix}-zip" placeholder="PSČ" value="${escapeAttr(addrGet(addr,'zip'))}"></div>
        <div class="field combo-field"><input name="${prefix}-city" id="${prefix}-city" placeholder="Město" autocomplete="off" value="${escapeAttr(addrGet(addr,'city'))}">
          <div class="combo-list" id="${prefix}-city-list"></div>
        </div>
      </div>
      <p style="font-size:11px;color:var(--ink-soft);margin:4px 0 0 0;">Začni psát ulici nebo město — ledgers nabídne shody a doplní zbytek adresy.</p>
    </div>
  `;
}
function gatherAddrField(fd, prefix){
  return {
    street: fd.get(prefix+'-street')||'', number: fd.get(prefix+'-number')||'',
    zip: fd.get(prefix+'-zip')||'', city: fd.get(prefix+'-city')||''
  };
}

function aresAddressToText(sidlo){
  if(!sidlo) return '';
  if(sidlo.textovaAdresa) return sidlo.textovaAdresa;
  const parts = [];
  if(sidlo.nazevUlice) parts.push(sidlo.nazevUlice + (sidlo.cisloDomovni?' '+sidlo.cisloDomovni:'') + (sidlo.cisloOrientacni?'/'+sidlo.cisloOrientacni:''));
  if(sidlo.psc && sidlo.nazevObce) parts.push(`${sidlo.psc} ${sidlo.nazevObce}`);
  return parts.join(', ');
}

async function aresLookupByIco(ico){
  const res = await fetch(`${ARES_BASE}/${encodeURIComponent(ico)}`);
  if(!res.ok) throw new Error('Subjekt s tímto IČO nebyl v ARES nalezen.');
  return await res.json();
}

async function aresSearchByName(name){
  const res = await fetch(`${ARES_BASE}/vyhledat`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ obchodniJmeno: name, pocet: 10, start: 0 })
  });
  if(!res.ok) throw new Error('Vyhledávání v ARES selhalo.');
  const data = await res.json();
  return data.ekonomickeSubjekty || [];
}

function setupAresCombo(ids){
  ids = ids || { name:'client-name', list:'client-name-list', status:'ares-status', ico:'client-ico', dic:'client-dic', addrPrefix:'client-address' };
  const input = document.getElementById(ids.name);
  const list = document.getElementById(ids.list);
  const status = document.getElementById(ids.status);
  if(!input || !list) return;
  let debounceTimer = null;

  function setStatus(msg, isError){
    if(!status) return;
    status.textContent = msg || '';
    status.style.color = isError ? 'var(--red)' : 'var(--ink-soft)';
  }

  async function runSearch(q){
    const trimmed = q.trim();
    if(trimmed.length < 3){ list.classList.remove('open'); return; }
    const isIco = /^\d{6,8}$/.test(trimmed);
    list.innerHTML = `<div class="combo-empty">Hledám v ARES…</div>`;
    list.classList.add('open');
    try{
      if(isIco){
        const entity = await aresLookupByIco(trimmed);
        list.innerHTML = `
          <div class="combo-item" data-ico="${escapeAttr(entity.ico)}">
            <div>${escapeHtml(entity.obchodniJmeno||'')}</div>
            <div class="sub">IČO: ${escapeHtml(entity.ico)} · ${escapeHtml(aresAddressToText(entity.sidlo))}</div>
          </div>`;
        list.dataset.cache = JSON.stringify([entity]);
      } else {
        const results = await aresSearchByName(trimmed);
        if(!results.length){
          list.innerHTML = `<div class="combo-empty">V ARES nic neodpovídá. Zkus zadat přesnější název nebo IČO.</div>`;
          list.dataset.cache = '[]';
        } else {
          list.innerHTML = results.map((r,i)=>`
            <div class="combo-item" data-idx="${i}">
              <div>${escapeHtml(r.obchodniJmeno||'')}</div>
              <div class="sub">IČO: ${escapeHtml(r.ico||'')} · ${escapeHtml(aresAddressToText(r.sidlo))}</div>
            </div>`).join('');
          list.dataset.cache = JSON.stringify(results);
        }
      }
    }catch(err){
      list.innerHTML = `<div class="combo-empty">Vyhledávání se nepovedlo. Zkus to prosím znovu.</div>`;
      list.dataset.cache = '[]';
    }
  }

  input.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    setStatus('');
    debounceTimer = setTimeout(()=> runSearch(input.value), 450);
  });
  input.addEventListener('focus', ()=>{ if(input.value.trim().length>=3) runSearch(input.value); });

  list.addEventListener('mousedown', async (e)=>{
    const item = e.target.closest('.combo-item[data-ico], .combo-item[data-idx]');
    if(!item) return;
    e.preventDefault();
    let cache = [];
    try{ cache = JSON.parse(list.dataset.cache||'[]'); }catch(err){}
    const entity = item.hasAttribute('data-idx') ? cache[parseInt(item.getAttribute('data-idx'))] : cache[0];
    if(entity){
      applyAresEntityToForm(entity, ids);
      input.value = entity.obchodniJmeno || '';
      setStatus('Údaje doplněny z ARES — zkontroluj je a případně uprav.');
    }
    list.classList.remove('open');
  });

  document.addEventListener('click', (e)=>{
    if(e.target!==input && !list.contains(e.target)) list.classList.remove('open');
  });
}

/* ---------- Živé našeptávání adresy + PSČ (OpenStreetMap / Nominatim, zdarma bez klíče) ---------- */
function formatOsmAddress(item){
  const a = item.address || {};
  const street = a.road || a.pedestrian || a.footway || '';
  const houseNum = a.house_number || '';
  const streetLine = [street, houseNum].filter(Boolean).join(' ');
  const city = a.city || a.town || a.village || a.municipality || a.suburb || '';
  const psc = a.postcode || '';
  const cityLine = [psc, city].filter(Boolean).join(' ');
  return [streetLine, cityLine].filter(Boolean).join(', ') || item.display_name;
}

async function osmSearchAddresses(q){
  const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=cz&limit=5&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { 'Accept':'application/json' } });
  if(!res.ok) throw new Error('Vyhledávání adresy selhalo.');
  return await res.json();
}

async function osmSearchCities(q){
  const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=cz&limit=6&city=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { 'Accept':'application/json' } });
  if(!res.ok) throw new Error('Vyhledávání města selhalo.');
  return await res.json();
}
function cityLabel(item){
  const a = item.address || {};
  return a.city || a.town || a.village || a.municipality || (item.display_name||'').split(',')[0] || '';
}

function setupAddressGroupAutocomplete(prefix){
  const streetInput = document.getElementById(prefix+'-street');
  const list = document.getElementById(prefix+'-street-list');
  const numberInput = document.getElementById(prefix+'-number');
  const zipInput = document.getElementById(prefix+'-zip');
  const cityInput = document.getElementById(prefix+'-city');
  if(!streetInput || !list) return;
  let debounceTimer = null;
  let cache = [];

  function renderList(items){
    cache = items;
    if(!items.length){
      list.classList.remove('open');
      list.innerHTML = '';
      return;
    }
    list.innerHTML = items.map((item,i)=>`
      <div class="combo-item" data-idx="${i}">${escapeHtml(formatOsmAddress(item))}</div>
    `).join('');
    list.classList.add('open');
  }

  streetInput.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    const q = streetInput.value.trim();
    if(q.length < 3){ list.classList.remove('open'); return; }
    const queryStr = cityInput && cityInput.value ? `${q}, ${cityInput.value}` : q;
    debounceTimer = setTimeout(async ()=>{
      try{ renderList(await osmSearchAddresses(queryStr)); }
      catch(err){ list.classList.remove('open'); }
    }, 450);
  });

  list.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.combo-item');
    if(!item) return;
    e.preventDefault();
    const picked = cache[parseInt(item.getAttribute('data-idx'))];
    if(picked){
      const a = picked.address || {};
      streetInput.value = a.road || a.pedestrian || a.footway || streetInput.value;
      if(numberInput) numberInput.value = a.house_number || numberInput.value;
      if(zipInput) zipInput.value = a.postcode || zipInput.value;
      if(cityInput) cityInput.value = a.city||a.town||a.village||a.municipality||a.suburb || cityInput.value;
    }
    list.classList.remove('open');
  });

  document.addEventListener('click', (e)=>{
    if(e.target!==streetInput && !list.contains(e.target)) list.classList.remove('open');
  });

  if(zipInput){
    let zipDebounce = null;
    zipInput.addEventListener('input', ()=>{
      clearTimeout(zipDebounce);
      const digits = zipInput.value.replace(/\s+/g,'');
      if(!/^\d{5}$/.test(digits)) return;
      zipDebounce = setTimeout(async ()=>{
        try{
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&country=cz&postalcode=${digits}&limit=1`, { headers:{'Accept':'application/json'} });
          const rows = await res.json();
          if(rows && rows[0]){
            const a = rows[0].address || {};
            const foundCity = a.city || a.town || a.village || a.municipality || (rows[0].display_name||'').split(',')[0] || '';
            if(cityInput && foundCity && !cityInput.value.trim()) cityInput.value = foundCity;
          }
        }catch(err){}
      }, 500);
    });
  }

  const cityList = document.getElementById(prefix+'-city-list');
  if(cityInput && cityList){
    let cityDebounce = null, cityCache = [];

    function renderCityList(items){
      cityCache = items;
      if(!items.length){ cityList.classList.remove('open'); cityList.innerHTML=''; return; }
      cityList.innerHTML = items.map((item,i)=>{
        const name = cityLabel(item);
        const psc = (item.address||{}).postcode || '';
        return `<div class="combo-item" data-idx="${i}">${escapeHtml(name)}${psc?` <span class="sub">PSČ ${escapeHtml(psc)}</span>`:''}</div>`;
      }).join('');
      cityList.classList.add('open');
    }

    cityInput.addEventListener('input', ()=>{
      clearTimeout(cityDebounce);
      const q = cityInput.value.trim();
      if(q.length < 2){ cityList.classList.remove('open'); return; }
      cityDebounce = setTimeout(async ()=>{
        try{ renderCityList(await osmSearchCities(q)); }
        catch(err){ cityList.classList.remove('open'); }
      }, 350);
    });

    cityList.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.combo-item');
      if(!item) return;
      e.preventDefault();
      const picked = cityCache[parseInt(item.getAttribute('data-idx'))];
      if(picked){
        const a = picked.address || {};
        cityInput.value = cityLabel(picked) || cityInput.value;
        if(zipInput && a.postcode) zipInput.value = a.postcode;
      }
      cityList.classList.remove('open');
    });

    document.addEventListener('click', (e)=>{
      if(e.target!==cityInput && !cityList.contains(e.target)) cityList.classList.remove('open');
    });
  }
}

/* ---------- PŘÍLOHY ODBĚRATELŮ (Supabase Storage, bucket "client-files") ----------
   Vyžaduje jednorázové nastavení bucketu + RLS, viz supabase-setup-attachments.sql */
const ATTACHMENTS_BUCKET = 'client-files';

async function uploadClientFile(clientId, file){
  await ensureFreshSession();
  const safeName = file.name.replace(/[^\w.\-]+/g,'_');
  const path = `${clientId}/${Date.now()}_${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENTS_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(`Nahrání se nepovedlo: ${text}`);
  }
  return { name: file.name, path, uploaded_at: new Date().toISOString(), size: file.size };
}

async function deleteClientFile(path){
  await ensureFreshSession();
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENTS_BUCKET}`, {
    method: 'DELETE',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ prefixes: [path] })
  });
  if(!res.ok) throw new Error('Mazání souboru selhalo.');
}

async function signAttachmentUrl(path){
  await ensureFreshSession();
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${ATTACHMENTS_BUCKET}/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ expiresIn: 120 })
  });
  if(!res.ok) throw new Error('Nepovedlo se vytvořit odkaz na soubor.');
  const data = await res.json();
  return SUPABASE_URL + '/storage/v1' + data.signedURL;
}

function attachmentEntityContext(){
  const box = document.getElementById('attachments-box');
  const type = box ? (box.getAttribute('data-entity-type')||'client') : 'client';
  const entityId = box ? box.getAttribute('data-entity-id') : null;
  const entity = type==='supplier' ? supplierById(entityId) : clientById(entityId);
  return { type, entityId, entity };
}

function setupAttachmentUpload(){
  const input = document.getElementById('attachment-file-input');
  const box = document.getElementById('attachments-box');
  const status = document.getElementById('attachment-status');
  if(!input || !box) return;
  const { type, entityId } = attachmentEntityContext();
  input.addEventListener('change', async ()=>{
    const file = input.files[0];
    if(!file) return;
    if(status) status.textContent = 'Nahrávám…';
    try{
      const meta = await uploadClientFile(entityId, file);
      const entity = type==='supplier' ? supplierById(entityId) : clientById(entityId);
      if(entity){
        entity.attachments = entity.attachments || [];
        entity.attachments.push(meta);
        if(type==='supplier') await saveSuppliers(); else await saveClients();
      } else if(type==='client' && entityId === state.newClientDraftId){
        state.newClientDraftAttachments.push(meta);
      } else if(type==='supplier' && entityId === state.newSupplierDraftId){
        state.newSupplierDraftAttachments.push(meta);
      }
      if(status) status.textContent = '';
      render();
    }catch(err){
      if(status) status.textContent = 'Nahrání se nepovedlo, zkus to prosím znovu.';
    }
  });
}

function setupInvoiceCompanySelect(){
  const select = document.getElementById('inv-company-select');

  const numberInput = document.querySelector('#invoice-form input[name="number"]');
  if(!select || !box) return;

    const co = companyById(companyId) || state.companies[0];
    const vatPayerNow = co.vatPayer !== false;
    const table = document.querySelector('.items-table');
    const note = document.getElementById('vat-off-note');
    if(table) table.classList.toggle('no-vat', !vatPayerNow);

      state.formItems.forEach(it=>{ it.vat = 0; });
      document.querySelectorAll('#items-body input[data-field="vat"]').forEach(inp=>{ inp.value = 0; });
      const totalsBox = document.getElementById('totals-box');
      if(totalsBox) totalsBox.innerHTML = renderTotalsBox(false);
      document.querySelectorAll('#items-body tr').forEach((row,idx)=>{
        const it = state.formItems[idx];
        const totalCell = row.querySelector('.col-total');

      });

      const totalsBox = document.getElementById('totals-box');

function setupClientCombo(){
  const input = document.getElementById('client-combo-input');
  const hidden = document.getElementById('client-combo-value');
  const list = document.getElementById('client-combo-list');
  const detailBox = document.getElementById('client-detail-box');
  if(!input || !hidden || !list) return;

  function fillDetailBox(c){
    if(!detailBox) return;
    if(!c){ detailBox.style.display='none'; return; }
    detailBox.style.display='';
    const addr = document.getElementById('client-detail-address');
    const ico = document.getElementById('client-detail-ico');
    const dic = document.getElementById('client-detail-dic');
    const email = document.getElementById('client-detail-email');
    const phone = document.getElementById('client-detail-phone');
    if(addr) addr.textContent = formatAddress(c.address) || '—';
    if(ico) ico.value = c.ico||'';
    if(dic) dic.value = c.dic||'';
    if(email) email.value = c.contactEmail||'';
    if(phone) phone.value = c.contactPhone||'';
  }

  function renderList(query){
    const q = stripDiacritics(query||'').toLowerCase().trim();
    const matches = state.clients.filter(c=>{
      if(!q) return true;
      return stripDiacritics(`${c.name} ${c.ico||''}`).toLowerCase().includes(q);
    }).slice(0,30);
    if(!matches.length){
      list.innerHTML = `<div class="combo-empty">Žádný odběratel neodpovídá. <span style="text-decoration:underline;cursor:pointer;" data-action="new-client">Přidat nového?</span></div>`;
    } else {
      list.innerHTML = matches.map(c=>`

          <div>${escapeHtml(c.name)}</div>
          ${c.ico?`<div class="sub">IČO: ${escapeHtml(c.ico)}</div>`:''}
        </div>
      `).join('');
    }
    list.classList.add('open');
  }

  input.addEventListener('focus', ()=> renderList(input.value));
  input.addEventListener('input', ()=>{ hidden.value=''; fillDetailBox(null); renderList(input.value); });
  list.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.combo-item');
    if(!item) return;
    const c = clientById(item.getAttribute('data-id'));
    if(c){ input.value = c.name; hidden.value = c.id; fillDetailBox(c); }
    list.classList.remove('open');
  });
  document.addEventListener('click', (e)=>{
    if(e.target!==input && !list.contains(e.target)) list.classList.remove('open');
  });
}

function setupProductPicker(){

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');

  if(action==='auth-switch'){ state.authView = el.getAttribute('data-view'); state.authError=''; render(); }
  else if(action==='logout'){
    await signOutRemote();
    persistSession(null);
    state.currentUser=null; state.currentUserId=null; state.users=[];
    state.companies=[]; state.clients=[]; state.invoices=[];
    state.authView='login'; state.view='dashboard';
    render();
  }
  else if(action==='nav'){ state.view = el.getAttribute('data-view'); state.editingInvoiceId=null; state.editingClientId=null; state.viewingClientId=null; state.newClientDraftId=null; state.newClientDraftAttachments=[]; state.editingCompanyId=null; state.newCompanyDraftId=null; state.newCompanyDraft={logo:'',signature:'',stamp:''}; state.companyNotice=''; state.formItems=[]; state.formCompanyId=null; state.selectedInvoiceIds.clear(); state.selectedClientIds.clear(); state.editingSupplierId=null; state.viewingSupplierId=null; state.newSupplierDraftId=null; state.newSupplierDraftAttachments=[]; state.editingProductId=null; state.newProductDraftId=null; state.currentProductDraftPhoto=''; state.eanLookupStatus=''; state.selectedProductIds.clear(); closeProductContextMenu(); state.productColsPanelOpen=false; render(); }
  else if(action==='new-invoice'){ state.view='invoice-form'; state.editingInvoiceId=null; state.formItems=[]; state.formCompanyId=null; render(); }
  else if(action==='toggle-invoice-select'){
    const cid = el.getAttribute('data-id');
    if(state.selectedInvoiceIds.has(cid)) state.selectedInvoiceIds.delete(cid); else state.selectedInvoiceIds.add(cid);
    render();
  }
  else if(action==='toggle-select-all-invoices'){
    const checked = el.checked;
    document.querySelectorAll('#invoices-tbody input[data-action="toggle-invoice-select"]').forEach(cb=>{
      const cid = cb.getAttribute('data-id');
      if(checked) state.selectedInvoiceIds.add(cid); else state.selectedInvoiceIds.delete(cid);
    });
    render();
  }
  else if(action==='bulk-clear-selection'){ state.selectedInvoiceIds.clear(); state.selectedClientIds.clear(); render(); }
  else if(action==='bulk-mark-paid' || action==='bulk-mark-unpaid'){
    const paid = action==='bulk-mark-paid';
    state.invoices.forEach(inv=>{
      if(state.selectedInvoiceIds.has(inv.id)){ inv.paid = paid; inv.paidDate = paid ? (inv.paidDate||todayISO()) : null; }
    });
    try{ await saveInvoices(); }catch(err){ alert('Uložení se nepovedlo, zkus to prosím znovu.'); }
    state.selectedInvoiceIds.clear();
    render();
  }
  else if(action==='bulk-delete-invoices'){
    const n = state.selectedInvoiceIds.size;
    if(!confirm(`Opravdu smazat ${n} vybraných faktur?`)) return;
    state.invoices = state.invoices.filter(inv=>!state.selectedInvoiceIds.has(inv.id));
    try{ await saveInvoices(); }catch(err){ alert('Smazání se nepovedlo, zkus to prosím znovu.'); }
    state.selectedInvoiceIds.clear();
    render();
  }
  else if(action==='toggle-client-select'){
    const cid = el.getAttribute('data-id');
    if(state.selectedClientIds.has(cid)) state.selectedClientIds.delete(cid); else state.selectedClientIds.add(cid);
    render();
  }
  else if(action==='toggle-select-all-clients'){
    const checked = el.checked;
    document.querySelectorAll('#clients-tbody input[data-action="toggle-client-select"]').forEach(cb=>{
      const cid = cb.getAttribute('data-id');
      if(checked) state.selectedClientIds.add(cid); else state.selectedClientIds.delete(cid);
    });
    render();
  }
  else if(action==='bulk-delete-clients'){
    const n = state.selectedClientIds.size;
    if(!confirm(`Opravdu smazat ${n} vybraných odběratelů? Faktury, které na ně odkazují, zůstanou zachovány.`)) return;
    state.clients = state.clients.filter(c=>!state.selectedClientIds.has(c.id));
    try{ await saveClients(); }catch(err){ alert('Smazání se nepovedlo, zkus to prosím znovu.'); }
    state.selectedClientIds.clear();
    render();
  }
  else if(action==='open-attachment'){
    el.textContent = '…';
    try{
      const url = await signAttachmentUrl(el.getAttribute('data-path'));
      window.open(url, '_blank');
    }catch(err){ alert('Soubor se nepovedlo otevřít, zkus to prosím znovu.'); }
    finally{ el.textContent = 'Otevřít'; }
  }
  else if(action==='note-attachment'){
    const path = el.getAttribute('data-path');
    const current = el.getAttribute('data-note') || '';
    const newNote = prompt('Poznámka k souboru:', current);
    if(newNote===null) return;
    const { type, entityId, entity } = attachmentEntityContext();
    if(entity){
      const f = (entity.attachments||[]).find(x=>x.path===path);
      if(f){ f.note = newNote.trim(); if(type==='supplier') await saveSuppliers(); else await saveClients(); }
    } else if(type==='client' && entityId === state.newClientDraftId){
      const f = state.newClientDraftAttachments.find(x=>x.path===path);
      if(f) f.note = newNote.trim();
    } else if(type==='supplier' && entityId === state.newSupplierDraftId){
      const f = state.newSupplierDraftAttachments.find(x=>x.path===path);
      if(f) f.note = newNote.trim();
    }
    render();
  }
  else if(action==='delete-attachment'){
    const path = el.getAttribute('data-path');
    const name = el.getAttribute('data-name');
    if(!confirm(`Smazat soubor „${name}“?`)) return;
    try{
      await deleteClientFile(path);
      const { type, entityId, entity } = attachmentEntityContext();
      if(entity){ entity.attachments = (entity.attachments||[]).filter(f=>f.path!==path); if(type==='supplier') await saveSuppliers(); else await saveClients(); }
      else if(type==='client' && entityId === state.newClientDraftId){ state.newClientDraftAttachments = state.newClientDraftAttachments.filter(f=>f.path!==path); }

async function downloadInvoicePdf(id, triggerEl){
  const inv = state.invoices.find(i=>i.id===id);
  const sheet = document.getElementById('invoice-sheet');
  if(!inv || !sheet || !window.html2pdf){ window.print(); return; }
  const originalLabel = triggerEl ? triggerEl.textContent : '';
  if(triggerEl){ triggerEl.textContent='Generuji…'; triggerEl.disabled = true; }
  try{
    await html2pdf().set({
      margin: 0,
      filename: `Faktura-${(inv.number||'doklad').replace(/[^\w.-]+/g,'_')}.pdf`,
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF: { unit:'pt', format:'a4', orientation:'portrait' },
      pagebreak: { mode:['avoid-all'] }
    }).from(sheet).save();
  } catch(err){
    console.error(err);
    alert('Stažení PDF se nepovedlo, zkus to prosím znovu.');
  } finally {
    if(triggerEl){ triggerEl.textContent = originalLabel || 'Stáhnout PDF'; triggerEl.disabled = false; }
  }
}

async function onSubmitInvoice(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const id = fd.get('id');
  const clientId = fd.get('clientId');
  if(!clientId || !clientById(clientId)){
    alert('Vyber odběratele ze seznamu (napiš jeho jméno a klikni na něj v nabídce).');
    return;
  }
  // Update the client's own record with any edits made inline on this invoice
  const clientIdx = state.clients.findIndex(c=>c.id===clientId);
  if(clientIdx > -1){
    state.clients[clientIdx] = {
      ...state.clients[clientIdx],
      ico: fd.get('clientIco') ?? state.clients[clientIdx].ico,
      dic: fd.get('clientDic') ?? state.clients[clientIdx].dic,
      contactEmail: fd.get('clientEmail') ?? state.clients[clientIdx].contactEmail,
      contactPhone: fd.get('clientPhone') ?? state.clients[clientIdx].contactPhone
    };
    await saveClients();
  }
  let companyId = fd.get('companyId');
  if(companyId === '__new__'){
    const name = (fd.get('newCoName')||'').trim();
    if(!name){ alert('Zadej alespoň název nové firmy.'); return; }
    const newCompany = {
      id: uid(), name, address: fd.get('newCoAddress')||'', ico: fd.get('newCoIco')||'', dic: fd.get('newCoDic')||'',
      email: fd.get('newCoEmail')||'', phone: fd.get('newCoPhone')||'', account: fd.get('newCoAccount')||'', iban: fd.get('newCoIban')||'',
      tagline:'', bankName:'', swift:'', website:'', registration:'',
      prefix: new Date().getFullYear().toString(), nextNumber:1, defaultDueDays:14, defaultNote:'Děkujeme za spolupráci.',
      invoiceTerms:'Fakturovaná částka bude odečtena z uvedeného účtu. V případě prodlení s úhradou je odběratel povinen uhradit úrok z prodlení dle platné legislativy.',
      defaultPaymentMethod:'Bankovním převodem', invoiceAccent:'#1F5C4D',
      logo:'', signature:'', stamp:'', showLogo:true, showStamp:true, showSignature:true, showQr:true
    };
    state.companies.push(newCompany);
    companyId = newCompany.id;
  }
  const items = state.formItems.filter(it=> (it.desc||'').trim()!=='' || (it.qty||0)!==0 );
  const invoice = {
    id: id || uid(),
    number: fd.get('number'),
    clientId: clientId,
    companyId: companyId,
    issueDate: fd.get('issueDate'),
    dueDate: fd.get('dueDate'),
    taxDate: fd.get('taxDate'),
    variableSymbol: fd.get('variableSymbol'),
    constantSymbol: fd.get('constantSymbol'),
    orderNumber: fd.get('orderNumber'),
    currency: fd.get('currency') || 'CZK',
    discountType: fd.get('discountType') || 'none',
    discountValue: parseFloat(fd.get('discountValue'))||0,
    rounding: fd.get('rounding') || 'none',
    paymentMethod: fd.get('paymentMethod') || 'Bankovním převodem',
    includeStamp: fd.get('includeStamp')==='1',
    colorMode: fd.get('colorMode')==='bw' ? 'bw' : 'color',
    includeSignature: fd.get('includeSignature')==='1',
    includeQr: fd.get('includeQr')==='1',
    note: fd.get('note'),
    items: items,
    paid: fd.get('paid')==='1',
    paidDate: fd.get('paidDate')||null,
    createdBy: id ? (state.invoices.find(i=>i.id===id)||{}).createdBy || state.currentUser : state.currentUser
  };
  const oldItemsForStock = id ? ((state.invoices.find(i=>i.id===id)||{}).items || []) : [];
  try{
    await applyStockForInvoiceChange(oldItemsForStock, invoice.items, 'Faktura '+invoice.number);
  }catch(err){
    if(err && err.message==='cancelled') return; // uživatel zrušil kvůli zápornému skladu
  }
  if(id){
    const idx = state.invoices.findIndex(i=>i.id===id);
    state.invoices[idx] = invoice;
  } else {
    state.invoices.push(invoice);
    const issuingCo = companyById(companyId);
    if(issuingCo) issuingCo.nextNumber = (issuingCo.nextNumber||1) + 1;
  }
  await saveCompanies();
  await saveInvoices();
  state.formItems = [];
  state.formCompanyId = null;
  state.previewId = invoice.id;
  state.view = 'invoice-preview';
  render();
}

async function onSubmitAccount(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  const password2 = fd.get('password2');
  if(password || password2){
    if(password.length<8){ state.accountError='Nové heslo musí mít aspoň 8 znaků.'; render(); return; }
    if(password!==password2){ state.accountError='Zadaná hesla se neshodují.'; render(); return; }
  }
  const fields = {};
  const me = state.users.find(u=>u.id===state.currentUserId);
  if(email && me && email!==me.email) fields.email = email;
  if(password) fields.password = password;
  if(!Object.keys(fields).length){ state.accountError='Nezměnil jsi nic k uložení.'; render(); return; }
  try{
    await updateOwnAuthUser(fields);
    if(fields.email && me){
      try{ await updateTeamMember(me.id, { email: fields.email }); await loadTeam(); }catch(err){}
    }
    state.accountError='';
    state.accountNotice = fields.email
      ? 'Uloženo. Pokud se měnil e-mail, Supabase ti pošle potvrzovací odkaz — do té doby se přihlašuj starým e-mailem.'
      : 'Heslo bylo změněno.';
    render();
  }catch(err){
    state.accountError = err.message || 'Změna se nepovedla.';
    render();
  }
}

async function onSubmitCompany(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const id = fd.get('id');
  const existing = id ? companyById(id) : null;
  const isDraft = !existing && id === state.newCompanyDraftId;
  const co = {
    id: id || uid(),
    name: fd.get('name'), tagline: fd.get('tagline'), address: gatherAddrField(fd,'co-address'), ico: fd.get('ico'), dic: fd.get('dic'),
    email: fd.get('email'), phone: fd.get('phone'), website: fd.get('website'),
    showRegistration: fd.get('showRegistration')==='1',
    regDate: fd.get('regDate'), regCourt: fd.get('regCourt'), regSection: fd.get('regSection'), regInsert: fd.get('regInsert'),
    account: fd.get('account'), bankName: fd.get('bankName'), iban: fd.get('iban'), swift: fd.get('swift'),
    vatPayer: fd.get('vatPayer')==='1',
    prefix: fd.get('prefix'), nextNumber: parseInt(fd.get('nextNumber'))||1,
    defaultDueDays: parseInt(fd.get('defaultDueDays'))||14, defaultNote: fd.get('defaultNote'),
    invoiceTerms: fd.get('invoiceTerms'), defaultPaymentMethod: fd.get('defaultPaymentMethod'),
    showLogo: fd.get('showLogo')==='1', showStamp: fd.get('showStamp')==='1',
    showSignature: fd.get('showSignature')==='1', showQr: fd.get('showQr')==='1',
    logo: existing ? existing.logo : (isDraft ? state.newCompanyDraft.logo : ''),
    signature: existing ? existing.signature : (isDraft ? state.newCompanyDraft.signature : ''),
    stamp: existing ? existing.stamp : (isDraft ? state.newCompanyDraft.stamp : '')
  };
  const isNew = !existing;
  if(existing){ const idx = state.companies.findIndex(c=>c.id===id); state.companies[idx]=co; }
  else{ state.companies.push(co); }
  try{
    await saveCompanies();
  }catch(err){
    alert('Uložení firmy se nepovedlo, zkus to prosím znovu. (' + (err && err.message ? err.message : 'neznámá chyba') + ')');
    return;
  }
  state.newCompanyDraftId = null;
  state.newCompanyDraft = {logo:'',signature:'',stamp:''};
  if(isNew){
    state.view='company-form';
    state.editingCompanyId=co.id;
    state.companyNotice='Firma byla vytvořena. Teď můžeš nahrát logo, podpis a razítko.';
  } else {
    state.view='settings';
    state.editingCompanyId=null;
    state.companyNotice = (state.companies[0] && state.companies[0].id===co.id)
      ? 'Hlavní firma byla uložena.'
      : `Firma „${co.name||'bez názvu'}“ byla uložena.`;
  }
  render();
}

/* ---------- BRANDING (logo / podpis / razítko) ---------- */
function resizeImageFile(file, maxDim = 480, quality = 0.86){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Soubor se nepodařilo přečíst.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Obrázek se nepodařilo zpracovat.'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleBrandingUpload(field, file, companyId){
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Vyber prosím obrázek (PNG, JPG apod.).'); return; }
  const co = companyById(companyId);
  try{
    const dataUrl = await resizeImageFile(file, field==='stamp' ? 400 : 480);
    if(co){
      co[field] = dataUrl;
      await saveCompanies();
    } else if(companyId === state.newCompanyDraftId){
      state.newCompanyDraft[field] = dataUrl;
    }
    render();
  }catch(err){
    console.error(err);
    alert('Nahrání se nepovedlo, zkus to prosím znovu.');
  }
}

async function removeBrandingImage(field, companyId){
  const co = companyById(companyId);
  if(co){
    co[field] = '';
    await saveCompanies();
  } else if(companyId === state.newCompanyDraftId){
    state.newCompanyDraft[field] = '';
  }
  render();
}

window.addEventListener('unhandledrejection', (e)=>{
  console.error('Unhandled error:', e.reason);
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason||'neznámá chyba');
  alert('Něco se nepovedlo uložit nebo načíst. Zkus akci prosím zopakovat.\n\nPodrobnost: ' + msg);
});
